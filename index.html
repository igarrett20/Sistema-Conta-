<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Activos y boletas | Grupo Garrett</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --brand:#0D6174; --brand-dark:#0A4E5D; --brand-soft:#E4F0F2;
  --ink:#1B2A33; --muted:#66737C; --line:#E2E7EA; --line-strong:#C9D1D6; --sunk:#F6F8F9;
  --pend:#A86C12; --pend-soft:#FBF1DC; --danger:#B3242D; --danger-soft:#FBE7E8; --ok:#2E7D4F; --ok-soft:#E3F2E8;
  --font:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:#fff}
body{margin:0;color:var(--ink);font:15px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.muted{color:var(--muted)}.small{font-size:13px}

.top{display:flex;align-items:center;gap:16px;padding:14px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top img{height:30px;width:auto;display:block}
.top .app-name{padding-left:16px;border-left:1px solid var(--line);color:var(--muted);font-size:14px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:13px;font-weight:700}
.test{padding:7px 28px;font-size:13px;color:var(--muted);background:var(--sunk);border-bottom:1px solid var(--line)}

main{max-width:1080px;margin:0 auto;padding:28px 24px 72px}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0 0 18px}
h2{font-size:17px;margin:0 0 12px}

.stats{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;margin-bottom:26px}
.stat{flex:1 1 200px;padding:16px 20px}
.stat+.stat{border-left:1px solid var(--line)}
.stat span{display:block;font-size:13px;color:var(--muted)}
.stat strong{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.stat.main strong{color:var(--brand);font-size:30px}
.stat small{display:block;font-size:13px;color:var(--muted)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{appearance:none;border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}

.btn{appearance:none;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;border:1px solid var(--line-strong);background:#fff;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark)}
.btn.sm{padding:5px 10px;font-size:13px}
.lnk{background:none;border:0;padding:0;color:var(--brand);font-weight:600;font-size:13px;cursor:pointer}
.lnk.red{color:var(--danger)}
.lnk:hover{text-decoration:underline}
.wide{width:100%}

.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.bar .search{flex:1;min-width:220px;max-width:380px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{appearance:none;border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.chip b{font-weight:700;margin-left:2px;opacity:.75}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:0 10px 8px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.code{font-weight:700;color:var(--brand);white-space:nowrap}
.ser{font-size:13px;letter-spacing:.02em;white-space:nowrap}
.acts{display:flex;gap:14px;justify-content:flex-end;white-space:nowrap}
.empty{color:var(--muted);font-size:14px;padding:18px 0;margin:0}
.free{color:var(--muted);font-style:italic}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:10px;white-space:nowrap}
.pill.Nueva{background:var(--ok-soft);color:var(--ok)}
.pill.Buena{background:var(--brand-soft);color:var(--brand)}
.pill.Usada{background:var(--pend-soft);color:var(--pend)}
.pill.Danada{background:var(--danger-soft);color:var(--danger)}
.kind{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-radius:5px;padding:1px 6px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}

.f{display:grid;gap:5px;margin-bottom:14px}
.f>span{font-size:13px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:8px 10px;font-size:13px;margin:0 0 12px}
.err:empty{display:none}
.info{border-radius:8px;background:var(--brand-soft);padding:10px 12px;font-size:14px;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;margin-bottom:14px}
.seg button{appearance:none;border:0;background:#fff;padding:6px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-checked="true"]{background:var(--brand);color:#fff}

.scrim{position:fixed;inset:0;background:rgba(27,42,51,.25);z-index:39;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#fff;border-left:1px solid var(--line);z-index:40;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
.drawer.open{transform:none;box-shadow:-16px 0 40px rgba(20,40,50,.15)}
.drawer header{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0}
.drawer header p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.drawer .body{padding:18px 20px;overflow-y:auto;flex:1}
.drawer footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:5px}
.x:hover{color:var(--ink);background:var(--sunk)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

.back{margin-bottom:14px}
.acta{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.box{border:1px solid var(--line);border-radius:12px;padding:18px}
.box h2{margin-bottom:4px}
.pick{list-style:none;margin:8px 0 16px;padding:0}
.pick li{border-top:1px solid var(--line)}
.pick label{display:flex;gap:10px;align-items:flex-start;padding:9px 0;cursor:pointer;font-size:14px}
.pick input{width:auto;margin-top:3px;accent-color:var(--brand)}
.pick small{display:block;color:var(--muted);font-size:12px}
.sheet{background:var(--sunk);border-radius:12px;padding:24px;overflow-x:auto}
.paper{background:#fff;width:100%;max-width:680px;min-height:860px;margin:0 auto;padding:48px 52px;box-shadow:0 1px 3px rgba(20,40,50,.12),0 8px 24px rgba(20,40,50,.06);font-family:Arial,Helvetica,sans-serif;color:#111;font-size:12.5px;line-height:1.55}
.paper h3{text-align:center;font-size:17px;margin:0 0 18px}
.paper .fecha{text-align:right;margin-bottom:14px}
.paper .ln{display:inline-block;border-bottom:1px solid #111;padding:0 6px;font-weight:700}
.paper table{font-size:11.5px;margin:12px 0 18px}
.paper th,.paper td{border:1px solid #333;padding:5px 6px;color:#111;font-size:11.5px;white-space:normal}
.paper th{background:#E8E8E8;font-weight:700}
.paper p{margin:0 0 9px;text-align:justify}
.firmas{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:70px}
.firmas div{border-top:1px solid #111;padding-top:6px}
.firmas small{display:block;color:#444}

.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{margin:0}
.head-acts{display:flex;gap:8px;align-items:center}
.dd{position:relative}
.dd-pop{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:290px;background:#fff;border:1px solid var(--line-strong);border-radius:12px;padding:6px;box-shadow:0 12px 30px rgba(20,40,50,.16)}
.dd.open .dd-pop{display:block}
.dd-pop button{appearance:none;display:block;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:10px 12px;cursor:pointer}
.dd-pop button:hover{background:var(--brand-soft)}
.dd-pop small{display:block;color:var(--muted);font-size:13px}
.who{display:flex;gap:10px;align-items:center}
.eqline{padding:2px 0}
.eqline .pill{margin-left:4px;font-size:11px;padding:1px 8px}
.step{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:18px 0 8px}
.step:first-of-type{margin-top:4px}
.step i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px}
.drawer .pick{max-height:260px;overflow-y:auto;border-bottom:1px solid var(--line)}
@media (max-width:860px){
  .modslot{margin-left:0;order:3;width:100%}.modslot+.right{margin-left:auto}
  .top{padding:12px 16px}.test{padding:7px 16px}
  .top .app-name{display:none}
  main{padding:20px 14px 60px}
  .stat+.stat{border-left:0;border-top:1px solid var(--line)}
  .acta{grid-template-columns:1fr}
  .paper{padding:28px 22px;min-height:0}
  .sheet{padding:12px}
  .two{grid-template-columns:1fr}
  .addrow{flex-direction:column}
  .head-acts{flex-wrap:wrap}
  .head-acts{width:100%}.head-acts .btn{flex:1}
  .dd{flex:1}.dd .btn{width:100%}
}
.pill.Sinrev{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 6px;border-radius:10px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;margin-left:7px;vertical-align:1px}
.alert{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--pend-soft);color:#6E4608;border:1px solid #EBD3A1;border-radius:10px;padding:10px 14px;margin-bottom:20px;font-size:14px}
.stat.warn strong{color:var(--pend)}
tr.due td{background:#FFFBF2}
tr.due td:first-child{box-shadow:inset 3px 0 0 var(--pend)}
.when{font-size:13px;font-weight:700;color:var(--pend);white-space:nowrap}
.when.soon{color:var(--muted);font-weight:600}
.count{display:inline-block;font-size:13px;font-weight:700;color:var(--muted);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:0 8px;margin-left:6px;vertical-align:2px}
.dt{position:relative;display:flex;align-items:center}
.dt input[type=text]{padding-right:38px}
.dt-b{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;padding:5px;border-radius:6px;display:grid;place-items:center}
.dt-b:hover{color:var(--brand);background:var(--brand-soft)}
.dt-n{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.pick.dv li{display:flex;align-items:center;gap:10px}
.pick.dv label{flex:1}
.pick.dv select{width:auto;min-width:112px;padding:5px 8px;font-size:13px}
.rev{display:flex;gap:6px;align-items:center}
.rev select{width:auto;min-width:118px;padding:5px 8px}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger:hover{background:#951C24}
.addrow{display:flex;gap:8px;max-width:520px;margin-bottom:18px}
.bar-p{height:6px;background:#fff;border-radius:3px;margin:8px 0 6px;overflow:hidden}
.bar-p span{display:block;height:100%;background:var(--brand);transition:width .2s}
.phead{display:grid;grid-template-columns:96px 1fr 96px;align-items:center;margin-bottom:16px}
.phead h3{margin:0}
.plogo{display:flex;flex-direction:column;align-items:center;gap:3px}
.plogo img{width:52px;height:auto;display:block}
.plogo span{font-size:7.5px;font-weight:700;letter-spacing:.04em;color:#0D6174;white-space:nowrap}
optgroup{font-weight:700}
.gate{max-width:560px;margin:60px auto;text-align:center}
.gate h1{margin-bottom:10px}
.gate p{color:var(--muted);margin:0 0 20px}
.emptybox{border:1px dashed var(--line-strong);border-radius:12px;padding:40px 24px;text-align:center}
.emptybox h2{margin-bottom:6px}
.emptybox p{color:var(--muted);margin:0 0 18px}
body.busy{cursor:progress}
body.busy .btn,body.busy .lnk{pointer-events:none;opacity:.6}
.modsw{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.modsw button{appearance:none;border:0;background:none;padding:6px 16px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.modsw button[aria-pressed="true"]{background:#fff;color:var(--brand);box-shadow:0 1px 2px rgba(20,40,50,.12)}
.fade{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.nb{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;align-items:start}
.emp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.emp button{appearance:none;border:1px solid var(--line-strong);background:#fff;border-radius:12px;padding:12px;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;transition:border-color .15s,box-shadow .15s}
.emp button img{height:28px;width:auto;max-width:90px;object-fit:contain}
.emp button strong{display:block;font-size:13px}
.emp button small{display:block;font-size:12px;color:var(--muted)}
.emp button[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sec:first-child{margin-top:0}
.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:#fff;border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 12px 30px rgba(20,40,50,.14);max-height:260px;overflow-y:auto;padding:4px;display:none}
.combo.open .combo-list{display:block}
.combo-list button{appearance:none;display:block;width:100%;text-align:left;border:0;background:none;border-radius:7px;padding:8px 10px;cursor:pointer;font-size:14px}
.combo-list button:hover,.combo-list button.hl{background:var(--brand-soft)}
.combo-list small{display:block;color:var(--muted);font-size:12px}
.combo-list .new{color:var(--brand);font-weight:600;border-top:1px solid var(--line);border-radius:0 0 7px 7px}
.ro{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;min-height:38px}
.ro.mono{letter-spacing:.03em}
.money{position:relative}
.money span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.money input{padding-left:28px;font-size:17px;font-weight:600}
.letras{font-size:12px;color:var(--muted);margin-top:6px;min-height:18px;text-transform:uppercase;letter-spacing:.02em}
.warn-s{font-size:13px;color:var(--pend);background:var(--pend-soft);border-radius:8px;padding:8px 10px;margin-top:8px}
.sticky{position:sticky;top:16px}
.boleta{background:#fff;max-width:640px;margin:0 auto;border-radius:6px;overflow:hidden;box-shadow:0 1px 3px rgba(20,40,50,.12),0 8px 24px rgba(20,40,50,.06);font-family:Arial,Helvetica,sans-serif;color:#1B2A33;font-size:11.5px;line-height:1.45}
.boleta .tb{height:6px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.boleta .in{padding:26px 30px 30px}
.bh{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.bh h4{margin:0 0 6px;font-size:15px;letter-spacing:.02em}
.bh dl{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin:0}
.bh dt{font-weight:700;color:#55636C}
.bh dd{margin:0}
.bn{text-align:right}
.bn img{height:46px;width:auto;max-width:170px;object-fit:contain;display:block;margin:0 0 10px auto}
.bn .num{display:inline-block;border:1.5px solid var(--c1);border-radius:8px;padding:4px 12px;text-align:center}
.bn .num small{display:block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#55636C}
.bn .num b{font-size:18px;color:var(--c1)}
.btitle{text-align:center;font-weight:700;font-size:13.5px;letter-spacing:.08em;margin:20px 0 14px;color:var(--c1)}
.bdates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.bdates div{background:#F3F6F7;border-radius:7px;padding:6px 10px}
.bdates small,.bbox small{display:block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#6B7880}
.bdates b{font-size:12px}
.bboxes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.bbox{border:1px solid #D5DDE1;border-radius:9px;padding:10px 12px}
.bbox h5{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--c1)}
.bbox .r{margin-bottom:6px}
.bbox .r b{font-size:12px;word-break:break-word}
.bbox .amt b{font-size:17px;color:var(--c1)}
.bbox .lt{font-size:9px;font-weight:700;color:#55636C;margin-top:2px;text-transform:uppercase}
.bconc{border:1px solid #D5DDE1;border-radius:9px;padding:10px 12px;margin-bottom:30px}
.bsign{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.bsign div{border-top:1px solid #1B2A33;padding-top:5px}
.bsign small{display:block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#6B7880}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff}
.kpi span{font-size:13px;color:var(--muted)}
.kpi strong{display:block;font-size:24px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.kpi.main strong{color:var(--brand)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:18px;padding:14px;background:var(--sunk);border-radius:12px}
.filters label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.filters select,.filters input{min-width:130px}
.filters .grow{flex:1;min-width:200px}
.charts{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px}
.charts2{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:22px}
.chart{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff}
.chart h3{margin:0;font-size:14px}
.chart .ch-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.chart .ch-h p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.mini{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.mini button{appearance:none;border:0;background:#fff;padding:3px 10px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.mini button+button{border-left:1px solid var(--line-strong)}
.mini button[aria-pressed="true"]{background:var(--brand);color:#fff}
.bar-r{transform-origin:bottom;transform:scaleY(0);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.on .bar-r{transform:scaleY(1)}
.hb{transform-origin:left;transform:scaleX(0);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.on .hb{transform:scaleX(1)}
.donut-s{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;flex-direction:column;gap:8px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-w{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.amt-c{text-align:right;white-space:nowrap;font-weight:600}
.emp-tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.emp-tag i{width:8px;height:8px;border-radius:50%}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;z-index:60;opacity:0;transition:opacity .12s;white-space:nowrap}
@media (max-width:960px){.nb,.charts{grid-template-columns:1fr}.sticky{position:static}}
@media (max-width:640px){.bboxes,.bdates,.emp{grid-template-columns:1fr}.boleta .in{padding:18px}.bh{flex-direction:column-reverse}.bn{text-align:left}.bn img{margin:0 0 10px}}
.pago{position:relative}
.pago.multi{border:1px solid var(--line);border-radius:12px;padding:12px 14px 2px;margin-bottom:12px;background:#fff}
.pago.nuevo{animation:popIn .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.pago-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pago-n{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:2px 10px}
.addpago{appearance:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1.5px dashed var(--line-strong);background:#fff;border-radius:10px;padding:9px;color:var(--brand);font-weight:600;font-size:14px;cursor:pointer;transition:border-color .15s,background .15s}
.addpago span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:16px;line-height:1;transition:transform .2s}
.addpago:hover{border-color:var(--brand);background:var(--brand-soft)}
.addpago:hover span{transform:rotate(90deg)}
.total-b{margin-top:12px;border-radius:10px;background:var(--brand-soft);padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.total-b span{font-size:13px;font-weight:600}
.total-b strong{font-size:18px;color:var(--brand)}
.total-b .letras{flex-basis:100%;margin:0}
.bdet{margin-bottom:30px}
.bdet h5{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--c1)}
.bdet table{width:100%;border-collapse:collapse;font-size:10.5px}
.bdet th{background:#F3F6F7;color:#55636C;font-size:9px;text-transform:uppercase;letter-spacing:.05em;padding:5px 6px;border:0;white-space:nowrap}
.bdet td{padding:5px 6px;border-bottom:1px solid #E2E7EA;vertical-align:top}
.bdet tr.tt td{background:var(--c1);color:#fff;font-weight:700;border:0}
.modslot{margin-left:auto}
.modslot+.right{margin-left:14px}
.loader{display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 0}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--brand-soft);border-top-color:var(--brand);animation:girar .8s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
.lnk.armed{background:var(--danger);color:#fff;padding:2px 9px;border-radius:6px;text-decoration:none;animation:latido .35s ease}
@keyframes latido{0%{transform:scale(.92)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.pp{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.pp select{width:auto;padding:6px 8px}
tr.eliminado td{background:#FDF3F3;opacity:.62}
tr.eliminado td:first-child{box-shadow:inset 3px 0 0 var(--danger)}
tr.eliminado .code{color:var(--danger);text-decoration:line-through}
tr.eliminado:hover td{opacity:.9}
.chip.del-chip[aria-pressed="true"]{background:var(--danger);border-color:var(--danger)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.pg{display:flex;gap:4px;align-items:center}
.pg button{appearance:none;min-width:34px;height:34px;border:1px solid var(--line-strong);background:#fff;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink)}
.pg button:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.pg button[aria-current="page"]{background:var(--brand);border-color:var(--brand);color:#fff}
.pg button:disabled{opacity:.4;cursor:default}
.pg .gap{color:var(--muted);padding:0 2px}
.seg.vista{margin:-4px 0 16px}
.seg.vista b{font-weight:700;opacity:.7;margin-left:3px}
.seg.vista button.v-del[aria-checked="true"]{background:var(--danger)}
.pill-btn{appearance:none;border:1px solid var(--line);cursor:pointer;font:inherit;font-size:11px;font-weight:600;padding:1px 8px;margin-left:4px;transition:background .15s,color .15s,border-color .15s}
.pill-btn span{display:inline-block;transition:transform .15s}
.pill-btn:hover{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
.pill-btn:hover span{transform:translateX(2px)}
tr.foco td{background:#EAF5F7}
tr.foco td:first-child{box-shadow:inset 3px 0 0 var(--brand)}
tr.flash td{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:#CDE8EC}100%{background:#EAF5F7}}
.focobox{border:1px solid var(--brand);border-radius:12px;padding:14px 16px;margin-bottom:26px;background:#fff}
.avatar.loc{background:#EEF2F4;color:var(--brand)}
tr.grp td{background:var(--sunk);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px}
tr.grp .count{vertical-align:0}
.adm{display:grid;grid-template-columns:250px minmax(0,1fr);gap:26px;align-items:start}
.adm-nav{display:flex;flex-direction:column;gap:6px;position:sticky;top:16px}
.adm-nav button{appearance:none;display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}
.adm-nav button:hover{border-color:var(--line-strong);background:var(--sunk)}
.adm-nav button[aria-current="page"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand)}
.adm-ic{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--sunk);color:var(--brand)}
.adm-nav button[aria-current="page"] .adm-ic{background:var(--brand);color:#fff}
.adm-tx{flex:1;min-width:0}
.adm-tx strong{display:block;font-size:14px}
.adm-tx small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-n{font-size:12px;font-weight:700;color:var(--muted);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:0 8px}
.adm-nav button[aria-current="page"] .adm-n{background:#fff;color:var(--brand);border-color:#BFDCE1}
.adm-body{min-width:0}
.adm-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.adm-h h2{margin:0;font-size:19px}
@media (max-width:860px){.adm{grid-template-columns:1fr;gap:16px}.adm-nav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:2px}.adm-nav button{flex:1 0 auto;width:auto;padding:8px 10px}.adm-tx small{display:none}.adm-h{display:none}}
.empgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:20px;align-items:start}
.erow{display:grid;gap:6px;margin-bottom:6px;align-items:center}
.erow.cu{grid-template-columns:76px 118px 1fr 30px}
.erow.ta{grid-template-columns:76px 118px 84px 1fr 30px}
.erow input,.erow select{padding:6px 8px;font-size:13px}
.hbrow{appearance:none;border:0;background:none;width:100%;display:grid;grid-template-columns:minmax(120px,260px) 1fr 120px;gap:12px;align-items:center;padding:5px 6px;margin:2px 0;font-size:13px;text-align:left;cursor:pointer;border-radius:7px}
.hbrow:hover{background:var(--sunk)}
.hbrow>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbt{background:#EEF2F4;border-radius:5px;height:12px;overflow:hidden}
.hbt .hb{height:100%;background:linear-gradient(90deg,var(--brand),#3FA3A8);border-radius:5px}
@media (max-width:640px){.empgrid{grid-template-columns:1fr}.erow.cu,.erow.ta{grid-template-columns:1fr 1fr 30px}.erow .iban,.erow .alias{grid-column:1/3}.hbrow{grid-template-columns:1fr 90px}.hbrow .hbt{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

class GraphError extends Error{constructor(status,msg){super(msg);this.status=status}}
async function gx(method,path,body,scopes){
  const url=path.startsWith('http')?path:'https://graph.microsoft.com/v1.0'+path;
  const r=await fetch(url,{method,headers:{Authorization:'Bearer '+await token(scopes),'Content-Type':'application/json',Prefer:'HonorNonIndexedQueriesWarningMayFailRandomly'},body:body?JSON.stringify(body):undefined});
  if(r.status===204)return null;

  if(!r.ok)throw new GraphError(r.status,j?.error?.message||r.statusText);
  return j;
}

/* Varias escrituras juntas (de 20 en 20), reintentando si SharePoint pide esperar */
async function batch(reqs,onProg){
  const out=new Array(reqs.length);
  for(let i=0;i<reqs.length;i+=20){
    let chunk=reqs.slice(i,i+20).map((r,j)=>({id:String(i+j),method:r.method,url:r.url,headers:{'Content-Type':'application/json'},body:r.body}));
    for(let t=0;chunk.length&&t<6;t++){
      const j=await gx('POST','/$batch',{requests:chunk});let retry=[],wait=0;
      for(const r of j.responses){if(r.status===429||r.status>=500){retry.push(chunk.find(c=>c.id===r.id));wait=Math.max(wait,+(r.headers?.['Retry-After']||3))}else out[+r.id]=r}
      chunk=retry;if(chunk.length)await new Promise(s=>setTimeout(s,wait*1000));
    }
    chunk.forEach(c=>out[+c.id]={status:429,body:{error:{message:'SharePoint pidió esperar demasiadas veces'}}});
    if(onProg)onProg(Math.min(i+20,reqs.length),reqs.length);
  }
  return out;
}

const ICO_PIN='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
function filasPe(){

  /* Ubicaciones (y equipos sin asignar), mostradas igual que una persona */

  $('filasPe').innerHTML=(ps.length||us.length)?

/* ---------- Equipos ---------- */
function tEq(){
  if(!S.todos.length)return vacio('Agrega el primer equipo','Registra código, serie y fecha de compra, o carga todo de una vez desde Excel.','<button class="btn primary" onclick="dAgregar()">Agregar equipo</button> <button class="btn" onclick="dImportar()">Importar desde Excel</button>');
  const cnt=c=>S.equipos.filter(x=>!c||x.cat===c).length,nd=S.todos.length-S.equipos.length+S.fant.length,vi=V.vista||'todos';
  const ch=(c,l)=>`<button class="chip" aria-pressed="${V.cat===c}" onclick="V.cat=${js(c)};V.pg=1;render()">${esc(l)} <b>${cnt(c)}</b></button>`;
  return `<div class="bar"><input class="search" placeholder="Buscar por código, serie, persona o ubicación" value="${esc(V.q)}" oninput="V.q=this.value;V.pg=1;filas()">
   <label class="pp">Mostrar<select onchange="V.ps=+this.value;V.pg=1;filas()">${[20,50,0].map(n=>`<option value="${n}"${(V.ps??20)===n?' selected':''}>${n?n+' por página':'Todos'}</option>`).join('')}</select></label></div>
  <div class="chips">${ch('','Todos')}${cats().map(c=>ch(c,c)).join('')}</div>
  ${nd?`<div class="seg vista" role="radiogroup" aria-label="Mostrar equipos">${[['todos','Todos',S.equipos.length+nd],['activos','Activos',S.equipos.length],['elim','Eliminados',nd]].map(([k,l,n])=>`<button role="radio" aria-checked="${vi===k}" class="${k==='elim'?'v-del':''}" onclick="V.vista='${k}';V.pg=1;render()">${l} <b>${n}</b></button>`).join('')}</div>`:''}
  <div class="tbl"><table><thead><tr><th>Código</th><th>Equipo</th><th>Serie</th><th>Estado</th><th>Responsable</th><th></th></tr></thead><tbody id="filas"></tbody></table></div>
  <div class="pager" id="pager"></div>`;
}
function filas(){
  const q=lc(V.q),ps=V.ps??20;
  const vi=V.vista||'todos';
  const r=[...S.todos,...S.fant].filter(x=>(vi==='todos'||(vi==='elim'?x.del:!x.del))&&(!V.cat||x.cat===V.cat||(x.ghost&&vi==='elim'))&&(!q||lc([x.cod,x.eq,x.serie,donde(x),P(x.asig)?.ced,x.del?'eliminado '+x.delM+' '+(x.de||''):''].join(' ')).includes(q)))
    .sort((a,b)=>a.cod.localeCompare(b.cod,undefined,{numeric:true}));
  const pags=ps?Math.max(1,Math.ceil(r.length/ps)):1;V.pg=Math.min(Math.max(1,V.pg||1),pags);
  const vis=ps?r.slice((V.pg-1)*ps,V.pg*ps):r;
  $('filas').innerHTML=vis.length?vis.map(x=>{const p=P(x.asig);
   if(x.ghost)return `<tr class="eliminado"><td class="code">${esc(x.cod)}</td>
    <td><span class="free">Datos no disponibles</span><p>Se eliminó con la versión anterior del sistema</p></td><td class="ser">—</td>
    <td><span class="pill Danada">Eliminado</span></td><td><span class="free">${x.delF?'El '+fCorta(x.delF):''}${x.delM?' · '+esc(x.delM):''}</span>${x.de?`<p>Estaba con ${esc(x.de)}</p>`:''}</td><td></td></tr>`;
   if(x.del)return `<tr class="eliminado"><td class="code">${esc(x.cod)}</td>
    <td>${esc(x.eq)}<p>${esc(x.cat)}${x.fadq?' · Compra '+fCorta(x.fadq):''}</p></td><td class="ser">${esc(x.serie)}</td>
    <td><span class="pill Danada">Eliminado</span></td><td><span class="free">${x.delF?'El '+fCorta(x.delF):''}${x.delM?' · '+esc(x.delM):''}</span></td>
    <td><div class="acts"><button class="lnk" onclick="restaurarEquipo(${js(x.cod)})">Restaurar</button></div></td></tr>`;
   return `<tr>
   <td class="code">${esc(x.cod)}</td>
   <td>${esc(x.eq)}<p>${esc(x.cat)}${x.fadq?' · Compra '+fCorta(x.fadq):''}${x.obs?' · '+esc(x.obs):''}</p></td>
   <td class="ser">${esc(x.serie)}</td>
   <td>${pill(x.cond)}</td>
   <td>${p?`${esc(p.nombre)}<p>Céd. ${esc(p.ced)}</p>`:x.ubic?lugar(x.ubic):'<span class="free">Sin asignar</span>'}</td>
   <td><div class="acts">${p?`<button class="lnk" onclick="abrirActa(${p.id},[${js(x.cod)}])">Acta</button>`:''}<button class="lnk" onclick="dCambio(${js(origenDe(x))},${js(x.cod)})">${p?'Cambiar responsable':'Asignar'}</button><button class="lnk" onclick="dEditarEquipo(${js(x.cod)})">Editar</button><button class="lnk red" onclick="dBorrarEquipo(${js(x.cod)})">Eliminar</button></div></td></tr>`}).join('')
  :'<tr><td colspan="6"><p class="empty">No hay equipos que coincidan con la búsqueda.</p></td></tr>';
  /* paginación */
  const pg=V.pg,ini=r.length?(ps?(pg-1)*ps+1:1):0,fin=ps?Math.min(pg*ps,r.length):r.length;
  let nums=[];if(pags>1){const set=new Set([1,pags,pg-1,pg,pg+1].filter(n=>n>=1&&n<=pags));nums=[...set].sort((a,b)=>a-b)}
  $('pager').innerHTML=`<span class="small muted">Mostrando ${ini}–${fin} de ${r.length}</span>${pags>1?`<div class="pg">
    <button aria-label="Página anterior" ${pg===1?'disabled':''} onclick="irPag(${pg-1})">‹</button>
    ${nums.map((n,i)=>(i&&n-nums[i-1]>1?'<span class="gap">…</span>':'')+`<button ${n===pg?'aria-current="page"':''} onclick="irPag(${n})">${n}</button>`).join('')}
    <button aria-label="Página siguiente" ${pg===pags?'disabled':''} onclick="irPag(${pg+1})">›</button></div>`:''}`;
}
function irPag(n){V.pg=n;filas();$('filas')?.closest('.tbl')?.scrollIntoView?.({behavior:'smooth',block:'start'})}

/* Editar los datos de un equipo (el código no se cambia porque el historial lo usa) */

  const x=E(cod);if(!x)return;
  abrir(`<header><div><h2>Editar equipo</h2><p>${esc(x.cod)} · el código no se puede cambiar.</p></div><button class="x" aria-label="Cerrar" onclick="cerrar()">×</button></header>

   ${fl('Equipo',`<input id="ed-eq" value="${esc(x.eq)}">`)}
   <div class="two">${fl('Serie',`<input id="ed-serie" value="${esc(x.serie)}" placeholder="Vacío si no tiene">`)}${fl('Categoría',`<select id="ed-cat">${opts(cats().includes(x.cat)||!x.cat?cats():[x.cat,...cats()],x.cat)}</select>`)}</div>
   <div class="two">${fl('Estado',`<select id="ed-cond">${opts(CONDICIONES,x.cond)}</select>`)}${fl('Fecha de compra',dateField('ed-fadq',x.fadq))}</div>
   ${fl('Observaciones',`<input id="ed-obs" value="${esc(x.obs)}">`)}
   <p class="small muted">Si cambias la fecha de compra, la próxima revisión anual se recalcula con la fecha nueva.</p>
  </div>
  <footer><button class="btn" onclick="cerrar()">Cancelar</button><button class="btn primary" onclick="gEditarEquipo(${js(cod)})">Guardar cambios</button></footer>`);
  setTimeout(()=>$('ed-serie')?.focus(),200);

function gEditarEquipo(cod){
  const x=E(cod),v=id=>$(id).value.trim(),n={eq:v('ed-eq'),serie:v('ed-serie')||'N/A',cat:v('ed-cat'),cond:v('ed-cond'),obs:v('ed-obs'),fadq:fv('ed-fadq')};
  if(!n.eq)return $('err').textContent='Escribe el nombre del equipo.';
  if($('ed-fadq').value.trim()&&!n.fadq)return $('err').textContent='Escribe una fecha de compra válida (dd/mm/aaaa).';
  const etq={eq:'Equipo',serie:'Serie',cat:'Categoría',cond:'Estado',obs:'Observaciones',fadq:'Fecha de compra'};
  const cambios=Object.keys(etq).filter(k=>(n[k]||'')!==(x[k]||''));
  if(!cambios.length){cerrar();return toast('No hubo cambios.')}
  const f={Equipo:n.eq,Serie:n.serie,Categoria:n.cat,Condicion:n.cond,Observaciones:n.obs};
  if(cambios.includes('fadq')){f.FechaAdquisicion=wd(n.fadq);
    let k='';if(n.fadq){if(x.ult){k=addY(n.fadq,+x.ult.slice(0,4)-+n.fadq.slice(0,4));while(k<=x.ult)k=addY(k,1)}else k=proxInicial(n.fadq)}f.ProximaRevision=wd(k)}
  const det=cambios.map(k=>k==='serie'?`serie ${x.serie} → ${n.serie}`:k==='fadq'?`compra ${fCorta(x.fadq)||'—'} → ${fCorta(n.fadq)||'—'}`:etq[k].toLowerCase()).join(', ');
  cerrar();
  act(async()=>{await setItem('equipos',x.sid,f);await addItem('historial',{Title:cod,Fecha:wd(hoy()),De:'',A:('Editado: '+det).slice(0,250),Registro:yo()})},'Equipo '+cod+' actualizado');
}
function restaurarEquipo(cod){
  const x=EA(cod),u=S.ubic.find(q=>q.nombre==='Bodega')?.nombre||S.ubic[0]?.nombre||'';

    ()=>act(async()=>{await setItem('equipos',x.sid,{Eliminado:false,EliminadoFecha:null,EliminadoMotivo:'',Ubicacion:u,ResponsableId:0,ProximaRevision:wd(proxInicial(x.fadq))});
      await addItem('historial',{Title:cod,Fecha:wd(hoy()),De:'',A:'Restaurado'+(u?' a '+u:''),Registro:yo()})},'Equipo '+cod+' restaurado'));

/* ---------- Revisión anual ---------- */
function tRev(){
  const t=hoy(),lim=addD(t,CONFIG.diasAviso);
  const pend=pendientes().sort((a,b)=>a.prox.localeCompare(b.prox)||a.cod.localeCompare(b.cod));
  const prox=S.equipos.filter(x=>x.prox>t&&x.prox<=lim).sort((a,b)=>a.prox.localeCompare(b.prox));
  const sig=S.equipos.filter(x=>x.prox>lim).sort((a,b)=>a.prox.localeCompare(b.prox)).slice(0,5);
  const foco=V.revFoco&&E(V.revFoco),enLista=foco&&foco.prox&&foco.prox<=lim;
  const fila=(x,due,temprano)=>{const d=dias(x.prox);return `<tr id="rvrow-${x.sid}" class="${due?'due':''}${foco&&foco.sid===x.sid?' foco':''}">
   <td class="code">${esc(x.cod)}</td>
   <td>${esc(x.eq)}<p>${esc(x.cat)} · Serie ${esc(x.serie)}</p></td>
   <td>${x.asig?esc(donde(x)):x.ubic?lugar(x.ubic):'<span class="free">Sin asignar</span>'}</td>
   <td>${fCorta(x.fadq)}<p>${anios(x.fadq)}</p></td>
   <td><span class="when${due?'':' soon'}">${due?(d===0?'Cumple año hoy':'Cumplió año el '+fCorta(x.prox)):'Cumple año en '+plural(d,'día','días')}</span>${x.ult?`<p>Última revisión ${fCorta(x.ult)}</p>`:''}</td>
   <td><div class="rev"><select id="rv-${x.sid}" aria-label="Estado de ${esc(x.cod)}">${opts(CONDICIONES,x.cond)}</select><button class="btn sm primary" onclick="guardarRev(${x.sid}${temprano?',1':''})">Guardar</button></div></td></tr>`};
  const tabla=(rows,due,temprano)=>`<div class="tbl"><table><thead><tr><th>Código</th><th>Equipo</th><th>Responsable</th><th>Compra</th><th>Aniversario</th><th>Estado</th></tr></thead><tbody>${rows.map(x=>fila(x,due,temprano)).join('')}</tbody></table></div>`;
  return `<p class="small muted" style="margin:-6px 0 18px">Cada activo se revisa una vez al año, en el aniversario de su fecha de compra. Al guardar el estado, la siguiente revisión pasa al próximo aniversario.</p>
  ${foco&&!enLista?`<div class="focobox"><div class="ch-h" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">Equipo seleccionado</h2><button class="lnk" onclick="V.revFoco=null;render()">Quitar</button></div>
   <p class="small muted" style="margin:4px 0 10px">${foco.prox?'Todavía no cumple año. Puedes registrar su estado ya; su revisión anual del '+fCorta(foco.prox)+' se mantiene.':'No tiene fecha de compra, así que no entra en la revisión anual. Igual puedes registrar su estado.'}</p>${tabla([foco],false,true)}</div>`:''}
  <h2>Pendientes de revisión <span class="count">${pend.length}</span></h2>
  ${pend.length?tabla(pend,true):'<p class="empty">No hay activos pendientes. Todo al día.</p>'}
  <h2 style="margin-top:30px">Cumplen año en los próximos ${CONFIG.diasAviso} días <span class="count">${prox.length}</span></h2>
  ${prox.length?tabla(prox,false):'<p class="empty">Ningún activo cumple año en los próximos '+CONFIG.diasAviso+' días.</p>'}
  ${sig.length?`<h2 style="margin-top:30px">Siguientes</h2><div class="tbl"><table><tbody>${sig.map(x=>`<tr><td class="code">${esc(x.cod)}</td><td>${esc(x.eq)}</td><td>${x.asig?esc(donde(x)):lugar(x.ubic||'Sin asignar')}</td><td class="muted">Cumple año el ${fCorta(x.prox)}</td></tr>`).join('')}</tbody></table></div>`:''}`;
}
/* Desde Personal: lleva a Revisión con ese equipo resaltado */
function irRevision(cod){V.tab='rev';V.view='list';V.revFoco=cod;render();
  const x=E(cod),el=x&&$('rvrow-'+x.sid);if(el){el.scrollIntoView?.({behavior:'smooth',block:'center'});el.classList.add('flash');setTimeout(()=>$('rv-'+x.sid)?.focus({preventScroll:true}),500)}}
function guardarRev(sid,temprano){
  const x=S.equipos.find(q=>q.sid===sid),est=$('rv-'+sid).value,next=temprano?x.prox:proxSiguiente(x.prox),t=hoy();
  if(V.revFoco===x.cod)V.revFoco=null;
  act(async()=>{
    await setItem('equipos',sid,temprano?{Condicion:est,UltimaRevision:wd(t)}:{Condicion:est,UltimaRevision:wd(t),ProximaRevision:wd(next)});
    await addItem('historial',{Title:x.cod,Fecha:wd(t),De:'',A:'Revisión: '+est,Registro:yo()});
  },`${x.cod} revisado como ${est}.${next?' Próxima revisión: '+fCorta(next):''}`);
}

  hi:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>'};

/* ---------- Categorías ---------- */
function tCat(){
  const n=c=>S.equipos.filter(x=>x.cat===c).length;
  const otras=[...new Set(S.equipos.map(x=>x.cat).filter(c=>c&&!cats().includes(c)))];
  return `<div class="addrow"><input id="c-n" placeholder="Nueva categoría, por ejemplo Equipo de Audio" onkeydown="if(event.key==='Enter')agregarCat()"><button class="btn primary" onclick="agregarCat()">Agregar categoría</button></div>
  ${S.cats.length?`<div class="tbl"><table><thead><tr><th>Categoría</th><th>Equipos</th><th></th></tr></thead><tbody>${S.cats.map(c=>`<tr>
   <td><strong>${esc(c.nombre)}</strong></td><td>${n(c.nombre)?`<button class="lnk" onclick="V.tab='eq';V.cat=${js(c.nombre)};V.vista='todos';V.pg=1;render()">${plural(n(c.nombre),'equipo','equipos')}</button>`:'<span class="free">Sin equipos</span>'}</td>
   <td><div class="acts"><button class="lnk" onclick="dEditarCat(${c.id})">Cambiar nombre</button>${n(c.nombre)?'':`<button class="lnk red" onclick="dBorrarCat(${c.id})">Eliminar</button>`}</div></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">No hay categorías registradas.</p>'}
  ${otras.length?`<div class="warn-s" style="margin-top:16px">Hay equipos con categorías que no están en la lista: ${otras.map(o=>`<strong>${esc(o)}</strong> <button class="lnk" onclick="agregarCat(${js(o)})">agregarla</button>`).join(' · ')}</div>`:''}`;
}
function agregarCat(nombre){
  const n=(nombre??$('c-n').value).trim().replace(/\s+/g,' ');
  if(!n)return toast('Escribe el nombre de la categoría.');
  if(S.cats.some(c=>lc(c.nombre)===lc(n)))return toast('Esa categoría ya existe.');
  act(()=>addItem('categorias',{Title:n}),'Categoría '+n+' agregada');
}
function dEditarCat(id){
  const c=S.cats.find(x=>x.id===id),n=S.todos.filter(x=>x.cat===c.nombre).length;
  abrir(`<header><div><h2>Cambiar nombre</h2><p>Categoría ${esc(c.nombre)}</p></div><button class="x" aria-label="Cerrar" onclick="cerrar()">×</button></header>
  <div class="body"><div class="err" id="err"></div>${fl('Nombre',`<input id="ce-n" value="${esc(c.nombre)}">`)}
  ${n?`<p class="small muted">Los ${plural(n,'equipo','equipos')} de esta categoría se actualizan con el nombre nuevo.</p>`:''}</div>
  <footer><button class="btn" onclick="cerrar()">Cancelar</button><button class="btn primary" onclick="gEditarCat(${id})">Guardar</button></footer>`);
  setTimeout(()=>$('ce-n')?.select(),200);
}
function gEditarCat(id){
  const c=S.cats.find(x=>x.id===id),n=$('ce-n').value.trim().replace(/\s+/g,' ');
  if(!n)return $('err').textContent='Escribe el nombre.';
  if(n===c.nombre){cerrar();return}
  if(S.cats.some(x=>x.id!==id&&lc(x.nombre)===lc(n)))return $('err').textContent='Ya existe una categoría con ese nombre.';
  const eqs=S.todos.filter(x=>x.cat===c.nombre);cerrar();
  act(async()=>{
    await setItem('categorias',id,{Title:n});
    if(eqs.length){const r=await batch(eqs.map(x=>({method:'PATCH',url:`${LP('equipos')}/items/${x.sid}/fields`,body:{Categoria:n}})));
      const f=r.filter(x=>x.status>=300).length;if(f)throw new Error(`${f} equipos no se pudieron actualizar; vuelve a guardar el nombre.`)}
    if(V.cat===c.nombre)V.cat=n;
  },`Categoría renombrada a ${n}${eqs.length?' ('+plural(eqs.length,'equipo actualizado','equipos actualizados')+')':''}`);
}
function dBorrarCat(id){
  const c=S.cats.find(x=>x.id===id);
  if(S.equipos.some(x=>x.cat===c.nombre))return toast('Esa categoría todavía tiene equipos. Cámbialos primero.');
  confirmar('Eliminar categoría',`¿Eliminar la categoría <strong>${esc(c.nombre)}</strong>? No tiene equipos.`,'Eliminar categoría',()=>act(()=>delItem('categorias',id),'Categoría '+c.nombre+' eliminada'));
}

function agregarUb(){

function dBorrarUb(id){

/* ---------- Campos de fecha en formato dd/mm/aaaa (sin depender del idioma del navegador) ---------- */
const aDMY=k=>{if(!k)return'';const[y,m,d]=k.split('-');return d+'/'+m+'/'+y};
function fv(id){const el=$(id);if(!el)return '';const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(el.value.trim());if(!m)return '';const k=m[3]+'-'+m[2]+'-'+m[1],d=new Date(k+'T12:00:00');return !isNaN(d)&&kOf(d)===k?k:''}
function mascara(el){let v=el.value.replace(/\D/g,'').slice(0,8);if(v.length>4)v=v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);else if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);el.value=v}
function calendario(id){const n=$(id+'-n');n.value=fv(id)||hoy();try{n.showPicker()}catch(e){n.focus();n.click()}}
function desdeCal(id,k){if(!k)return;const el=$(id);el.value=aDMY(k);el.dispatchEvent(new Event('input',{bubbles:true}))}
const ICO_CAL='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>';
function dateField(id,k,extra){return `<span class="dt"><input id="${id}" type="text" inputmode="numeric" autocomplete="off" placeholder="dd/mm/aaaa" maxlength="10" value="${aDMY(k)}" oninput="mascara(this)${extra?';'+extra:''}"><button type="button" class="dt-b" aria-label="Abrir calendario" onclick="calendario('${id}')">${ICO_CAL}</button><input type="date" class="dt-n" id="${id}-n" tabindex="-1" aria-hidden="true" onchange="desdeCal('${id}',this.value)"></span>`}

/* ---------- Drawer ---------- */
function abrir(h){const d=$('drawer');d.innerHTML=h;d.classList.add('open');d.setAttribute('aria-hidden','false');$('scrim').classList.add('open')}
function cerrar(){if(V.imp?.corriendo)return;$('drawer').classList.remove('open');$('drawer').setAttribute('aria-hidden','true');$('scrim').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrar()});
const fl=(l,h)=>`<label class="f"><span>${l}</span>${h}</label>`;
const chk=(x,on)=>`<li><label><input type="checkbox" class="d-chk" value="${esc(x.cod)}"${on?' checked':''}><span><strong>${esc(x.cod)}</strong> ${esc(x.eq)}<small>${esc(x.cat)} · Serie ${esc(x.serie)}${!x.asig?' · '+esc(x.ubic||'Sin asignar'):''}</small></span></label></li>`;
const marcados=()=>[...document.querySelectorAll('.d-chk:checked')].map(i=>i.value);
const libres=()=>S.equipos.filter(x=>!x.asig);
function validarPersona(n,c){
  if(!n||!c)return 'Ingresa el nombre completo y la cédula.';
  if(!/^\d-\d{4}-\d{4}$/.test(c))return 'La cédula debe tener el formato 1-1234-5678.';
  const p=S.personas.find(q=>q.ced===c);if(p)return 'Esa cédula ya está registrada a nombre de '+p.nombre+'.';
  return '';
}
function confirmar(titulo,texto,boton,fn){
  abrir(`<header><div><h2>${titulo}</h2></div><button class="x" aria-label="Cerrar" onclick="cerrar()">×</button></header>
  <div class="body"><p style="margin:0">${texto}</p><p class="small muted">Si fue un error, se puede recuperar desde la papelera de reciclaje del sitio de SharePoint durante 93 días.</p><div id="c-extra"></div></div>
  <footer><button class="btn" onclick="cerrar()">Cancelar</button><button class="btn danger" id="c-go">${boton}</button></footer>`);
  $('c-go').onclick=()=>{cerrar();fn()};
}

/* Agregar personal */
function dPersona(){
  const dis=libres();
  abrir(`<header><div><h2>Agregar personal</h2><p>Registra al colaborador y, si quieres, entrégale equipo de una vez.</p></div><button class="x" aria-label="Cerrar" onclick="cerrar()">×</button></header>
  <div class="body"><div class="err" id="err"></div>
   ${fl('Nombre completo','<input id="p-n" placeholder="Nombre y dos apellidos">')}
   ${fl('Cédula','<input id="p-c" placeholder="1-1234-5678">')}
   <div class="step">Entregar equipo ahora <span class="muted">(opcional)</span></div>
   ${dis.length?`<ul class="pick">${dis.map(x=>chk(x,false)).join('')}</ul>${fl('Fecha de entrega',dateField('p-f',hoy()))}`:'<p class="small muted">No hay equipos en ubicaciones. Puedes asignarle equipo después con Cambio de responsable.</p>'}
  </div>
  <footer><button class="btn" onclick="cerrar()">Cancelar</button><button class="btn primary" onclick="gPersona()">Guardar</button></footer>`);
  setTimeout(()=>$('p-n')?.focus(),200);
}
function gPersona(){
  const n=$('p-n').value.trim().replace(/\s+/g,' '),c=$('p-c').value.trim(),m=marcados();
  const v=validarPersona(n,c);if(v)return $('err').textContent=v;
  const f=$('p-f')?fv('p-f'):hoy();if(m.length&&!f)return $('err').textContent='Escribe una fecha de entrega válida (dd/mm/aaaa).';
  cerrar();
  act(async()=>{const id=await nuevaPersona(n,c);S.personas.push({id,nombre:n,ced:c});if(m.length)await mover(m,{t:'p',id},f);return id},
    m.length?`${n} registrado con ${plural(m.length,'equipo','equipos')}`:`${n} registrado`,
    id=>{if(m.length)abrirActa(id,m,f);else{V.tab='pe';render()}});
}
function dBorrarPersona(id){
  const p=P(id),m=S.equipos.filter(x=>x.asig===id);
  if(m.length)return toast(`${p.nombre} tiene ${plural(m.length,'equipo','equipos')}. Pásalos a otra persona o a una ubicación primero.`);
  confirmar('Eliminar colaborador',`¿Eliminar a <strong>${esc(p.nombre)}</strong> (céd. ${esc(p.ced)})? No tiene equipos a su nombre. Su historial de movimientos se conserva.`,'Eliminar colaborador',
    ()=>act(()=>delItem('personal',id),p.nombre+' eliminado'));
}

/* Agregar equipo */
function selResp(sel){return `<optgroup label="Ubicaciones">${S.ubic.map(u=>`<option value="${esc('u:'+u.nombre)}"${'u:'+u.nombre===sel?' selected':''}>${esc(u.nombre)}</option>`).join('')}</optgroup>
  <optgroup label="Personal">${[...S.personas].sort(porNombre).map(p=>`<option value="p:${p.id}"${'p:'+p.id===sel?' selected':''}>${esc(p.nombre)}</option>`).join('')}</optgroup>`}
function dAgregar(){
  abrir(`<header><div><h2>Agregar equipo</h2><p>Queda registrado en el inventario.</p></div><button class="x" aria-label="Cerrar" onclick="cerrar()">×</button></header>
  <div class="body"><div class="err" id="err"></div>
   <div class="two">${fl('Código','<input id="n-cod" placeholder="AI0110">')}${fl('Serie','<input id="n-serie" placeholder="Vacío si no tiene">')}</div>
   ${fl('Equipo','<input id="n-eq" placeholder="Computador Portátil">')}
   <div class="two">${fl('Categoría',`<select id="n-cat">${opts(cats())}</select>`)}${fl('Estado',`<select id="n-cond">${opts(CONDICIONES,'Nueva')}</select>`)}</div>
   <div class="two">${fl('Fecha de compra',dateField('n-fadq',hoy()))}${fl('Responsable o ubicación',`<select id="n-dest">${selResp('u:Bodega')}</select>`)}</div>
   ${fl('Observaciones','<input id="n-obs" placeholder="Incluye cargador">')}
  </div>
  <footer><button class="btn" onclick="cerrar()">Cancelar</button><button class="btn primary" onclick="gAgregar()">Guardar equipo</button></footer>`);
  setTimeout(()=>$('n-cod')?.focus(),200);

function gAgregar(){
  const v=id=>$(id).value.trim(),cod=v('n-cod').toUpperCase(),eq=v('n-eq'),serie=v('n-serie')||'N/A',fadq=fv('n-fadq'),dest=v('n-dest');
  if(!cod||!eq)return $('err').textContent='Completa código y equipo.';
  if(!/^[A-Z0-9-]+$/.test(cod))return $('err').textContent='El código solo puede tener letras, números y guiones.';
  if(EA(cod))return $('err').textContent='Ya existe un equipo con el código '+cod+(EA(cod).del?' (eliminado).':'.');
  if(!fadq)return $('err').textContent='Escribe una fecha de compra válida (dd/mm/aaaa).';
  if(!dest)return $('err').textContent='Elige un responsable o una ubicación.';
  const pid=dest.startsWith('p:')?+dest.slice(2):null,ub=dest.startsWith('u:')?dest.slice(2):'',t=hoy();
  cerrar();
  act(async()=>{
    await addItem('equipos',{Title:cod,Equipo:eq,Categoria:v('n-cat'),Serie:serie,Condicion:v('n-cond'),Observaciones:v('n-obs'),ResponsableId:pid||0,Ubicacion:ub,FechaAdquisicion:wd(fadq),ProximaRevision:wd(proxInicial(fadq))});
    await addItem('historial',{Title:cod,Fecha:wd(t),De:'',A:pid?P(pid).nombre:ub,Registro:yo()});
  },'Equipo '+cod+' agregado',()=>{if(pid)abrirActa(pid,[cod],t);else{V.tab='eq';render()}});
}
function dBorrarEquipo(cod){
  const x=E(cod);
  confirmar('Eliminar activo',`¿Eliminar <strong>${esc(x.cod)}</strong> · ${esc(x.eq)} (serie ${esc(x.serie)})? Está con <strong>${esc(donde(x))}</strong>.`,'Eliminar activo',
    ()=>act(async()=>{await setItem('equipos',x.sid,{Eliminado:true,EliminadoFecha:wd(hoy()),EliminadoMotivo:motivo,ResponsableId:0,Ubicacion:''});await addItem('historial',{Title:cod,Fecha:wd(hoy()),De:donde(x),A:'Eliminado'+(motivo?': '+motivo:''),Registro:yo()})},'Activo '+cod+' eliminado'));
  $('drawer').querySelector('.body p.small').textContent='El equipo queda en la lista marcado como eliminado, para no perder el consecutivo. Se puede restaurar si fue un error.';
  $('c-extra').innerHTML=fl('Motivo (opcional)','<input id="c-mot" placeholder="Dado de baja, vendido, extraviado…">');
  let motivo='';$('c-mot').oninput=e=>motivo=e.target.value.trim();
}

/* Cambio de responsable: origen -> equipos -> destino (persona o ubicación) */
function origenes(){
  const o=[...S.personas].filter(p=>S.equipos.some(x=>x.asig===p.id)).sort(porNombre).map(p=>({v:'p:'+p.id,l:p.nombre,g:'Personal'}));
  S.ubic.filter(u=>S.equipos.some(x=>!x.asig&&x.ubic===u.nombre)).forEach(u=>o.push({v:'u:'+u.nombre,l:u.nombre,g:'Ubicaciones'}));
  if(S.equipos.some(x=>!x.asig&&!x.ubic))o.push({v:'n:',l:'Sin asignar',g:'Ubicaciones'});
  return o;
}
function dCambio(origen,cod,destino){
  const os=origenes();
  if(!os.length)return toast('Todavía no hay equipos registrados.');
  if(!origen||!os.some(o=>o.v===origen))origen=(os.find(o=>o.v==='u:Bodega')||os.find(o=>o.g==='Ubicaciones')||os[0]).v;
  V.cb={origen,cod:cod||null,modo:'exist',destino:destino||null};
  const grp=g=>{const l=os.filter(o=>o.g===g);return l.length?`<optgroup label="${g}">${l.map(o=>`<option value="${esc(o.v)}"${o.v===origen?' selected':''}>${esc(o.l)}</option>`).join('')}</optgroup>`:''};
  abrir(`<header><div><h2>Cambio de responsable</h2><p>Elige dónde está el equipo, qué equipos pasan y a quién o a dónde.</p></div><button class="x" aria-label="Cerrar" onclick="cerrar()">×</button></header>
  <div class="body"><div class="err" id="err"></div>
   <div class="step"><i>1</i> Equipo de</div>
   <select id="c-o" onchange="V.cb.origen=this.value;V.cb.cod=null;cbEquipos();cbDestino()">${grp('Personal')}${grp('Ubicaciones')}</select>
   <div class="step"><i>2</i> Equipos que pasan <button class="lnk" style="margin-left:auto" onclick="todos()">Marcar todos</button></div>
   <ul class="pick" id="c-eq"></ul>
   <div class="step"><i>3</i> Nuevo responsable</div>
   <div class="seg" role="radiogroup"><button role="radio" id="m-e" aria-checked="true" onclick="cbModo('exist')">Personal registrado</button><button role="radio" id="m-n" aria-checked="false" onclick="cbModo('nueva')">Persona nueva</button><button role="radio" id="m-u" aria-checked="false" onclick="cbModo('ubic')">Ubicación</button></div>
   <div id="c-dest"></div>
   ${fl('Fecha',dateField('c-f',hoy()))}
  </div>
  <footer><button class="btn" onclick="cerrar()">Cancelar</button><button class="btn primary" id="c-ok" onclick="gCambio()">Guardar y generar acta</button></footer>`);
  cbEquipos();cbDestino();
}
function cbEquipos(){
  const lista=enOrigen(V.cb.origen),pers=V.cb.origen.startsWith('p:');
  $('c-eq').innerHTML=lista.length?lista.map(x=>chk(x,V.cb.cod?x.cod===V.cb.cod:pers&&lista.length===1)).join(''):'<li><p class="small muted" style="margin:8px 0">No hay equipos en esta selección.</p></li>';
  $('err').textContent='';
}
function todos(){document.querySelectorAll('.d-chk').forEach(i=>i.checked=true)}
function cbModo(m){V.cb.modo=m;[['e','exist'],['n','nueva'],['u','ubic']].forEach(([k,v])=>$('m-'+k).setAttribute('aria-checked',v===m));cbDestino()}
function cbDestino(){
  const m=V.cb.modo,o=V.cb.origen;$('err').textContent='';
  $('c-ok').textContent=m==='ubic'?'Guardar':'Guardar y generar acta';
  if(m==='exist'){const ps=[...S.personas].filter(p=>'p:'+p.id!==o).sort(porNombre);
    $('c-dest').innerHTML=ps.length?fl('Persona',`<select id="c-p">${ps.map(p=>`<option value="${p.id}"${p.id===V.cb.destino?' selected':''}>${esc(p.nombre)} · ${esc(p.ced)}</option>`).join('')}</select>`):'<p class="small muted">No hay otro personal registrado. Usa Persona nueva.</p>'}
  else if(m==='nueva')$('c-dest').innerHTML=`<div class="two">${fl('Nombre completo','<input id="c-n" placeholder="Nombre y dos apellidos">')}${fl('Cédula','<input id="c-c" placeholder="1-1234-5678">')}</div>`;
  else{const us=S.ubic.filter(u=>'u:'+u.nombre!==o);
    $('c-dest').innerHTML=us.length?fl('Ubicación',`<select id="c-u">${us.map(u=>`<option${u.nombre==='Bodega'?' selected':''}>${esc(u.nombre)}</option>`).join('')}</select>`)+'<div class="info">Los equipos pasan a esa ubicación. No se genera acta.</div>':'<p class="small muted">No hay otra ubicación. Agrégala en Administrar → Ubicaciones.</p>'}
}
function gCambio(){
  const m=marcados(),f=fv('c-f'),er=$('err'),modo=V.cb.modo;
  if(!m.length)return er.textContent='Marca al menos un equipo.';
  if(!f)return er.textContent='Escribe una fecha válida (dd/mm/aaaa).';
  let dest=null,n='',c='';
  if(modo==='exist'){const pid=$('c-p')?+$('c-p').value:null;if(!P(pid))return er.textContent='Selecciona a la nueva persona.';dest={t:'p',id:pid}}
  else if(modo==='nueva'){n=$('c-n').value.trim().replace(/\s+/g,' ');c=$('c-c').value.trim();const v=validarPersona(n,c);if(v)return er.textContent=v}

function dImportar(){
  V.imp=null;
  abrir(`<header><div><h2>Importar desde Excel</h2><p>Carga personal y equipos de una vez.</p></div><button class="x" aria-label="Cerrar" onclick="cerrar()">×</button></header>
  <div class="body"><div class="err" id="err"></div>
   <p class="small" style="margin-top:0">El archivo necesita dos hojas:</p>
   <ul class="small muted" style="padding-left:18px;margin:0 0 14px"><li><strong>Personal</strong>: Nombre, Cedula</li><li><strong>Equipos</strong>: Placa, Serie, Equipo, Categoria, Cedula, Ubicacion, FechaAdquisicion</li></ul>
   <p class="small muted">Lo que ya exista (misma cédula o misma placa) se salta, así que puedes importar el mismo archivo dos veces sin duplicar.</p>

   <div id="i-res"></div>
  </div>
  <footer><button class="btn" onclick="cerrar()">Cancelar</button><button class="btn primary" id="i-go" disabled onclick="importar()">Importar</button></footer>`);

const txt=v=>String(v??'').trim();
function fechaXL(v){if(Object.prototype.toString.call(v)==='[object Date]'&&!isNaN(v))return kOf(new Date(v.getTime()+12*3600e3));const s=txt(v);let m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);if(m)return m[3]+'-'+pad(m[2])+'-'+pad(m[1]);m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);return m?m[0]:''}
function hoja(wb,n){const k=wb.SheetNames.find(s=>lc(s)===lc(n));return k?XLSX.utils.sheet_to_json(wb.Sheets[k],{defval:''}).map(r=>{const o={};for(const c in r)o[lc(c).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'')]=r[c];return o}):null}
async function leerExcel(file){
  const er=$('err');er.textContent='';$('i-res').innerHTML='';$('i-go').disabled=true;V.imp=null;
  if(!file)return;if(!window.XLSX){try{er.textContent='Cargando el lector de Excel…';await cargarScript(XLSX_URL);er.textContent=''}catch(e){return er.textContent='No se pudo cargar el lector de Excel. Revisa la conexión a internet.'}}
  let wb;try{wb=XLSX.read(await file.arrayBuffer(),{cellDates:true})}catch(e){return er.textContent='No se pudo leer el archivo: '+e.message}
  const hp=hoja(wb,'Personal'),he=hoja(wb,'Equipos');
  if(!hp||!he)return er.textContent='El archivo necesita las hojas "Personal" y "Equipos".';
  const errores=[],cedOk=new Set(S.personas.map(p=>p.ced)),pers=[],equi=[],ubs=new Map();
  hp.forEach((r,i)=>{const n=txt(r.nombre).replace(/\s+/g,' '),c=txt(r.cedula);if(!n&&!c)return;
    if(!n||!/^\d-\d{4}-\d{4}$/.test(c)){errores.push(`Personal fila ${i+2}: nombre o cédula inválidos (${esc(n||'?')} · ${esc(c||'?')})`);return}
    if(cedOk.has(c))return;cedOk.add(c);pers.push({nombre:n,ced:c})});
  const placas=new Set(S.todos.map(x=>x.cod)),yaUb=new Set(S.ubic.map(u=>lc(u.nombre)));let saltados=0;
  he.forEach((r,i)=>{const cod=txt(r.placa).toUpperCase();if(!cod)return;
    if(placas.has(cod)){saltados++;return}
    const c=txt(r.cedula),u=txt(r.ubicacion),f=fechaXL(r.fechaadquisicion),eq=txt(r.equipo||r.elemento);
    if(!/^[A-Z0-9-]+$/.test(cod)){errores.push(`Equipos fila ${i+2}: placa inválida (${esc(cod)})`);return}
    if(!eq){errores.push(`Equipos fila ${i+2} (${esc(cod)}): falta el nombre del equipo`);return}
    if(c&&!cedOk.has(c)){errores.push(`Equipos fila ${i+2} (${esc(cod)}): la cédula ${esc(c)} no está en Personal`);return}
    if(!c&&!u){errores.push(`Equipos fila ${i+2} (${esc(cod)}): no tiene cédula ni ubicación`);return}
    if(!c&&u&&!yaUb.has(lc(u))&&!ubs.has(lc(u)))ubs.set(lc(u),u);
    placas.add(cod);
    equi.push({cod,serie:txt(r.serie)||'N/A',eq,cat:txt(r.categoria),ced:c,ubic:c?'':(S.ubic.find(x=>lc(x.nombre)===lc(u))?.nombre||ubs.get(lc(u))||u),fadq:f,cond:txt(r.condicion||r.estado)||'Sin revisar'});
  });
  const yaCat=new Set(S.cats.map(c=>lc(c.nombre))),catN=new Map();equi.forEach(x=>{const k=lc(x.cat);if(x.cat&&!yaCat.has(k)&&!catN.has(k))catN.set(k,x.cat)});
  equi.forEach(x=>{const c=S.cats.find(q=>lc(q.nombre)===lc(x.cat));if(c)x.cat=c.nombre});
  V.imp={pers,equi,ubs:[...ubs.values()],cats:[...catN.values()]};
  const sinF=equi.filter(x=>!x.fadq).length;
  $('i-res').innerHTML=`<div class="info"><strong>Listo para importar:</strong><br>${plural(pers.length,'colaborador nuevo','colaboradores nuevos')} · ${plural(equi.length,'equipo nuevo','equipos nuevos')}${V.imp.ubs.length?` · ${plural(V.imp.ubs.length,'ubicación nueva','ubicaciones nuevas')} (${V.imp.ubs.map(esc).join(', ')})`:''}${V.imp.cats.length?` · ${plural(V.imp.cats.length,'categoría nueva','categorías nuevas')} (${V.imp.cats.map(esc).join(', ')})`:''}${saltados?`<br>${plural(saltados,'equipo ya existía','equipos ya existían')} y se ${saltados===1?'salta':'saltan'}.`:''}${sinF?`<br>${plural(sinF,'equipo no tiene','equipos no tienen')} fecha de compra y no ${sinF===1?'entrará':'entrarán'} en Revisión.`:''}</div>
   ${errores.length?`<div class="err" style="display:block">${plural(errores.length,'fila no se va a importar','filas no se van a importar')}:<br>${errores.slice(0,15).join('<br>')}${errores.length>15?'<br>…':''}</div>`:''}`;
  $('i-go').disabled=!(pers.length||equi.length||V.imp.ubs.length);
}
async function importar(){
  const I=V.imp;if(!I||busy)return;I.corriendo=true;$('i-go').disabled=true;$('i-f').disabled=true;
  const res=$('i-res'),prog=(t,a,b)=>res.innerHTML=`<div class="info"><strong>${t}</strong> ${a} de ${b}<div class="bar-p"><span style="width:${b?Math.round(a/b*100):100}%"></span></div><span class="small muted">No cierres esta página.</span></div>`;
  let fallos=[];
  const ok=await act(async()=>{
    const it=k=>`${LP(k)}/items`;
    if(I.cats?.length){const r=await batch(I.cats.map(c=>({method:'POST',url:it('categorias'),body:{fields:{Title:c}}})),(a,b)=>prog('Guardando categorías…',a,b));r.forEach((x,i)=>x.status>=300&&fallos.push('Categoría '+I.cats[i]))}
    if(I.ubs.length){const r=await batch(I.ubs.map(u=>({method:'POST',url:it('ubicaciones'),body:{fields:{Title:u}}})),(a,b)=>prog('Guardando ubicaciones…',a,b));r.forEach((x,i)=>x.status>=300&&fallos.push('Ubicación '+I.ubs[i]))}
    const ids=new Map(S.personas.map(p=>[p.ced,p.id]));
    if(I.pers.length){const r=await batch(I.pers.map(p=>({method:'POST',url:it('personal'),body:{fields:{Title:p.nombre,Cedula:p.ced}}})),(a,b)=>prog('Guardando personal…',a,b));
      r.forEach((x,i)=>x.status<300?ids.set(I.pers[i].ced,+x.body.id):fallos.push('Persona '+I.pers[i].nombre))}
    const eqs=I.equi.filter(x=>!x.ced||ids.has(x.ced));
    I.equi.filter(x=>x.ced&&!ids.has(x.ced)).forEach(x=>fallos.push('Equipo '+x.cod+' (no se guardó su responsable)'));
    if(eqs.length){const r=await batch(eqs.map(x=>({method:'POST',url:it('equipos'),body:{fields:{Title:x.cod,Equipo:x.eq,Categoria:x.cat,Serie:x.serie,Condicion:x.cond,Observaciones:'',ResponsableId:x.ced?ids.get(x.ced):0,Ubicacion:x.ubic,FechaAdquisicion:wd(x.fadq),ProximaRevision:wd(proxInicial(x.fadq))}}})),(a,b)=>prog('Guardando equipos…',a,b));
      r.forEach((x,i)=>x.status>=300&&fallos.push('Equipo '+eqs[i].cod))}
    prog('Actualizando…',1,1);
  },null,()=>{I.corriendo=false;
    if(fallos.length){res.innerHTML=`<div class="err" style="display:block">Se importó todo menos ${plural(fallos.length,'registro','registros')}:<br>${fallos.slice(0,15).map(esc).join('<br>')}<br>Puedes volver a importar el mismo archivo: lo que ya entró se salta.</div>`;render()}
    else{cerrar();V.tab='pe';render();toast(`Importación lista: ${plural(I.pers.length,'colaborador','colaboradores')} y ${plural(I.equi.length,'equipo','equipos')}`)}});
  I.corriendo=false;if(!ok)$('i-f').disabled=false;
}

/* ---------- Historial ---------- */
function tHi(){
  if(!S.hist.length)return vacio('Todavía no hay movimientos','Cada entrega, cambio, revisión o eliminación queda registrada aquí.','');
  const mov=h=>{if(h.a.startsWith('Revisión: '))return `<span class="kind">Revisión</span> ${pill(h.a.slice(10))}`;
    if(h.a.startsWith('Editado: '))return `<span class="kind">Editado</span> ${esc(h.a.slice(9))}`;
    if(h.a.startsWith('Restaurado'))return `<span class="pill Nueva">${esc(h.a)}</span>`;
    if(h.a.startsWith('Eliminado'))return `${h.de?esc(h.de)+' → ':''}<span class="pill Danada">${esc(h.a)}</span>`;
    return `${h.de?esc(h.de)+' → ':'<span class="kind">Nuevo</span> '}${h.a==='Devuelto'?'<span class="pill Usada">Devuelto</span>':esc(h.a)}`};

const sinEsp=s=>String(s||'').replace(/\s+/g,'').toUpperCase();

function numLetras(x){
  const U=['','UNO','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE','VEINTE','VEINTIUNO','VEINTIDÓS','VEINTITRÉS','VEINTICUATRO','VEINTICINCO','VEINTISÉIS','VEINTISIETE','VEINTIOCHO','VEINTINUEVE'];
  const D=['','','','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
  const C=['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
  const cien=n=>{if(!n)return'';if(n===100)return'CIEN';const r=n%100,t=r<30?U[r]:D[Math.floor(r/10)]+(r%10?' Y '+U[r%10]:'');return (C[Math.floor(n/100)]+' '+t).trim()};
  const apoc=s=>s.replace(/VEINTIUNO$/,'VEINTIÚN').replace(/UNO$/,'UN');
  const mil=n=>{const m=Math.floor(n/1000),r=n%1000;return ((m===0?'':m===1?'MIL':apoc(cien(m))+' MIL')+' '+cien(r)).trim()};
  const todo=n=>{if(n===0)return'CERO';const mm=Math.floor(n/1e6),r=n%1e6;return ((mm===0?'':mm===1?'UN MILLÓN':apoc(mil(mm))+' MILLONES')+' '+mil(r)).trim()};
  const ent=Math.floor(x+1e-9),cen=Math.round((x-ent)*100);
  return todo(ent)+(cen?' CON '+todo(cen)+' CÉNTIMOS':' EXACTOS');
}
const parseM=s=>{const v=parseFloat(String(s||'').replace(/,/g,''));return isNaN(v)?0:Math.round(v*100)/100};
