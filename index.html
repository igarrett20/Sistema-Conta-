/* =====================================================================
   ESTADOS POR DEPARTAMENTO — datos en SharePoint
   Listas: EstadosCuentas (catálogo: cuenta → categoría, subcategoría, departamento) y EstadosMovimientos (cuenta, año, mes, monto, descripción)
   Montos en signo natural: ingresos y gastos en positivo; negativo solo para reversiones.
   ===================================================================== */
const ES={sub:'dash',dep:'',desde:1,hasta:1,abiertas:{},catSel:null,mes:1,q:'',pg:1,anio:+hoy().slice(0,4),cat:[],catMap:{},movAll:[],mov:[],per:null,cargado:false,ana:null};
const CTA=c=>ES.catMap[c];
const fmt0=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
const parseMe=s=>{const t=String(s||'').replace(/[₡¢\s]/g,'').replace(/,/g,'');const neg=/^\(.*\)$/.test(t);const v=parseFloat(t.replace(/[()]/g,''));return isNaN(v)?null:Math.round((neg?-v:v)*100)/100};
const compactE=n=>{const a=Math.abs(n),s=n<0?'-':'';return s+'₡'+(a>=1e6?(a/1e6).toFixed(a>=1e8?0:1)+'M':a>=1e3?(a/1e3).toFixed(0)+'k':Math.round(a))};
const tipoDeCat=cat=>sinAc(cat).startsWith('ingreso')?'I':'G';
function aniosEst(conSiguiente){const y=+hoy().slice(0,4),s=new Set([y,...ES.movAll.map(x=>x.anio)]);if(conSiguiente)s.add(y);return[...s].sort((a,b)=>b-a)}
function indexarCat(){ES.catMap={};ES.cat.forEach(c=>ES.catMap[c.cta]=c)}
function setAnio(y){ES.anio=y;ES.mov=ES.movAll.filter(x=>x.anio===y);const ult=Math.max(...mesesConDatos());
  ES.per={t:ES.per?.t||'año',m:ult,q:Math.ceil(ult/3),s:ult>6?2:1,de:1,a:ult};ES.mes=ES.mov.length?ult:(y===+hoy().slice(0,4)?+hoy().slice(5,7):1);ES.ana=null}
async function cargarEst(){
  if(G.estBen)return cargarEstBen();
  const [cs,ms]=await Promise.all([allItems('ecta'),allItems('emov')]);
  ES.cat=cs.map(i=>{const f=i.fields;return{id:+i.id,cta:(f.Title||'').trim(),nombre:f.Nombre||'',cat:f.Categoria||'',sub:f.Subcategoria||'',dep:f.Departamento||'',tipo:tipoDeCat(f.Categoria)}}).filter(c=>c.cta).sort((a,b)=>a.cta.localeCompare(b.cta));
  indexarCat();
  ES.movAll=ms.map(i=>{const f=i.fields;return{id:+i.id,cta:(f.Title||'').trim(),anio:+f.Anio||0,mes:+f.Mes||0,monto:+f.Monto||0,desc:f.Descripcion||''}}).filter(x=>x.cta&&x.anio&&x.mes>=1&&x.mes<=12);
  /* arranca en el año más reciente con datos */
  const ys=[...new Set(ES.movAll.map(x=>x.anio))];setAnio(ys.length&&!ys.includes(ES.anio)?Math.max(...ys):ES.anio);
  ES.cargado=true;
  setTimeout(syncBen,800);
}
function trasCambioEst(){ES.mov=ES.movAll.filter(x=>x.anio===ES.anio);ES.ana=null;syncBen()}

async function qAgregar(){const m=parseMe($('q-m').value),d=$('q-d').value.trim();
  if(!qCta){$('q-c').focus();return toast('Elige una cuenta de la lista.')}
  if(m==null||m===0){$('q-m').focus();return toast('Escribe el monto.')}
  const c=qCta,btn=document.querySelector('.q-b .btn');btn.disabled=true;
  try{const r=await addItem('emov',{Title:c.cta,Anio:ES.anio,Mes:ES.mes,Monto:m,Descripcion:d});
    const x={id:+r.id,anio:ES.anio,mes:ES.mes,cta:c.cta,monto:m,desc:d,nuevo:true};ES.movAll.push(x);trasCambioEst();
    $('q-m').value='';$('q-d').value='';

    document.querySelectorAll('.mes-b[aria-selected="true"] small').forEach(s=>s.textContent=fmt0(ES.mov.filter(y=>y.mes===ES.mes).length)+' mov.')}
  catch(e){console.error(e);toast('No se pudo guardar: '+(e.message||e))}finally{btn.disabled=false}}
async function gMov(id){const x=ES.movAll.find(y=>y.id===id),v=parseMe($('e-v').value);if(v==null)return $('err').textContent='Escribe un monto válido.';
  const n={cta:$('e-c').value,mes:+$('e-m').value,monto:v,desc:$('e-d').value.trim()};cerrar();

async function borrarMov(btn,id){if(!btn.classList.contains('armed')){document.querySelectorAll('.lnk.armed').forEach(b=>{b.classList.remove('armed');b.textContent='Eliminar'});btn.classList.add('armed');btn.textContent='¿Seguro?';clearTimeout(btn._t);btn._t=setTimeout(()=>{btn.classList.remove('armed');btn.textContent='Eliminar'},4000);return}
  btn.textContent='Eliminando…';
  try{await delItem('emov',id);ES.movAll=ES.movAll.filter(y=>y.id!==id);trasCambioEst();$('est-body').querySelector('.carga-h p').innerHTML=resumenMes();filasMes();toast('Movimiento eliminado')}
  catch(e){console.error(e);btn.textContent='Eliminar';toast('No se pudo eliminar: '+(e.message||e))}}
/* Guarda varios de una vez (pegar, copiar e importar) */
async function guardarVariosEst(lista,titulo,el){
  const r=await batch(lista.map(x=>({method:'POST',url:`${LP('emov')}/items`,body:{fields:{Title:x.cta,Anio:x.anio,Mes:x.mes,Monto:x.monto,Descripcion:x.desc||''}}})),
    (a,b)=>{if(el)el.innerHTML=`<div class="info"><strong>${titulo}</strong> ${a} de ${b}<div class="bar-p"><span style="width:${Math.round(a/b*100)}%"></span></div></div>`});
  let ok=0;r.forEach((res,i)=>{if(res&&res.status<300){ok++;ES.movAll.push({...lista[i],id:+res.body.id,nuevo:true})}});trasCambioEst();return{ok,fallos:lista.length-ok}}
async function aplicarPegado(){if(!_peg.length)return;const b=$('p-go');b.disabled=true;
  try{const{ok,fallos}=await guardarVariosEst(_peg.map(x=>({cta:x.c.cta,anio:ES.anio,mes:ES.mes,monto:x.m,desc:x.d})),'Guardando…',$('p-r'));cerrar();renderEst();toast(plural(ok,'movimiento agregado','movimientos agregados')+(fallos?` · ${fallos} no se guardaron, vuelve a intentarlo`:''))}
  catch(e){console.error(e);b.disabled=false;toast('No se pudo guardar: '+(e.message||e))}}
async function aplicarCopia(){const ids=[...document.querySelectorAll('#cp-l input:checked')].map(i=>+i.value);if(!ids.length)return toast('Marca al menos uno.');
  const lista=ES.mov.filter(x=>ids.includes(x.id)).map(x=>({cta:x.cta,anio:ES.anio,mes:ES.mes,monto:x.monto,desc:x.desc.replace(new RegExp(MESES[ES.mes-2]||'^$','i'),MESES[ES.mes-1])}));
  try{const{ok,fallos}=await guardarVariosEst(lista,'Copiando…',document.querySelector('#drawer .body'));cerrar();renderEst();toast(plural(ok,'movimiento copiado','movimientos copiados')+(fallos?` · ${fallos} no se guardaron`:''))}
  catch(e){console.error(e);toast('No se pudo copiar: '+(e.message||e))}}

/* ---------- Catálogo de cuentas ---------- */
async function gCta(id){const v=k=>$(k).value.trim(),o={cta:v('c-c'),nombre:v('c-n'),cat:v('c-ca'),sub:v('c-s'),dep:v('c-d')};
  if(!o.cta||!o.nombre||!o.cat||!o.sub)return $('err').textContent='Completa todos los campos.';
  if(!id&&CTA(o.cta))return $('err').textContent='Esa cuenta ya existe.';
  const f={Title:o.cta,Nombre:o.nombre,Categoria:o.cat,Subcategoria:o.sub,Departamento:o.dep};cerrar();
  try{if(id){await setItem('ecta',id,f);Object.assign(ES.cat.find(x=>x.id===id),o,{tipo:tipoDeCat(o.cat)})}
    else{const r=await addItem('ecta',f);ES.cat.push({id:+r.id,...o,tipo:tipoDeCat(o.cat)})}
    indexarCat();ES.ana=null;renderEst();toast('Cuenta guardada');syncBen()}catch(e){console.error(e);toast('No se pudo guardar: '+(e.message||e))}}

/* ---------- Importar Excel: hoja Cuentas (opcional) y hoja Movimientos ---------- */
function dImpEst(){V.imp=null;
  abrir(`<header><div><h2>Importar Excel</h2><p>Para cargas grandes, por ejemplo la carga inicial.</p></div><button class="x" aria-label="Cerrar" onclick="cerrar()">×</button></header>
  <div class="body"><div class="err" id="err"></div>
   <ul class="small muted" style="padding-left:18px;margin:0 0 12px"><li><strong>Movimientos</strong>: Cuenta, Año, Mes, Monto, Descripcion</li><li><strong>Cuentas</strong> (opcional): Cuenta, Nombre, Categoria, Subcategoria, Departamento</li></ul>
   <p class="small muted">Los meses que ya tienen movimientos se saltan, para no duplicar si importas el mismo archivo dos veces.</p>
   <label class="f"><span>Archivo</span><input type="file" id="i-f" accept=".xlsx,.xls" onchange="leerImpEst(this.files[0])"></label><div id="i-res"></div></div>
  <footer><button class="btn" onclick="cerrar()">Cancelar</button><button class="btn primary" id="i-go" disabled onclick="importarEst()">Importar</button></footer>`)}
async function leerImpEst(file){
  const er=$('err');er.textContent='';$('i-res').innerHTML='';$('i-go').disabled=true;V.imp=null;if(!file)return;
  if(!window.XLSX){try{er.textContent='Cargando el lector de Excel…';await cargarScript(XLSX_URL);er.textContent=''}catch(e){return er.textContent='No se pudo cargar el lector de Excel.'}}
  let wb;try{wb=XLSX.read(await file.arrayBuffer())}catch(e){return er.textContent='No se pudo leer el archivo: '+e.message}
  const hoja=n=>{const k=wb.SheetNames.find(s=>sinAc(s)===n);return k?XLSX.utils.sheet_to_json(wb.Sheets[k],{defval:''}).map(r=>{const o={};for(const c in r)o[sinAc(c).replace(/[^a-z]/g,'')]=r[c];return o}):null};
  const hc=hoja('cuentas')||[],hm=hoja('movimientos');if(!hm)return er.textContent='El archivo necesita una hoja llamada "Movimientos".';
  const nuevasC=[],vistas=new Set(ES.cat.map(c=>c.cta));
  hc.forEach(r=>{const c=txt(r.cuenta);if(!c||vistas.has(c))return;if(!r.nombre||!r.categoria||!r.subcategoria||!DEPTOS.includes(txt(r.departamento)))return;vistas.add(c);nuevasC.push({cta:c,nombre:txt(r.nombre),cat:txt(r.categoria),sub:txt(r.subcategoria),dep:txt(r.departamento)})});
  const ocupados=new Set(ES.movAll.map(x=>x.anio+'-'+x.mes)),movs=[],saltados={},errores=[];
  hm.forEach((r,i)=>{const c=txt(r.cuenta),y=+r.ano||+r.anio||ES.anio,m=+r.mes,v=parseMe(r.monto);if(!c&&v==null)return;
    if(!vistas.has(c)){errores.push(`Fila ${i+2}: la cuenta ${esc(c)} no está en el catálogo`);return}
    if(!(m>=1&&m<=12)||v==null){errores.push(`Fila ${i+2}: mes o monto inválido`);return}
    if(ocupados.has(y+'-'+m)){saltados[MESES[m-1]+' '+y]=(saltados[MESES[m-1]+' '+y]||0)+1;return}
    movs.push({cta:c,anio:y,mes:m,monto:v,desc:txt(r.descripcion)})});
  V.imp={nuevasC,movs};
  const porMes={};movs.forEach(x=>{const k=MESES[x.mes-1].slice(0,3)+' '+x.anio;porMes[k]=(porMes[k]||0)+1});
  $('i-res').innerHTML=`<div class="info"><strong>Listo para importar:</strong> ${plural(movs.length,'movimiento','movimientos')}${nuevasC.length?` y ${plural(nuevasC.length,'cuenta nueva','cuentas nuevas')}`:''}.<br><span class="small">${Object.entries(porMes).map(([k,n])=>`${k}: ${fmt0(n)}`).join(' · ')}</span></div>
   ${Object.keys(saltados).length?`<div class="warn-s">Se saltan porque ya tienen movimientos: ${Object.entries(saltados).map(([k,n])=>`${k} (${n})`).join(', ')}</div>`:''}
   ${errores.length?`<div class="err" style="display:block">${errores.slice(0,10).join('<br>')}${errores.length>10?'<br>…':''}</div>`:''}`;
  $('i-go').disabled=!(movs.length||nuevasC.length);
}
async function importarEst(){const I=V.imp;if(!I||busy)return;I.corriendo=true;$('i-go').disabled=true;$('i-f').disabled=true;const res=$('i-res');
  try{
    if(I.nuevasC.length){const r=await batch(I.nuevasC.map(c=>({method:'POST',url:`${LP('ecta')}/items`,body:{fields:{Title:c.cta,Nombre:c.nombre,Categoria:c.cat,Subcategoria:c.sub,Departamento:c.dep}}})),(a,b)=>res.innerHTML=`<div class="info"><strong>Guardando cuentas…</strong> ${a} de ${b}<div class="bar-p"><span style="width:${Math.round(a/b*100)}%"></span></div></div>`);
      r.forEach((x,i)=>{if(x&&x.status<300)ES.cat.push({id:+x.body.id,...I.nuevasC[i],tipo:tipoDeCat(I.nuevasC[i].cat)})});indexarCat()}
    const{ok,fallos}=I.movs.length?await guardarVariosEst(I.movs,'Guardando movimientos…',res):{ok:0,fallos:0};
    I.corriendo=false;cerrar();const ys=[...new Set(I.movs.map(x=>x.anio))];setAnio(ys.length&&!ys.includes(ES.anio)?Math.max(...ys):ES.anio);renderEst();
    toast(`Importación lista: ${plural(ok,'movimiento','movimientos')}${I.nuevasC.length?' y '+plural(I.nuevasC.length,'cuenta','cuentas'):''}${fallos?` · ${fallos} fallaron; vuelve a importar el archivo`:''}`)}
  catch(e){console.error(e);I.corriendo=false;$('i-f').disabled=false;res.innerHTML=`<div class="err" style="display:block">No se pudo importar: ${esc(e.message||e)}</div>`}}


/* =====================================================================
   COPIA DE BENEFICIOS: lista EstadosBeneficios con solo los movimientos de Beneficios
   (con la cuenta, categoría y subcategoría ya incluidas). Quien solo tiene permiso en esa
   lista ve únicamente el dashboard de Beneficios; también la puede leer una futura página de Beneficios.
   La página la mantiene al día sola: después de cada cambio compara y corrige lo que falte.
   ===================================================================== */
const DEP_BEN='Beneficios';
const BEN={items:{},cargado:false,estado:'',corriendo:false,pend:false};
const esBen=cta=>CTA(cta)?.dep===DEP_BEN;
const benCampos=x=>{const c=CTA(x.cta);return{Title:x.cta,Anio:x.anio,Mes:x.mes,Monto:x.monto,Descripcion:x.desc||'',Nombre:c?.nombre||'',Categoria:c?.cat||'',Subcategoria:c?.sub||'',OrigenId:x.id}};
const benIgual=(a,b)=>['Title','Anio','Mes','Monto','Descripcion','Nombre','Categoria','Subcategoria'].every(k=>String(a[k]??'')===String(b[k]??''));
async function syncBen(){
  if(!G.listIds.eben||!ES.cargado||ES.soloBen)return;
  if(BEN.corriendo){BEN.pend=true;return}
  BEN.corriendo=true;estadoBen('Sincronizando…');
  try{
    if(!BEN.cargado){BEN.items={};(await allItems('eben')).forEach(i=>{const f=i.fields,o=+f.OrigenId;if(!o)return;if(BEN.items[o])BEN.items[o+'_dup'+i.id]={id:+i.id,f,dup:true};else BEN.items[o]={id:+i.id,f}});BEN.cargado=true}
    const quiere={};ES.movAll.filter(x=>esBen(x.cta)).forEach(x=>quiere[x.id]=benCampos(x));
    const ops=[],tras=[];
    for(const [o,f] of Object.entries(quiere)){const m=BEN.items[o];
      if(!m){ops.push({method:'POST',url:`${LP('eben')}/items`,body:{fields:f}});tras.push(r=>{if(r.status<300)BEN.items[o]={id:+r.body.id,f}})}
      else if(!benIgual(m.f,f)){ops.push({method:'PATCH',url:`${LP('eben')}/items/${m.id}/fields`,body:f});tras.push(r=>{if(r.status<300)m.f={...m.f,...f}})}}
    for(const [k,m] of Object.entries(BEN.items))if(m.dup||!quiere[k]){ops.push({method:'DELETE',url:`${LP('eben')}/items/${m.id}`});tras.push(r=>{if(r.status<300||r.status===404)delete BEN.items[k]})}
    if(ops.length){const r=await batch(ops);r.forEach((x,i)=>x&&tras[i](x));const f=r.filter(x=>!x||(x.status>=300&&x.status!==404)).length;if(f)throw new Error(f+' cambios no se pudieron copiar')}
    estadoBen('ok');
  }catch(e){console.error('Beneficios',e);estadoBen('error')}
  finally{BEN.corriendo=false;if(BEN.pend){BEN.pend=false;syncBen()}}
}
function estadoBen(t){BEN.estado=t;const el=$('ben-st');if(el)el.innerHTML=chipBen()}
function chipBen(){if(!G.listIds.eben)return '';const n=Object.keys(BEN.items).length;
  return BEN.estado==='error'?`<span class="ben-chip err">Copia de Beneficios con errores · <button class="lnk" onclick="BEN.cargado=false;syncBen()">Reintentar</button></span>`
   :BEN.estado==='ok'?`<span class="ben-chip ok">✓ Copia de Beneficios al día · ${fmt0(n)} movimientos</span>`
   :`<span class="ben-chip">Actualizando copia de Beneficios…</span>`}

async function cargarEstBen(){
  const it=await allItems('eben'),cats={};
  ES.movAll=it.map(i=>{const f=i.fields,c=(f.Title||'').trim();if(c&&!cats[c])cats[c]={id:+i.id,cta:c,nombre:f.Nombre||'',cat:f.Categoria||'',sub:f.Subcategoria||'',dep:DEP_BEN,tipo:tipoDeCat(f.Categoria)};
    return{id:+i.id,cta:c,anio:+f.Anio||0,mes:+f.Mes||0,monto:+f.Monto||0,desc:f.Descripcion||''}}).filter(x=>x.cta&&x.anio&&x.mes>=1&&x.mes<=12);
  ES.cat=Object.values(cats);indexarCat();ES.soloBen=true;ES.dep=DEP_BEN;ES.sub='dash';
  const ys=[...new Set(ES.movAll.map(x=>x.anio))];setAnio(ys.length&&!ys.includes(ES.anio)?Math.max(...ys):ES.anio);ES.cargado=true;
}

const DEPTOS=['Beneficios','Ventas Corporativas','Administrativo'];

function periodo(){const p=ES.per,ult=Math.max(...mesesConDatos());let a,b,lbl,pa=null;
  if(p.t==='mes'){a=b=p.m;lbl=MESES[p.m-1]+' '+ES.anio;pa=p.m>1?p.m-1:null}
  else if(p.t==='tri'){a=(p.q-1)*3+1;b=a+2;lbl=`Trimestre ${p.q} · ${MESES[a-1].slice(0,3)}–${MESES[b-1].slice(0,3)} ${ES.anio}`;pa=p.q>1?a-3:null}
  else if(p.t==='sem'){a=(p.s-1)*6+1;b=a+5;lbl=`Semestre ${p.s} · ${MESES[a-1].slice(0,3)}–${MESES[b-1].slice(0,3)} ${ES.anio}`;pa=p.s>1?a-6:null}
  else if(p.t==='año'){a=1;b=12;lbl='Año '+ES.anio}
  else{a=p.de;b=p.a;lbl=`${MESES[a-1]} a ${MESES[b-1]} ${ES.anio}`;const n=b-a+1;pa=a-n>=1?a-n:null}
  const parcial=b>ult;b=Math.min(b,ult);if(b<a)b=a;
  ES.desde=a;ES.hasta=b;const n=b-a+1;
  return{a,b,lbl:lbl+(parcial?' (parcial, con datos hasta '+MESES[ult-1].toLowerCase()+')':''),prev:pa?[pa,pa+n-1]:null,prevLbl:pa?(n===1?MESES[pa-1]:`${MESES[pa-1].slice(0,3)}–${MESES[pa+n-2].slice(0,3)}`):''}}
const rangoDe=(a,b)=>{const r=[];for(let m=a;m<=b;m++)r.push(m-1);return r};
const mesesConDatos=()=>{const m=[...new Set(ES.mov.map(x=>x.mes))].sort((a,b)=>a-b);return m.length?m:[ES.anio===+hoy().slice(0,4)?+hoy().slice(5,7):1]};

/* ---------- Cálculos ---------- */
function agrupar(f){
  const R={ing:{},gas:{},porMes:Array.from({length:12},()=>({i:0,g:0})),porDep:{}};
  DEPTOS.forEach(d=>R.porDep[d]=Array.from({length:12},()=>({i:0,g:0})));
  ES.mov.forEach(x=>{const c=CTA(x.cta);if(!c)return;if(f.dep&&c.dep!==f.dep)return;const k=x.mes-1;
    const dst=c.tipo==='I'?'i':'g';R.porMes[k][dst]+=x.monto;if(R.porDep[c.dep])R.porDep[c.dep][k][dst]+=x.monto;
    const T=c.tipo==='I'?R.ing:R.gas;T[c.cat]=T[c.cat]||{tot:Array(12).fill(0),subs:{}};T[c.cat].tot[k]+=x.monto;
    const s=T[c.cat].subs[c.sub]=T[c.cat].subs[c.sub]||Array(12).fill(0);s[k]+=x.monto});
  return R;
}
const rango=()=>{const a=[];for(let m=ES.desde;m<=ES.hasta;m++)a.push(m-1);return a};
const sumR=(arr,r)=>r.reduce((s,k)=>s+arr[k],0);

function pintarDash(){
  const P=periodo(),r=rango(),A=agrupar({dep:ES.dep}),ti=sumR(A.porMes.map(x=>x.i),r),tg=sumR(A.porMes.map(x=>x.g),r),ut=ti-tg,mg=ti?ut/ti*100:0;
  const rp=P.prev?rangoDe(...P.prev):null,pi=rp?sumR(A.porMes.map(x=>x.i),rp):null,pg=rp?sumR(A.porMes.map(x=>x.g),rp):null,pu=rp?pi-pg:null,pm=rp&&pi?pu/pi*100:null;
  const delta=(a,b,inv)=>{if(b==null||!b)return '';const p=(a-b)/Math.abs(b)*100,up=p>=0,good=inv?!up:up;return `<span class="dl ${good?'up':'dn'}">${up?'▲':'▼'} ${Math.abs(p).toFixed(0)}%</span>`};
  $('d-k').innerHTML=`
   <div class="kpi"><span>Ingresos</span><strong>₡ ${fmtN(ti)}</strong><small class="muted">${rp?`${delta(ti,pi)} vs ${compactE(pi)}`:'&nbsp;'}</small></div>
   <div class="kpi"><span>Gastos</span><strong>₡ ${fmtN(tg)}</strong><small class="muted">${rp?`${delta(tg,pg,true)} vs ${compactE(pg)}`:'&nbsp;'}</small></div>
   <div class="kpi main"><span>Utilidad antes de impuestos</span><strong class="${ut<0?'neg':''}">₡ ${fmtN(ut)}</strong><small class="muted">${rp?`${delta(ut,pu)} vs ${compactE(pu)}`:'&nbsp;'}</small></div>
   <div class="kpi"><span>Margen</span><strong class="${mg<0?'neg':''}">${mg.toFixed(1)}%</strong><small class="muted">${rp&&pm!=null?`${(mg-pm>=0?'▲ ':'▼ ')+Math.abs(mg-pm).toFixed(1)} pts vs ${pm.toFixed(1)}%`:'utilidad sobre ingresos'}</small></div>`;
  /* gráfico mensual */
  const rc=rangoDe(1,Math.max(...mesesConDatos())),enR=k=>r.includes(k);
  const W=880,H=230,PX=46,n=rc.length,mx=Math.max(1,...rc.map(k=>Math.max(A.porMes[k].i,A.porMes[k].g))),mn=Math.min(0,...rc.map(k=>A.porMes[k].i-A.porMes[k].g));
  const sc=v=>10+(H-10)*(1-(v-mn)/(mx-mn)),gw=(W-PX)/n,bw=Math.min(26,gw/3.2);
  let s=`<svg viewBox="0 0 ${W} ${H+28}" width="100%" role="img" aria-label="Ingresos, gastos y utilidad por mes">`;
  for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=sc(v);s+=`<line x1="${PX}" x2="${W}" y1="${y}" y2="${y}" stroke="${Math.abs(v)<1?'#9AA7AF':'#E2E7EA'}"/><text x="${PX-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#66737C">${compactE(v)}</text>`}
  const pts=[];rc.forEach((k,j)=>{const x=PX+gw*j+gw/2,mi=A.porMes[k],u=mi.i-mi.g,y0=sc(0);pts.push([x,sc(u)]);
    if(enR(k))s+=`<rect x="${x-gw/2+2}" y="2" width="${gw-4}" height="${H+24}" rx="8" fill="#F1F7F8"/>`;
    s+=`<g class="bar-r${enR(k)?'':' fuera'}" style="transition-delay:${j*50}ms;transform-origin:${x}px ${y0}px" data-tip="${esc(MESES[k]+' · Ingresos ₡'+fmtN(mi.i)+' · Gastos ₡'+fmtN(mi.g)+' · Utilidad ₡'+fmtN(u))}">
     <rect x="${x-bw-2}" y="${sc(mi.i)}" width="${bw}" height="${Math.max(0,y0-sc(mi.i))}" rx="3" fill="#0D6174"/><rect x="${x+2}" y="${sc(mi.g)}" width="${bw}" height="${Math.max(0,y0-sc(mi.g))}" rx="3" fill="#E8A23A"/><rect x="${x-gw/2}" y="0" width="${gw}" height="${H}" fill="transparent"/></g>
     <text x="${x}" y="${H+20}" text-anchor="middle" font-size="11" font-weight="${enR(k)?700:400}" fill="${enR(k)?'#0D6174':'#9AA7AF'}">${MESES[k].slice(0,3)}</text>`});
  s+=`<polyline class="ln" points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#1B2A33" stroke-width="2.2" stroke-linejoin="round"/>${pts.map(([x,y],j)=>`<circle cx="${x}" cy="${y}" r="3.5" fill="#fff" stroke="#1B2A33" stroke-width="2"/>`).join('')}</svg>`;
  $('d-c1').innerHTML=s;
  /* gastos por categoría o subcategoría */
  let items;
  if(ES.catSel&&A.gas[ES.catSel]){items=Object.entries(A.gas[ES.catSel].subs).map(([k,v])=>[k,sumR(v,r)]);$('d-c2t').textContent=ES.catSel;$('d-c2p').textContent='Subcategorías · '+plural(items.length,'subcategoría','subcategorías');$('d-c2b').hidden=false}
  else{items=Object.entries(A.gas).map(([k,v])=>[k,sumR(v.tot,r)]);$('d-c2t').textContent='Gastos por categoría';$('d-c2p').textContent='Haz clic en una categoría para ver sus subcategorías';$('d-c2b').hidden=true}
  items=items.filter(x=>Math.abs(x[1])>0.004).sort((a,b)=>b[1]-a[1]);const tot=items.reduce((a,x)=>a+x[1],0),mxi=Math.max(1,...items.map(x=>x[1]));
  $('d-c2').innerHTML=items.length?items.map(([k,v],i)=>`<button type="button" class="hbrow${ES.catSel?' nosel':''}" ${ES.catSel?'':`onclick="ES.catSel=${js(k)};pintarDash()"`}><span title="${esc(k)}">${esc(k)}</span><div class="hbt"><div class="hb" style="width:${Math.max(0,v)/mxi*100}%;transition-delay:${i*40}ms"></div></div><span class="amt-c">${compactE(v)} <small class="muted">${tot?(v/tot*100).toFixed(0):0}%</small></span></button>`).join(''):'<p class="empty">Sin gastos en el período.</p>';
  /* tercer gráfico */
  if(ES.dep){const ii=Object.values(A.ing).flatMap(c=>Object.entries(c.subs)).map(([k,v])=>[k,sumR(v,r)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]),t2=ii.reduce((a,x)=>a+x[1],0),m2=Math.max(1,...ii.map(x=>x[1]));
    $('d-c3').innerHTML=ii.length?ii.map(([k,v],i)=>`<div class="hbrow nosel"><span>${esc(k)}</span><div class="hbt"><div class="hb ing" style="width:${Math.max(0,v)/m2*100}%;transition-delay:${i*40}ms"></div></div><span class="amt-c">${compactE(v)} <small class="muted">${t2?(v/t2*100).toFixed(0):0}%</small></span></div>`).join(''):'<p class="empty">Este departamento no tiene ingresos en el período.</p>'}
  else{const B=agrupar({});$('d-c3').innerHTML=`<div class="deps">${DEPTOS.map(d=>{const i=sumR(B.porDep[d].map(x=>x.i),r),g=sumR(B.porDep[d].map(x=>x.g),r),u=i-g;
    const sp=r.map(k=>B.porDep[d][k].i-B.porDep[d][k].g),smx=Math.max(1,...sp.map(Math.abs));
    return `<button type="button" class="depc" onclick="ES.dep=${js(d)};renderEst()"><div class="depc-h"><strong>${d}</strong><span class="${u<0?'neg':'pos'}">₡ ${fmt0(u)}</span></div>
     <div class="depc-r"><span>Ingresos ${compactE(i)}</span><span>Gastos ${compactE(g)}</span><span>Margen ${i?(u/i*100).toFixed(0):0}%</span></div>
     <svg viewBox="0 0 ${sp.length*14} 30" width="100%" height="30" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="${sp.length*14}" y1="15" y2="15" stroke="#E2E7EA"/>${sp.map((v,j)=>`<rect x="${j*14+3}" y="${v>=0?15-Math.abs(v)/smx*14:15}" width="8" height="${Math.max(1,Math.abs(v)/smx*14)}" rx="1.5" fill="${v>=0?'#2E7D4F':'#B3242D'}"/>`).join('')}</svg></button>`}).join('')}</div>`}
  /* top ingresos y top gastos */
  const topDe=(T,tipo)=>{const l=Object.entries(T).flatMap(([c,o])=>Object.entries(o.subs).map(([k,v])=>({k,c,v:sumR(v,r),p:rp?sumR(v,rp):null}))).filter(x=>Math.abs(x.v)>0.004).sort((a,b)=>b.v-a.v).slice(0,8),
    t=Object.values(T).reduce((s2,o)=>s2+sumR(o.tot,r),0),m=Math.max(1,...l.map(x=>x.v));
    return l.length?`<div class="tops">${l.map((x,i)=>{const d=x.p?((x.v-x.p)/Math.abs(x.p)*100):null,good=tipo==='i'?d>=0:d<=0;
      return `<div class="t10"><span class="t10-n${tipo==='i'?' ing':''}">${i+1}</span><div class="t10-x"><strong>${esc(x.k)}</strong><small>${esc(x.c)} · ${t?(x.v/t*100).toFixed(1):0}% del total</small><div class="hbt"><div class="hb${tipo==='i'?' ing':''}" style="width:${Math.max(0,x.v)/m*100}%;transition-delay:${i*40}ms"></div></div></div>
       <span class="amt-c">₡ ${fmt0(x.v)}${d!=null&&isFinite(d)?`<small class="dl ${good?'up':'dn'}" style="display:block">${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(0)}%</small>`:''}</span></div>`}).join('')}</div>`:'<p class="empty">Sin datos en el período.</p>'};
  $('d-ti').innerHTML=topDe(A.ing,'i');$('d-c4').innerHTML=topDe(A.gas,'g');
  pintarAnalisis();
  requestAnimationFrame(()=>requestAnimationFrame(()=>['d-c1','d-c2','d-c3','d-c4','d-ti'].forEach(i=>$(i)?.classList.add('on'))));
  document.querySelectorAll('#d-c1 [data-tip]').forEach(g=>{g.onmousemove=e=>{const t=$('tip');t.textContent=g.dataset.tip;t.style.left=Math.min(e.clientX+12,innerWidth-380)+'px';t.style.top=e.clientY-34+'px';t.style.opacity=1};g.onmouseleave=()=>$('tip').style.opacity=0});
  pintarER();

/* ---------- Análisis automático (reglas sobre los datos del período, sin IA) ---------- */
function pintarAnalisis(){
  const el=$('d-ana');if(!el)return;const P=periodo();
  const head=`<div class="ana-h"><div><h3><span class="ana-ic">✦</span> Análisis del período</h3><p>${esc(P.lbl)} · ${esc(ES.dep||'Todos los departamentos')}</p></div><button class="btn ${ES.ana?'':'primary'}" onclick="ES.ana=1;pintarAnalisis()">${ES.ana?'Actualizar':'Generar análisis'}</button></div>`;
  if(!ES.ana){el.innerHTML=head+`<p class="muted" style="margin:0">Genera un resumen con los datos más importantes, alertas, posibles registros faltantes y oportunidades de mejora del período.</p>`;return}
  const r=rango(),rp=P.prev?rangoDe(...P.prev):null,A=agrupar({dep:ES.dep}),B=agrupar({});
  const ti=sumR(A.porMes.map(x=>x.i),r),tg=sumR(A.porMes.map(x=>x.g),r),ut=ti-tg,mg=ti?ut/ti*100:0;
  const pi=rp?sumR(A.porMes.map(x=>x.i),rp):null,pg=rp?sumR(A.porMes.map(x=>x.g),rp):null,pu=rp?pi-pg:null;
  const pct=(a,b)=>b?((a-b)/Math.abs(b)*100):null,f0=v=>'₡'+fmt0(v),flecha=v=>v>=0?'subió':'bajó';
  const D=[],AL=[],FA=[],OP=[];
  /* Destacados */
  D.push(`La utilidad antes de impuestos fue de <b class="${ut<0?'neg':'pos'}">${f0(ut)}</b>, con un margen de <b>${mg.toFixed(1)}%</b>${rp?` (${pct(ut,pu)!=null?`${flecha(ut-pu)} ${f0(Math.abs(ut-pu))} contra ${esc(P.prevLbl)}`:''})`:''}.`);
  if(r.length>1){const ms=r.map(k=>({k,u:A.porMes[k].i-A.porMes[k].g})).sort((a,b)=>b.u-a.u),mj=ms[0],pe=ms[ms.length-1];
    D.push(`El mejor mes fue <b>${MESES[mj.k]}</b> (${f0(mj.u)}) y el más débil <b>${MESES[pe.k]}</b> (<span class="${pe.u<0?'neg':''}">${f0(pe.u)}</span>).`)}
  if(!ES.dep){const ds=DEPTOS.map(d=>{const i=sumR(B.porDep[d].map(x=>x.i),r),g=sumR(B.porDep[d].map(x=>x.g),r);return{d,u:i-g,m:i?(i-g)/i*100:null}}).sort((a,b)=>b.u-a.u);
    D.push(`<b>${ds[0].d}</b> es el departamento más rentable (${f0(ds[0].u)}${ds[0].m!=null?`, margen ${ds[0].m.toFixed(0)}%`:''}); <b>${ds[ds.length-1].d}</b> el de menor resultado (${f0(ds[ds.length-1].u)}).`)}
  else if(!ES.soloBen){const tot=sumR(B.porMes.map(x=>x.i),r);if(tot)D.push(`${esc(ES.dep)} generó el <b>${(ti/tot*100).toFixed(1)}%</b> de los ingresos totales del período.`)}
  const fuentes=Object.values(A.ing).flatMap(o=>Object.entries(o.subs)).map(([k,v])=>({k,v:sumR(v,r)})).sort((a,b)=>b.v-a.v);
  if(fuentes[0]&&ti)D.push(`La principal fuente de ingreso es <b>${esc(fuentes[0].k)}</b>, con el <b>${(fuentes[0].v/ti*100).toFixed(1)}%</b> de los ingresos.`);
  /* Alertas */
  const perd=r.filter(k=>A.porMes[k].i-A.porMes[k].g<0);
  if(perd.length)AL.push(`${perd.length===1?'Hubo pérdida en':'Hubo pérdida en '+perd.length+' meses:'} <b>${perd.map(k=>MESES[k]).join(', ')}</b>.`);
  const subsG=Object.entries(A.gas).flatMap(([c,o])=>Object.entries(o.subs).map(([k,v])=>({k,c,v,act:sumR(v,r),ant:rp?sumR(v,rp):0})));
  if(rp){subsG.filter(x=>x.ant>0&&x.act-x.ant>250000&&(x.act-x.ant)/x.ant>0.15).sort((a,b)=>(b.act-b.ant)-(a.act-a.ant)).slice(0,3)
    .forEach(x=>AL.push(`<b>${esc(x.k)}</b> (${esc(x.c)}) subió <b>${pct(x.act,x.ant).toFixed(0)}%</b> contra ${esc(P.prevLbl)}: de ${f0(x.ant)} a ${f0(x.act)}.`))}
  const ul=ES.hasta-1;if(ul>=2){subsG.map(x=>{const prev=x.v.slice(0,ul).filter((_,i)=>i>=0),cnt=prev.filter(v=>v>0).length,avg=cnt?prev.reduce((s2,v)=>s2+v,0)/cnt:0;return{...x,avg,cnt,u:x.v[ul]}})
    .filter(x=>x.cnt>=2&&x.u>x.avg*1.5&&x.u-x.avg>300000).sort((a,b)=>(b.u-b.avg)-(a.u-a.avg)).slice(0,3)
    .forEach(x=>AL.push(`En <b>${MESES[ul]}</b>, <b>${esc(x.k)}</b> fue de ${f0(x.u)}, <b>${(x.u/x.avg).toFixed(1)} veces</b> su promedio mensual (${f0(x.avg)}). Vale la pena revisar si es un gasto extraordinario.`))}
  if(!ES.dep)DEPTOS.forEach(d=>{const i=sumR(B.porDep[d].map(x=>x.i),r),g=sumR(B.porDep[d].map(x=>x.g),r);if(i>0&&g>i)AL.push(`<b>${d}</b> tuvo gastos mayores a sus ingresos (margen ${((i-g)/i*100).toFixed(0)}%).`)});
  /* Posibles registros faltantes: cuentas que se registraron los 3 meses anteriores pero no en el último mes del período */
  if(ul>=3){const ctas={};ES.mov.forEach(x=>{const c=CTA(x.cta);if(!c||(ES.dep&&c.dep!==ES.dep))return;(ctas[x.cta]=ctas[x.cta]||new Set()).add(x.mes-1)});
    const falt=Object.entries(ctas).filter(([,ms])=>[ul-1,ul-2,ul-3].every(k=>ms.has(k))&&!ms.has(ul)).map(([c])=>CTA(c));
    falt.slice(0,8).forEach(c=>FA.push(`<b>${esc(c.sub)}</b> · ${esc(c.nombre)} <span class="muted">(${esc(c.dep)})</span> se registró ${MESES[ul-3].toLowerCase()}, ${MESES[ul-2].toLowerCase()} y ${MESES[ul-1].toLowerCase()}, pero no tiene movimiento en <b>${MESES[ul].toLowerCase()}</b>.`));
    if(falt.length>8)FA.push(`Y ${falt.length-8} cuentas más con el mismo caso.`)}
  /* Oportunidades */
  const tops=subsG.map(x=>({k:x.k,v:x.act})).sort((a,b)=>b.v-a.v).slice(0,3),t3=tops.reduce((s2,x)=>s2+x.v,0);
  if(tg&&tops.length){const ah=t3*0.05;OP.push(`Los 3 gastos más grandes (${tops.map(x=>esc(x.k)).join(', ')}) suman el <b>${(t3/tg*100).toFixed(0)}%</b> del gasto. Reducirlos un 5% ahorraría <b>${f0(ah)}</b>${ti?` y subiría el margen ${(ah/ti*100).toFixed(1)} puntos`:''}.`)}
  if(fuentes[0]&&ti&&fuentes[0].v/ti>0.5)OP.push(`Más de la mitad de los ingresos depende de <b>${esc(fuentes[0].k)}</b>. Diversificar fuentes reduciría el riesgo si ese ingreso baja.`);
  if(rp){subsG.filter(x=>x.ant>0&&x.ant-x.act>200000).sort((a,b)=>(b.ant-b.act)-(a.ant-a.act)).slice(0,2)
    .forEach(x=>OP.push(`<b>${esc(x.k)}</b> bajó ${f0(x.ant-x.act)} contra ${esc(P.prevLbl)}. Si es por una mejora, vale la pena mantenerla.`))}
  const sec=(t,ic,cls,l,vacio)=>`<div class="ana-s ${cls}"><h4><span>${ic}</span>${t}</h4>${l.length?`<ul>${l.map(x=>`<li>${x}</li>`).join('')}</ul>`:`<p class="muted small" style="margin:0">${vacio}</p>`}</div>`;
  el.innerHTML=head+`<div class="ana-g">${sec('Datos destacados','★','a-d',D,'')}${sec('Alertas','!','a-a',AL,'Sin alertas en el período.')}${sec('Posibles registros faltantes','?','a-f',FA,ul>=3?'No se encontraron cuentas que falten en el último mes.':'Se necesitan al menos 4 meses de datos.')}${sec('Oportunidades de mejora','↗','a-o',OP,'Sin sugerencias para este período.')}</div>
   <p class="small muted" style="margin:12px 0 0">Análisis automático calculado con reglas sobre los datos cargados. No usa inteligencia artificial, así que los números siempre son exactos; las interpretaciones son sugerencias para revisar.</p>`;
}
/* Estado de resultados con el mismo formato de tu hoja */
function bloqueDep(dep,r){const A=agrupar({dep});
  const lin=[],ti=Array(12).fill(0),tg=Array(12).fill(0);
  Object.entries(A.ing).forEach(([c,o])=>{o.tot.forEach((v,k)=>ti[k]+=v);Object.entries(o.subs).forEach(([s,v])=>lin.push({t:'ing',n:s,v}))});
  const gcats=Object.entries(A.gas).sort((a,b)=>sumR(b[1].tot,r)-sumR(a[1].tot,r)).map(([c,o])=>{o.tot.forEach((v,k)=>tg[k]+=v);return{c,tot:o.tot,subs:Object.entries(o.subs).sort((a,b)=>sumR(b[1],r)-sumR(a[1],r))}});
  return{lin,ti,tg,gcats,ut:ti.map((v,k)=>v-tg[k])}}
function pintarER(){
  const r=rango(),th=`<tr><th>Concepto</th>${r.map(k=>`<th class="r">${MESES[k].slice(0,3)}</th>`).join('')}<th class="r">Acumulado</th></tr>`;
  const cel=(arr,cls='')=>r.map(k=>`<td class="r ${cls}${arr[k]<0?' neg':''}">${fmtN(arr[k])}</td>`).join('')+`<td class="r acu ${cls}${sumR(arr,r)<0?' neg':''}">${fmtN(sumR(arr,r))}</td>`;
  const bloque=(dep,titulo)=>{const b=bloqueDep(dep,r),key=dep;let h=`<tr class="er-dep"><td colspan="${r.length+2}">${esc(titulo)}</td></tr>`;
    b.lin.forEach(l=>h+=`<tr><td class="ind">${esc(l.n)}</td>${cel(l.v)}</tr>`);
    h+=`<tr class="er-tot"><td>Total de ingresos</td>${cel(b.ti)}</tr>`;
    b.gcats.forEach(g=>{const id=key+'|'+g.c,op=!!ES.abiertas[id];
      h+=`<tr class="er-cat" onclick="ES.abiertas[${js(id)}]=!ES.abiertas[${js(id)}];pintarER()"><td><span class="car${op?' op':''}">▸</span>${esc(g.c)}</td>${cel(g.tot)}</tr>`;
      if(op)g.subs.forEach(([s,v])=>h+=`<tr class="er-sub"><td class="ind2">${esc(s)}</td>${cel(v)}</tr>`)});
    h+=`<tr class="er-tot"><td>Total de gastos</td>${cel(b.tg)}</tr><tr class="er-ut"><td>Utilidad ${esc(dep)}</td>${cel(b.ut)}</tr>`;return{h,b}};
  let html=`<thead>${th}</thead><tbody>`;
  if(ES.dep)html+=bloque(ES.dep,ES.dep).h;
  else{const R={};DEPTOS.forEach(d=>{const x=bloque(d,d);html+=x.h;R[d]=x.b});
    const op=R['Beneficios'].ut.map((v,k)=>v+R['Ventas Corporativas'].ut[k]),ai=op.map((v,k)=>v+R['Administrativo'].ut[k]),imp=ai.map(v=>v*IMPUESTO),up=ai.map((v,k)=>v-imp[k]);
    let acc=0;const acu=Array(12).fill(0);r.forEach(k=>{acc+=up[k];acu[k]=acc});
    html+=`<tr class="er-dep"><td colspan="${r.length+2}">Resultado consolidado</td></tr>
     <tr class="er-tot"><td>Utilidad bruta operativa <small class="muted">(Beneficios + Ventas)</small></td>${cel(op)}</tr>
     <tr><td class="ind">Utilidad administración</td>${cel(R['Administrativo'].ut)}</tr>
     <tr class="er-tot"><td>Utilidad antes de impuestos</td>${cel(ai)}</tr>
     <tr><td class="ind">Impuesto sobre la renta (${IMPUESTO*100}%)</td>${cel(imp)}</tr>
     <tr class="er-ut big"><td>Utilidad del período</td>${cel(up)}</tr>
     <tr class="er-acu"><td>Utilidad acumulada</td>${r.map(k=>`<td class="r${acu[k]<0?' neg':''}">${fmtN(acu[k])}</td>`).join('')}<td class="r acu">—</td></tr>`}
  $('d-er').innerHTML=html+'</tbody>';
}

const sigMes=()=>Math.min(12,Math.max(...mesesConDatos())+1);

function filasMes(){
  const q=sinAc(ES.q),ps=50;
  const r=ES.mov.filter(x=>x.mes===ES.mes).map(x=>({x,c:CTA(x.cta)})).filter(({x,c})=>!q||sinAc([x.cta,c?.nombre,c?.cat,c?.sub,c?.dep,x.desc].join(' ')).includes(q)).sort((a,b)=>b.x.id-a.x.id);
  const pags=Math.max(1,Math.ceil(r.length/ps));ES.pg=Math.min(ES.pg,pags);const vis=r.slice((ES.pg-1)*ps,ES.pg*ps);
  $('mv-f').innerHTML=vis.length?vis.map(({x,c})=>`<tr id="mv-${x.id}" class="${x.nuevo?'nuevo':''}"><td><span class="mono small">${esc(x.cta)}</span><p>${esc(c?.nombre||'Cuenta no está en el catálogo')}</p></td>
   <td><span class="tipo-b ${c?.tipo==='I'?'i':'g'}">${c?.tipo==='I'?'Ingreso':'Gasto'}</span> ${esc(c?.cat||'')}<p>${esc(c?.sub||'')}</p></td><td class="small">${esc(c?.dep||'')}</td>
   <td>${esc(x.desc)}</td><td class="r amt-c${x.monto<0?' neg':''}">${fmtN(x.monto)}</td>
   <td><div class="acts"><button class="lnk" onclick="dMov(${x.id})">Editar</button><button class="lnk red" onclick="borrarMov(this,${x.id})">Eliminar</button></div></td></tr>`).join('')
   :`<tr><td colspan="6"><p class="empty">${ES.mov.some(x=>x.mes===ES.mes)?'No hay movimientos que coincidan.':'Todavía no hay movimientos en este mes. Agrégalos arriba, pégalos desde Excel o cópialos del mes anterior.'}</p></td></tr>`;
  $('mv-p').innerHTML=`<span class="small muted">Mostrando ${r.length?(ES.pg-1)*ps+1:0}–${Math.min(ES.pg*ps,r.length)} de ${r.length}</span>${pags>1?`<div class="pg"><button ${ES.pg===1?'disabled':''} onclick="ES.pg--;filasMes()" aria-label="Anterior">‹</button><span class="small muted" style="padding:0 8px">${ES.pg} / ${pags}</span><button ${ES.pg===pags?'disabled':''} onclick="ES.pg++;filasMes()" aria-label="Siguiente">›</button></div>`:''}`;
}

  $('qcb').classList.add('open');if(qCta&&$('q-c').value!==qCta.cta+' · '+qCta.nombre){qCta=null;$('q-i').innerHTML=''}}
function qTecla(e){const bs=[...document.querySelectorAll('#q-l button')];let k=bs.findIndex(b=>b.classList.contains('hl'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!bs.length)return;bs[k]?.classList.remove('hl');k=e.key==='ArrowDown'?Math.min(bs.length-1,k+1):Math.max(0,k-1);bs[k].classList.add('hl');bs[k].scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'){e.preventDefault();if(qCta&&!$('qcb').classList.contains('open'))return $('q-m').focus();if(bs[k])qElegir(bs[k].dataset.c)}
  else if(e.key==='Escape')$('qcb').classList.remove('open')}
document.addEventListener('click',e=>{const c=$('qcb');if(c&&!c.contains(e.target))c.classList.remove('open')});
function qElegir(cta){const c=CTA(cta);qCta=c;$('q-c').value=c.cta+' · '+c.nombre;$('qcb').classList.remove('open');

let _peg=[];
function leerPegado(){
  const ls=$('p-t').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);_peg=[];const err=[];
  ls.forEach((l,i)=>{const p=l.split('\t').length>1?l.split('\t'):l.split(/;|\s{2,}/);const cta=(p[0]||'').trim(),c=CTA(cta),m=parseMe(p[1]);
    if(i===0&&!c&&m==null)return;
    if(!c){err.push(`Fila ${i+1}: la cuenta "${esc(cta)}" no está en el catálogo`);return}
    if(m==null){err.push(`Fila ${i+1}: monto inválido`);return}
    _peg.push({c,m,d:(p.slice(2).join(' ')||'').trim()})});
  const ti=_peg.filter(x=>x.c.tipo==='I').reduce((s,x)=>s+x.m,0),tg=_peg.filter(x=>x.c.tipo==='G').reduce((s,x)=>s+x.m,0);
  $('p-r').innerHTML=(_peg.length?`<div class="info" style="margin-top:12px"><strong>${plural(_peg.length,'movimiento listo','movimientos listos')}</strong> · Ingresos ₡ ${fmtN(ti)} · Gastos ₡ ${fmtN(tg)}</div>
   <div class="tbl" style="max-height:260px;overflow:auto"><table class="mv-t"><tbody>${_peg.slice(0,100).map(x=>`<tr><td class="mono small">${esc(x.c.cta)}</td><td>${esc(x.c.sub)}<p>${esc(x.c.dep)}</p></td><td>${esc(x.d)}</td><td class="r">${fmtN(x.m)}</td></tr>`).join('')}</tbody></table></div>`:'')+
   (err.length?`<div class="err" style="display:block;margin-top:10px">${err.slice(0,10).join('<br>')}${err.length>10?'<br>…':''}</div>`:'');
  $('p-go').disabled=!_peg.length;$('p-go').textContent=_peg.length?'Agregar '+_peg.length:'Agregar'}

  /* sugeridos: lo que se repite igual en los últimos meses */
  const rep=x=>ES.mov.filter(y=>y.mes===pm-1&&y.cta===x.cta&&Math.abs(y.monto-x.monto)<0.01).length>0;
  const l=prev.map(x=>({x,c:CTA(x.cta),s:rep(x)})).sort((a,b)=>(b.s-a.s)||a.c.sub.localeCompare(b.c.sub));
  abrir(`<header><div><h2>Copiar del mes anterior</h2><p>De ${MESES[pm-1]} a ${MESES[ES.mes-1]}. Marcados: los que se repitieron con el mismo monto los últimos dos meses.</p></div><button class="x" aria-label="Cerrar" onclick="cerrar()">×</button></header>

/* =====================================================================
   DEPRECIACIÓN (línea recta, se corre al último día del mes)
   Gasto mensual = precio / factor
   Meses transcurridos = meses desde el mes de compra hasta el mes de cierre, contando el mes de compra completo
   Meses pendientes = factor - transcurridos · Valor en libros = precio - acumulada
   ===================================================================== */
const FACTORES=[24,60,84,120];
const EMPRESA_DEP='AURA INNOVACIONES S.A.';
/* Cuentas de Aura por categoría (se usan si la categoría todavía no tiene cuentas guardadas) */
const CUENTAS_INICIALES={'equipo de computo':['4.070.040.070','1.080.090.030'],'mobiliario y equipo':['4.070.040.070','1.080.090.010'],'vehiculos':['4.070.040.080','1.080.090.040']};
const sinAc=s=>lc(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function cuentasDe(cat){const c=S.cats.find(x=>x.nombre===cat),d=CUENTAS_INICIALES[sinAc(cat)]||['',''];return[c?.cg||d[0],c?.cc||d[1]]}
const finDeMes=(y,m)=>{const d=new Date(y,m,0);return kOf(d)};
const fmtN=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function depr(x,fin){
  const p=x.precio,f=x.factor;
  if(!x.fadq)return{sin:'Sin fecha de compra'};
  if(p==null||!(f>0))return{sin:'Sin precio o factor'};
  const[y,m]=x.fadq.split('-').map(Number),[Y,M]=fin.split('-').map(Number),raw=(Y-y)*12+(M-m)+1;
  const t=Math.max(0,Math.min(raw,f)),g=raw>=1&&raw<=f?p/f:0,acum=p/f*t;
  return{raw,t,pend:f-t,g,acum,lib:p-acum,tot:t>=f};
}
/* Equipos que existían al cierre: comprados hasta ese mes y no eliminados antes */
function enCierre(fin){return S.todos.filter(x=>x.fadq&&x.fadq<=fin&&(!x.del||(x.delF&&x.delF>fin)))}
function calcDep(){
  const D=V.dep||(V.dep={y:+hoy().slice(0,4),m:+hoy().slice(5,7),cat:'',est:'',q:'',pg:1,ps:20});
  const fin=finDeMes(D.y,D.m),filas=enCierre(fin).map(x=>({x,d:depr(x,fin)}));
  const catsAll=[...new Set([...cats(),...filas.map(r=>r.x.cat).filter(Boolean)])];
  const porCat=catsAll.map(c=>{const l=filas.filter(r=>r.x.cat===c&&!r.d.sin);return{c,gasto:l.reduce((s,r)=>s+r.d.g,0),acum:l.reduce((s,r)=>s+r.d.acum,0),lib:l.reduce((s,r)=>s+r.d.lib,0),precio:l.reduce((s,r)=>s+r.x.precio,0),n:filas.filter(r=>r.x.cat===c).length,cuentas:cuentasDe(c)}});
  return{D,fin,filas,porCat};
}
const estDe=d=>d.sin?'sin':d.g>0?'dep':d.tot?'tot':'cero';

function tDep(){
  const{D,fin,filas,porCat}=calcDep(),con=filas.filter(r=>!r.d.sin);

function filasDep(){
  if(!$('dep-f'))return;const{D,filas}=calcDep(),q=lc(D.q),ps=D.ps;
  const r=filas.filter(({x,d})=>(!D.cat||x.cat===D.cat)&&(!D.est||estDe(d)===D.est)&&(!q||lc([x.cod,x.eq,x.serie,x.asig?P(x.asig)?.nombre:'',x.ubic].join(' ')).includes(q)))
    .sort((a,b)=>a.x.cat.localeCompare(b.x.cat)||a.x.cod.localeCompare(b.x.cod,undefined,{numeric:true}));
  const pags=ps?Math.max(1,Math.ceil(r.length/ps)):1;D.pg=Math.min(Math.max(1,D.pg),pags);const vis=ps?r.slice((D.pg-1)*ps,D.pg*ps):r;
  let cat=null;
  $('dep-f').innerHTML=vis.length?vis.map(({x,d})=>{const h=x.cat!==cat?`<tr class="grp"><td colspan="13">${esc(x.cat||'Sin categoría')}</td></tr>`:'';cat=x.cat;
    const p=x.asig?P(x.asig):null,num=v=>`<td class="r">${fmtN(v)}</td>`;
    return h+`<tr class="${d.sin?'nodata':d.g>0?'':'zero'}"><td class="code">${esc(x.cod)}</td><td>${esc(x.eq)}${x.del?' <span class="pill Danada">Eliminado después</span>':''}</td><td>${p?esc(p.nombre):'<span class="free">—</span>'}</td><td>${!p&&x.ubic?esc(x.ubic):'<span class="free">—</span>'}</td><td style="white-space:nowrap">${aDMY(x.fadq)}</td>`+
     (d.sin?`<td colspan="7" class="r"><span class="free">${d.sin}</span></td>`:`${num(x.precio)}<td class="r">${x.factor}</td><td class="r">${d.t}</td><td class="r">${d.pend}</td>${num(d.g)}${num(d.acum)}${num(d.lib)}`)+
     `<td><button class="lnk" onclick="dEditarEquipo(${js(x.cod)})">Editar</button></td></tr>`}).join(''):'<tr><td colspan="13"><p class="empty">No hay activos con estos filtros.</p></td></tr>';
  const pg=D.pg,a=r.length?(ps?(pg-1)*ps+1:1):0,b=ps?Math.min(pg*ps,r.length):r.length;
  const nums=pags>1?[...new Set([1,pags,pg-1,pg,pg+1].filter(n=>n>=1&&n<=pags))].sort((x,y)=>x-y):[];
  $('dep-p').innerHTML=`<span class="small muted">Mostrando ${a}–${b} de ${r.length}</span>${pags>1?`<div class="pg"><button aria-label="Página anterior" ${pg===1?'disabled':''} onclick="V.dep.pg=${pg-1};filasDep()">‹</button>${nums.map((n,i)=>(i&&n-nums[i-1]>1?'<span class="gap">…</span>':'')+`<button ${n===pg?'aria-current="page"':''} onclick="V.dep.pg=${n};filasDep()">${n}</button>`).join('')}<button aria-label="Página siguiente" ${pg===pags?'disabled':''} onclick="V.dep.pg=${pg+1};filasDep()">›</button></div>`:''}`;
}

  const C=['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
  const cien=n=>{if(!n)return'';if(n===100)return'CIEN';const r=n%100,t=r<30?U[r]:D[Math.floor(r/10)]+(r%10?' Y '+U[r%10]:'');return (C[Math.floor(n/100)]+' '+t).trim()};
  const apoc=s=>s.replace(/VEINTIUNO$/,'VEINTIÚN').replace(/UNO$/,'UN');

   <circle class="donut-s" cx="70" cy="70" r="${R0}" fill="none" stroke="${EMPRESAS.aura.c1}" stroke-width="18" stroke-dasharray="0 ${C}" data-d="${C*pa} ${C}" transform="rotate(-90 70 70)"/>
   <text x="70" y="68" text-anchor="middle" font-size="22" font-weight="700" fill="#1B2A33">${l.length}</text><text x="70" y="86" text-anchor="middle" font-size="10" fill="#66737C">boletas</text></svg>
   <div class="legend"><span><i style="background:${EMPRESAS.aura.c1}"></i>Aura · <strong>${ca}</strong></span><span><i style="background:${EMPRESAS.unicen.c1}"></i>Unicen · <strong>${cu}</strong></span></div></div>`;
  const agg={};lm.forEach(b=>b.lineas.forEach(x=>agg[x.benef]=(agg[x.benef]||0)+x.monto));const top=Object.entries(agg).sort((a,b)=>b[1]-a[1]).slice(0,6),tm=Math.max(1,...top.map(x=>x[1]));
  $('h-c3p').textContent='Por monto pagado en '+MON[B.chMon].n.toLowerCase()+'. Haz clic en uno para ver solo sus boletas.';
  $('h-c3').innerHTML=top.length?top.map(([n,v],i)=>`<button type="button" class="hbrow" onclick="B.hf.ben=${js(n)};renderB()"><span title="${esc(n)}">${esc(n)}</span>
    <div class="hbt"><div class="hb" style="width:${v/tm*100}%;transition-delay:${i*60}ms"></div></div><span class="amt-c">${fmtC(v,B.chMon)}</span></button>`).join(''):'<p class="empty">Sin pagos en esta moneda.</p>';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{['h-c1','h-c3'].forEach(i=>$(i)?.classList.add('on'));document.querySelectorAll('.donut-s').forEach(c=>c.setAttribute('stroke-dasharray',c.dataset.d))}));
  document.querySelectorAll('#h-c1 [data-tip]').forEach(g=>{g.onmousemove=e=>{const t=$('tip');t.textContent=g.dataset.tip;t.style.left=e.clientX+12+'px';t.style.top=e.clientY-30+'px';t.style.opacity=1};g.onmouseleave=()=>$('tip').style.opacity=0});
  $('h-t').innerHTML=l.length?l.map(b=>{const E=EMPRESAS[b.emp];return `<tr><td class="code">${b.num}</td><td><span class="emp-tag"><i style="background:${E?.c1}"></i>${E?.corto||esc(b.emp)}</span></td><td style="white-space:nowrap">${fCorta(b.fpago)}</td>
   <td><button class="lnk" style="font-size:14px;text-align:left" onclick="B.hf.ben=${js(b.lineas[0].benef)};renderB()">${esc(b.lineas[0].benef)}</button>${b.lineas.length>1?` <span class="kind" title="${esc(b.lineas.slice(1).map(x=>x.benef).join(', '))}">+${b.lineas.length-1} más</span>`:''}<p>${esc(b.lineas.length>1?b.lineas.map(x=>x.concepto).join(' · '):b.concepto)}</p></td><td>${esc(b.mov)}${b.mov==='Tarjeta de crédito'?`<p>${esc(b.cta.replace('Tarjeta terminada en ','•••• '))}</p>`:''}</td><td class="amt-c">${fmtC(montoDe(b),b.mon)}${B.hf.ben&&b.lineas.length>1?`<p>de ${fmtC(b.monto,b.mon)}</p>`:''}</td>
   <td><div class="acts"><button class="lnk" onclick="pdfBoleta(S.pagos.find(x=>x.id===${b.id}))">PDF</button><button class="lnk" onclick="repetir(${b.id})">Repetir</button><button class="lnk red" onclick="borrarBoleta(this,${b.id})">Eliminar</button></div></td></tr>`}).join(''):'<tr><td colspan="7"><p class="empty">No hay boletas con estos filtros.</p></td></tr>';
}
/* Eliminar: el primer clic pide confirmar y el segundo borra (se cancela solo a los 4 segundos) */
function borrarBoleta(btn,id){
  const b=S.pagos.find(x=>x.id===id);if(!b)return;
  if(!btn.classList.contains('armed')){document.querySelectorAll('.lnk.armed').forEach(x=>{x.classList.remove('armed');x.textContent='Eliminar'});
    btn.classList.add('armed');btn.textContent='¿Seguro? Clic otra vez';clearTimeout(btn._t);btn._t=setTimeout(()=>{btn.classList.remove('armed');btn.textContent='Eliminar'},4000);return}
  clearTimeout(btn._t);btn.textContent='Eliminando…';
  act(async()=>{const sid=S.empData[b.emp]?.sid;
    if(sid){const mx=S.pagos.filter(x=>x.emp===b.emp).reduce((m,x)=>Math.max(m,x.num),0);if(mx>(S.empData[b.emp].ultimo||0))await setItem('bemp',sid,{UltimoNumero:mx})}
    await delItem('bpagos',id)},`Boleta ${EMPRESAS[b.emp].corto} N° ${b.num} eliminada`);
}
function repetir(id){const b=S.pagos.find(x=>x.id===id);B.nb=nbInicial(b);B.ultima=null;B.tab='nueva';renderB();scrollTo(0,0);toast('Datos copiados de la boleta N° '+b.num+'. Revisa fechas y monto.')}

/* ---------- Beneficiarios ---------- */
function tBen(){
  return `<div class="bar"><input class="search" placeholder="Buscar por nombre o cuenta" value="${esc(B.bq)}" oninput="B.bq=this.value;filasBen()"><div style="display:flex;gap:8px"><button class="btn" onclick="dImpBen()">Importar desde Excel</button><button class="btn primary" onclick="dBenef(null)">Agregar beneficiario</button></div></div>
  <p class="small muted" style="margin:-4px 0 14px">Una sola base para Aura y Unicen. ${plural(S.benef.length,'beneficiario','beneficiarios')}${S.benef.some(b=>!b.cuenta)?', '+S.benef.filter(b=>!b.cuenta).length+' sin cuenta':''}.</p>
  <div class="tbl"><table><thead><tr><th>Beneficiario</th><th>Cuenta</th><th>Boletas</th><th></th></tr></thead><tbody id="ben-t"></tbody></table></div>`}
function filasBen(){if(!$('ben-t'))return;const q=lc(B.bq),qs=sinEsp(q);
  const l=[...S.benef].sort(porNombre).filter(b=>!q||lc(b.nombre).includes(q)||(qs.length>2&&sinEsp(b.cuenta).includes(qs)));
  $('ben-t').innerHTML=l.length?l.map(b=>{const n=S.pagos.filter(x=>x.lineas.some(l=>l.benef===b.nombre)).length;return `<tr><td><strong>${esc(b.nombre)}</strong></td>
   <td class="ser">${b.cuenta?esc(b.cuenta):'<span class="pill Usada">Sin cuenta</span>'}</td><td>${n?`<button class="lnk" onclick="B.hf={emp:'',mon:'',mov:'',ben:${esc(JSON.stringify(b.nombre))},desde:'',hasta:'',q:''};B.tab='hist';renderB()">${plural(n,'boleta','boletas')}</button>`:'<span class="free">Ninguna</span>'}</td>
   <td><div class="acts"><button class="lnk" onclick="dBenef(${b.id})">${b.cuenta?'Editar':'Agregar cuenta'}</button><button class="lnk red" onclick="borrarBen(${b.id})">Eliminar</button></div></td></tr>`}).join(''):'<tr><td colspan="4"><p class="empty">No hay beneficiarios que coincidan.</p></td></tr>'}
function dBenef(id,nombre,linea){B.linea=linea??null;const b=id?S.benef.find(x=>x.id===id):null;document.querySelectorAll('.combo.open').forEach(c=>c.classList.remove('open'));if(B.tab==='nueva')nbSet();
  abrir(`<header><div><h2>${b?'Editar beneficiario':'Agregar beneficiario'}</h2><p>La base es la misma para Aura y Unicen.</p></div><button class="x" aria-label="Cerrar" onclick="cerrar()">×</button></header>
  <div class="body"><div class="err" id="err"></div>${fl('Nombre','<input id="bn-n" value="'+esc(b?b.nombre:nombre||'')+'" placeholder="Nombre o razón social">')}${fl('Cuenta (IBAN)','<input id="bn-c" value="'+esc(fmtIban(b?.cuenta||''))+'" placeholder="CR 0000 0000 0000 0000 0000" inputmode="text" autocomplete="off" oninput="mascaraIban(this)">')}
  <p class="small muted">Si se le paga con tarjeta de crédito o no tiene cuenta, puedes dejarla vacía.${b?' Las boletas anteriores conservan el nombre y la cuenta con que se hicieron.':''}</p></div>
  <footer><button class="btn" onclick="cerrar()">Cancelar</button><button class="btn primary" onclick="gBenef(${id||'null'})">Guardar</button></footer>`);setTimeout(()=>$(b&&!b.cuenta?'bn-c':'bn-n')?.focus(),200)}
function gBenef(id){const n=$('bn-n').value.trim().replace(/\s+/g,' '),c=fmtIban($('bn-c').value.trim().toUpperCase().replace(/\s+/g,' '));
  if(!n)return $('err').textContent='Escribe el nombre.';
  if(c&&!IBAN_RE.test(c))return $('err').textContent='La cuenta debe ser un IBAN de Costa Rica: CR seguido de 20 dígitos.';
  const dn=S.benef.find(x=>x.id!==id&&lc(x.nombre)===lc(n));if(dn)return $('err').textContent='Ya existe un beneficiario con ese nombre.';
  const dc=c&&S.benef.find(x=>x.id!==id&&sinEsp(x.cuenta)===sinEsp(c));if(dc)return $('err').textContent='Esa cuenta ya está registrada a nombre de '+dc.nombre+'.';
  const viejo=id?S.benef.find(x=>x.id===id)?.nombre:null,L=B.tab==='nueva'&&B.nb&&B.linea!=null?B.nb.lineas[B.linea]:null;
  cerrar();
  act(()=>id?setItem('bbenef',id,{Title:n,Cuenta:c}):addItem('bbenef',{Title:n,Cuenta:c}),'Beneficiario guardado',()=>{if(L){L.benef=n;L.cuentaB=c}if(B.nb&&viejo)B.nb.lineas.forEach(x=>{if(x.benef===viejo){x.benef=n;x.cuentaB=c}});render()});
}
function borrarBen(id){const b=S.benef.find(x=>x.id===id);
  confirmar('Eliminar beneficiario',`¿Eliminar a <strong>${esc(b.nombre)}</strong>? Las boletas anteriores conservan su nombre y cuenta.`,'Eliminar',()=>act(()=>delItem('bbenef',id),'Beneficiario eliminado'))}
/* Importar beneficiarios: hoja con columnas Nombre y Cuenta */
function dImpBen(){V.imp=null;
  abrir(`<header><div><h2>Importar beneficiarios</h2><p>Desde un Excel con las columnas Nombre y Cuenta.</p></div><button class="x" aria-label="Cerrar" onclick="cerrar()">×</button></header>
  <div class="body"><div class="err" id="err"></div><p class="small muted" style="margin-top:0">Se salta todo lo que ya exista con el mismo nombre o la misma cuenta, así que no se duplica.</p>
  ${fl('Archivo','<input type="file" id="i-f" accept=".xlsx,.xls" onchange="leerBen(this.files[0])">')}<div id="i-res"></div></div>
  <footer><button class="btn" onclick="cerrar()">Cancelar</button><button class="btn primary" id="i-go" disabled onclick="importarBen()">Importar</button></footer>`)}
async function leerBen(file){
  const er=$('err');er.textContent='';$('i-res').innerHTML='';$('i-go').disabled=true;V.imp=null;if(!file)return;
  if(!window.XLSX){try{er.textContent='Cargando el lector de Excel…';await cargarScript(XLSX_URL);er.textContent=''}catch(e){return er.textContent='No se pudo cargar el lector de Excel.'}}
  let wb;try{wb=XLSX.read(await file.arrayBuffer())}catch(e){return er.textContent='No se pudo leer el archivo: '+e.message}
  const ws=wb.Sheets[wb.SheetNames.find(s=>lc(s)==='beneficiarios')||wb.SheetNames[0]];
  const filas=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});const hi=filas.findIndex(r=>r.some(c=>/^(nombre|nombbenef)$/i.test(txt(c))));
  if(hi<0)return er.textContent='No encontré la columna "Nombre" en el archivo.';
  const hd=filas[hi].map(c=>lc(c)),cn=hd.findIndex(c=>c==='nombre'||c==='nombbenef'),cc=hd.findIndex(c=>c.startsWith('cuenta')||c.startsWith('cta'));
  const nombres=new Set(S.benef.map(b=>lc(b.nombre))),ctas=new Set(S.benef.map(b=>sinEsp(b.cuenta)).filter(Boolean)),nuevos=[],errores=[];let salt=0;
  filas.slice(hi+1).forEach((r,i)=>{const n=txt(r[cn]).replace(/\s+/g,' '),c=cc>=0?fmtIban(txt(r[cc]).toUpperCase().replace(/\s+/g,' ')):'';if(!n)return;
    if(c&&!IBAN_RE.test(c)){errores.push(`Fila ${hi+i+2} (${esc(n)}): la cuenta "${esc(c)}" no es un IBAN válido`);return}
    if(nombres.has(lc(n))||(c&&ctas.has(sinEsp(c)))){salt++;return}
    nombres.add(lc(n));if(c)ctas.add(sinEsp(c));nuevos.push({n,c})});
  V.imp={nuevos};
  $('i-res').innerHTML=`<div class="info"><strong>Listo para importar:</strong> ${plural(nuevos.length,'beneficiario nuevo','beneficiarios nuevos')}${nuevos.some(x=>!x.c)?` (${nuevos.filter(x=>!x.c).length} sin cuenta)`:''}.${salt?`<br>${plural(salt,'ya existía','ya existían')} y se ${salt===1?'salta':'saltan'}.`:''}</div>${errores.length?`<div class="err" style="display:block">${errores.slice(0,15).join('<br>')}</div>`:''}`;
  $('i-go').disabled=!nuevos.length;
}
async function importarBen(){const I=V.imp;if(!I||busy)return;I.corriendo=true;$('i-go').disabled=true;let fallos=0;
  await act(async()=>{const r=await batch(I.nuevos.map(x=>({method:'POST',url:`${LP('bbenef')}/items`,body:{fields:{Title:x.n,Cuenta:x.c}}})),(a,b)=>$('i-res').innerHTML=`<div class="info"><strong>Guardando beneficiarios…</strong> ${a} de ${b}<div class="bar-p"><span style="width:${Math.round(a/b*100)}%"></span></div></div>`);fallos=r.filter(x=>x.status>=300).length},
    null,()=>{I.corriendo=false;cerrar();B.tab='ben';render();toast(fallos?`Se importaron ${I.nuevos.length-fallos}. ${fallos} fallaron; vuelve a importar el archivo.`:`${plural(I.nuevos.length,'beneficiario importado','beneficiarios importados')}`)});
  I.corriendo=false;
}

/* ---------- Autorizan ---------- */
function tAut(){return `<div class="addrow"><input id="au-n" placeholder="Nombre de quien autoriza" onkeydown="if(event.key==='Enter')addAut()"><button class="btn primary" onclick="addAut()">Agregar</button></div>
  ${S.aut.length?`<div class="tbl"><table><thead><tr><th>Autoriza</th><th>Boletas</th><th></th></tr></thead><tbody>${[...S.aut].sort(porNombre).map(a=>`<tr><td><div class="who"><span class="avatar">${esc(ini(a.nombre))}</span><strong>${esc(a.nombre)}</strong></div></td><td>${S.pagos.filter(b=>b.aut===a.nombre).length}</td>
  <td><div class="acts">${S.aut.length>1?`<button class="lnk red" onclick="delAut(${a.id})">Eliminar</button>`:'<span class="small muted">Debe quedar al menos una persona</span>'}</div></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Agrega al menos una persona que autorice.</p>'}`}
function addAut(){const n=$('au-n').value.trim().replace(/\s+/g,' ');if(!n)return toast('Escribe el nombre.');if(S.aut.some(a=>lc(a.nombre)===lc(n)))return toast('Esa persona ya está en la lista.');act(()=>addItem('baut',{Title:n}),n+' agregado')}
function delAut(id){const a=S.aut.find(x=>x.id===id);confirmar('Eliminar de autorizan',`¿Quitar a <strong>${esc(a.nombre)}</strong> de la lista? Las boletas anteriores se mantienen igual.`,'Eliminar',()=>act(()=>delItem('baut',id),a.nombre+' eliminado',()=>{if(B.nb&&B.nb.aut===a.nombre)B.nb.aut=S.aut[0]?.nombre||'';render()}))}

/* ---------- Empresas: datos, cuentas y tarjetas ---------- */
function tEmp(){
  return `<p class="small muted" style="margin:-6px 0 18px">Estos datos salen en el encabezado de cada boleta nueva. Las boletas anteriores conservan los datos con que se hicieron.</p>
  <div class="empgrid">${EMP_IDS.map(id=>{const E=EMP(id);return `<div class="box">
   <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><img src="${E.logo}" alt="" style="height:34px;width:auto;max-width:120px"><h2 style="margin:0">${E.largo}</h2></div>
   <div class="sec">Datos de la empresa</div>
   ${fl('Nombre en la boleta',`<input id="e-${id}-nombre" value="${esc(E.nombre)}">`)}
   <div class="two">${fl('Cédula jurídica',`<input id="e-${id}-cedula" value="${esc(E.cedula)}">`)}${fl('Teléfono',`<input id="e-${id}-tel" value="${esc(E.tel)}">`)}</div>
   <div class="two">${fl('Fax',`<input id="e-${id}-fax" value="${esc(E.fax)}">`)}${fl('Apartado',`<input id="e-${id}-apartado" value="${esc(E.apartado)}">`)}</div>
   ${fl('Correo',`<input id="e-${id}-correo" value="${esc(E.correo)}">`)}
   ${fl('Dirección',`<input id="e-${id}-dir" value="${esc(E.dir)}">`)}
   ${fl('Texto del campo Empresa',`<input id="e-${id}-campo" value="${esc(E.campo)}">`)}
   <div class="sec">Cuentas bancarias</div>
   <div id="e-${id}-cu">${E.cuentas.map((c,i)=>filaCuenta(id,i,c)).join('')}</div>
   <button class="lnk" onclick="addFila('${id}','cu')">+ Agregar cuenta</button>
   <div class="sec">Tarjetas de crédito</div>
   <div id="e-${id}-ta">${E.tarjetas.map((t,i)=>filaTarjeta(id,i,t)).join('')}</div>
   ${E.tarjetas.length?'':`<p class="small muted" id="e-${id}-ta0" style="margin:0 0 6px">Sin tarjetas registradas.</p>`}
   <button class="lnk" onclick="addFila('${id}','ta')">+ Agregar tarjeta</button>
   <div class="err" id="e-${id}-err" style="margin-top:12px"></div>
   <button class="btn primary wide" style="margin-top:14px" onclick="gEmp('${id}')">Guardar ${E.largo}</button>
  </div>`}).join('')}</div>`}
const monOpts=v=>Object.entries(MON).map(([k,m])=>`<option value="${k}"${k===v?' selected':''}>${m.s} ${m.n}</option>`).join('');
const filaCuenta=(id,i,c)=>`<div class="erow cu"><input class="banco" value="${esc(c?.banco||'')}" placeholder="Banco" aria-label="Banco"><select class="mon" aria-label="Moneda">${monOpts(c?.mon||'CRC')}</select><input class="iban" value="${esc(fmtIban(c?.iban||''))}" placeholder="CR 0000 0000 0000 0000 0000" aria-label="Cuenta IBAN" autocomplete="off" oninput="mascaraIban(this)"><button class="x" aria-label="Quitar cuenta" onclick="this.parentNode.remove()">×</button></div>`;
const filaTarjeta=(id,i,t)=>`<div class="erow ta"><input class="banco" value="${esc(t?.banco||'')}" placeholder="Banco" aria-label="Banco"><select class="mon" aria-label="Moneda">${monOpts(t?.mon||'USD')}</select><input class="ult" value="${esc(t?.ult||'')}" placeholder="Últimos 4" maxlength="4" inputmode="numeric" aria-label="Últimos 4 dígitos" oninput="this.value=this.value.replace(/\\D/g,'')"><input class="alias" value="${esc(t?.alias||'')}" placeholder="Nombre (opcional)" aria-label="Nombre de la tarjeta"><button class="x" aria-label="Quitar tarjeta" onclick="this.parentNode.remove()">×</button></div>`;
function addFila(id,t){$(`e-${id}-${t}`).insertAdjacentHTML('beforeend',t==='cu'?filaCuenta(id):filaTarjeta(id));$(`e-${id}-ta0`)?.remove();$(`e-${id}-${t}`).lastElementChild.querySelector('input').focus()}
function gEmp(id){
  const v=k=>$(`e-${id}-${k}`).value.trim(),er=$(`e-${id}-err`);er.textContent='';
  const d={nombre:v('nombre'),cedula:v('cedula'),tel:v('tel'),fax:v('fax'),apartado:v('apartado'),correo:v('correo'),dir:v('dir'),campo:v('campo')};
  if(!d.nombre||!d.cedula||!d.campo)return er.textContent='Completa al menos el nombre, la cédula jurídica y el texto del campo Empresa.';
  const cuentas=[...document.querySelectorAll(`#e-${id}-cu .erow`)].map(r=>({banco:r.querySelector('.banco').value.trim().toUpperCase(),mon:r.querySelector('.mon').value,iban:fmtIban(r.querySelector('.iban').value.trim().toUpperCase().replace(/\s+/g,' '))})).filter(c=>c.banco||c.iban);
  const tarjetas=[...document.querySelectorAll(`#e-${id}-ta .erow`)].map(r=>({banco:r.querySelector('.banco').value.trim().toUpperCase(),mon:r.querySelector('.mon').value,ult:r.querySelector('.ult').value.trim(),alias:r.querySelector('.alias').value.trim()})).filter(t=>t.banco||t.ult);
  if(!cuentas.length)return er.textContent='Debe quedar al menos una cuenta bancaria.';
  for(const c of cuentas){if(!c.banco)return er.textContent='Falta el banco en una de las cuentas.';if(!IBAN_RE.test(c.iban))return er.textContent=`La cuenta "${c.iban}" no es un IBAN de Costa Rica válido.`}
  if(new Set(cuentas.map(c=>sinEsp(c.iban))).size<cuentas.length)return er.textContent='Hay una cuenta repetida.';
  for(const t of tarjetas){if(!t.banco)return er.textContent='Falta el banco en una de las tarjetas.';if(!/^\d{4}$/.test(t.ult))return er.textContent='Cada tarjeta necesita sus últimos 4 dígitos.'}
  if(new Set(tarjetas.map(t=>t.ult)).size<tarjetas.length)return er.textContent='Hay dos tarjetas con los mismos 4 dígitos.';
  const sid=S.empData[id]?.sid,f={Title:id,Nombre:d.nombre,Cedula:d.cedula,Telefono:d.tel,Fax:d.fax,Apartado:d.apartado,Correo:d.correo,Direccion:d.dir,CampoEmpresa:d.campo,Cuentas:JSON.stringify(cuentas),Tarjetas:JSON.stringify(tarjetas)};
  act(()=>sid?setItem('bemp',sid,f):addItem('bemp',f),EMPRESAS[id].largo+' guardada',()=>{if(B.nb&&B.nb.emp===id){const E=EMP(id);if(!E.cuentas.some(c=>c.iban===B.nb.cta))B.nb.cta=E.cuentas[0]?.iban||'';if(!E.tarjetas.some(t=>t.ult===B.nb.tar))B.nb.tar=E.tarjetas[0]?.ult||''}render()});
}


boot();
</script>
