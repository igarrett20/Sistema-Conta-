<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Activos y equipos | Grupo Garrett</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --brand:#0D6174; --brand-dark:#0A4E5D; --brand-soft:#E4F0F2;
  --ink:#1B2A33; --muted:#66737C; --line:#E2E7EA; --line-strong:#C9D1D6; --sunk:#F6F8F9;
  --pend:#A86C12; --pend-soft:#FBF1DC; --danger:#B3242D; --danger-soft:#FBE7E8; --ok:#2E7D4F; --ok-soft:#E3F2E8;
  --font:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:#fff}
body{margin:0;color:var(--ink);font:15px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.muted{color:var(--muted)}.small{font-size:13px}

.top{display:flex;align-items:center;gap:16px;padding:14px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top img{height:30px;width:auto;display:block}
.top .app-name{padding-left:16px;border-left:1px solid var(--line);color:var(--muted);font-size:14px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:13px;font-weight:700}
.test{padding:7px 28px;font-size:13px;color:var(--muted);background:var(--sunk);border-bottom:1px solid var(--line)}

main{max-width:1080px;margin:0 auto;padding:28px 24px 72px}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0 0 18px}
h2{font-size:17px;margin:0 0 12px}

.stats{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;margin-bottom:26px}
.stat{flex:1 1 200px;padding:16px 20px}
.stat+.stat{border-left:1px solid var(--line)}
.stat span{display:block;font-size:13px;color:var(--muted)}
.stat strong{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.stat.main strong{color:var(--brand);font-size:30px}
.stat small{display:block;font-size:13px;color:var(--muted)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{appearance:none;border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}

.btn{appearance:none;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;border:1px solid var(--line-strong);background:#fff;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark)}
.btn.sm{padding:5px 10px;font-size:13px}
.lnk{background:none;border:0;padding:0;color:var(--brand);font-weight:600;font-size:13px;cursor:pointer}
.lnk.red{color:var(--danger)}
.lnk:hover{text-decoration:underline}
.wide{width:100%}

.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.bar .search{flex:1;min-width:220px;max-width:380px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{appearance:none;border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.chip b{font-weight:700;margin-left:2px;opacity:.75}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:0 10px 8px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.code{font-weight:700;color:var(--brand);white-space:nowrap}
.ser{font-size:13px;letter-spacing:.02em;white-space:nowrap}
.acts{display:flex;gap:14px;justify-content:flex-end;white-space:nowrap}
.empty{color:var(--muted);font-size:14px;padding:18px 0;margin:0}
.free{color:var(--muted);font-style:italic}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:10px;white-space:nowrap}
.pill.Nueva{background:var(--ok-soft);color:var(--ok)}
.pill.Buena{background:var(--brand-soft);color:var(--brand)}
.pill.Usada{background:var(--pend-soft);color:var(--pend)}
.pill.Dañada{background:var(--danger-soft);color:var(--danger)}
.kind{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-radius:5px;padding:1px 6px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}

.f{display:grid;gap:5px;margin-bottom:14px}
.f>span{font-size:13px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:8px 10px;font-size:13px;margin:0 0 12px}
.err:empty{display:none}
.info{border-radius:8px;background:var(--brand-soft);padding:10px 12px;font-size:14px;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;margin-bottom:14px}
.seg button{appearance:none;border:0;background:#fff;padding:6px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-checked="true"]{background:var(--brand);color:#fff}

.scrim{position:fixed;inset:0;background:rgba(27,42,51,.25);z-index:39;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#fff;border-left:1px solid var(--line);z-index:40;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
.drawer.open{transform:none;box-shadow:-16px 0 40px rgba(20,40,50,.15)}
.drawer header{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0}
.drawer header p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.drawer .body{padding:18px 20px;overflow-y:auto;flex:1}
.drawer footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:5px}
.x:hover{color:var(--ink);background:var(--sunk)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

.back{margin-bottom:14px}
.acta{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.box{border:1px solid var(--line);border-radius:12px;padding:18px}
.box h2{margin-bottom:4px}
.pick{list-style:none;margin:8px 0 16px;padding:0}
.pick li{border-top:1px solid var(--line)}
.pick label{display:flex;gap:10px;align-items:flex-start;padding:9px 0;cursor:pointer;font-size:14px}
.pick input{width:auto;margin-top:3px;accent-color:var(--brand)}
.pick small{display:block;color:var(--muted);font-size:12px}
.sheet{background:var(--sunk);border-radius:12px;padding:24px;overflow-x:auto}
.paper{background:#fff;width:100%;max-width:680px;min-height:860px;margin:0 auto;padding:48px 52px;box-shadow:0 1px 3px rgba(20,40,50,.12),0 8px 24px rgba(20,40,50,.06);font-family:Arial,Helvetica,sans-serif;color:#111;font-size:12.5px;line-height:1.55}
.paper h3{text-align:center;font-size:17px;margin:0 0 18px}
.paper .fecha{text-align:right;margin-bottom:14px}
.paper .ln{display:inline-block;border-bottom:1px solid #111;padding:0 6px;font-weight:700}
.paper table{font-size:11.5px;margin:12px 0 18px}
.paper th,.paper td{border:1px solid #333;padding:5px 6px;color:#111;font-size:11.5px;white-space:normal}
.paper th{background:#E8E8E8;font-weight:700}
.paper p{margin:0 0 9px;text-align:justify}
.firmas{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:70px}
.firmas div{border-top:1px solid #111;padding-top:6px}
.firmas small{display:block;color:#444}

.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{margin:0}
.head-acts{display:flex;gap:8px;align-items:center}
.dd{position:relative}
.dd-pop{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:290px;background:#fff;border:1px solid var(--line-strong);border-radius:12px;padding:6px;box-shadow:0 12px 30px rgba(20,40,50,.16)}
.dd.open .dd-pop{display:block}
.dd-pop button{appearance:none;display:block;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:10px 12px;cursor:pointer}
.dd-pop button:hover{background:var(--brand-soft)}
.dd-pop small{display:block;color:var(--muted);font-size:13px}
.who{display:flex;gap:10px;align-items:center}
.eqline{padding:2px 0}
.eqline .pill{margin-left:4px;font-size:11px;padding:1px 8px}
.step{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:18px 0 8px}
.step:first-of-type{margin-top:4px}
.step i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px}
.drawer .pick{max-height:260px;overflow-y:auto;border-bottom:1px solid var(--line)}
@media (max-width:860px){
  .top{padding:12px 16px}.test{padding:7px 16px}
  .top .app-name{display:none}
  main{padding:20px 14px 60px}
  .stat+.stat{border-left:0;border-top:1px solid var(--line)}
  .acta{grid-template-columns:1fr}
  .paper{padding:28px 22px;min-height:0}
  .sheet{padding:12px}
  .two{grid-template-columns:1fr}
  .head-acts{width:100%}.head-acts .btn{flex:1}
  .dd{flex:1}.dd .btn{width:100%}
}
.gate{max-width:560px;margin:60px auto;text-align:center}
.gate h1{margin-bottom:10px}
.gate p{color:var(--muted);margin:0 0 20px}
.emptybox{border:1px dashed var(--line-strong);border-radius:12px;padding:40px 24px;text-align:center}
.emptybox h2{margin-bottom:6px}
.emptybox p{color:var(--muted);margin:0 0 18px}
body.busy{cursor:progress}
body.busy .btn,body.busy .lnk{pointer-events:none;opacity:.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
/* =====================================================================

   ===================================================================== */
const CONFIG={
  clientId:'f0e84e7f-82f3-4f42-9ebb-4e95e1fca868',   // Application (client) ID (la misma app de vacaciones)
  tenantId:'6d19a314-7bcf-411f-b9fd-8f6bc92c1e7b',   // Directory (tenant) ID
  siteHost:'aurainnovacionessa.sharepoint.com',
  sitePath:'/sites/ActivosyBoletas',                 // sitio de SharePoint donde solo entra contaduría
  lists:{personal:'ActivosPersonal',equipos:'ActivosEquipos',historial:'ActivosHistorial'}
};
const EMPRESA='Aura Innovaciones SA';
const CATEGORIAS=['Equipo cómputo','Mobiliario','Telecomunicaciones','Otro'];
const CONDICIONES=['Nueva','Buena','Usada','Dañada'];
const LEGAL=[
 'El equipo que aquí se entrega pertenece a la empresa '+EMPRESA+', por lo que la utilización de este equipo será exclusivamente para fines laborales, en caso de terminar el contrato laboral o daño del bien, me comprometo a devolverlo inmediatamente.',
 'En caso de equipo de cómputo, me comprometo a utilizarlo únicamente para desarrollo de mis funciones, si necesitase algún programa, sistema o mantenimiento, se realizará con el técnico o personal que la empresa asigne.',
 'Autorizo a la empresa a deducir de mi salario o prestaciones cualquier daño ocasionado por mi persona donde se demuestre negligencia o daño con conocimiento de causa.',
 'Lo anterior, según el artículo 72 inciso d) "Usar los útiles y herramientas suministradas por el patrono, para objeto distinto de aquél a que están normalmente destinados..." y el artículo 81 inciso d) "...cuando cause intencionalmente un daño material a las máquinas, herramientas..."'
];
const SCOPES=['User.Read','Sites.ReadWrite.All'];

/* Columnas de cada lista (la página las crea sola la primera vez si no existen) */
const SCHEMA={
  personal:[{name:'Cedula',text:{}}],
  equipos:[{name:'Equipo',text:{}},{name:'Categoria',text:{}},{name:'Serie',text:{}},{name:'Condicion',text:{}},{name:'Observaciones',text:{}},{name:'ResponsableId',number:{}}],
  historial:[{name:'Fecha',dateTime:{format:'dateOnly'}},{name:'De',text:{}},{name:'A',text:{}},{name:'Registro',text:{}}]
};

/* ---------- Estado ---------- */
let S={personas:[],equipos:[],hist:[]};
const V={tab:'pe',q:'',cat:'',view:'list',acta:null,cb:null};
const G={pca:null,account:null,me:null,siteId:null,listIds:{}};
let busy=false;

/* ---------- Helpers ---------- */
const $=id=>document.getElementById(id);
const P=id=>S.personas.find(p=>p.id===id);
const E=cod=>S.equipos.find(x=>x.cod===cod);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lc=s=>String(s||'').trim().toLowerCase();
const pad=n=>String(n).padStart(2,'0');
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const fActa=k=>{if(!k)return'';const[y,m,d]=k.split('-');return parseInt(d)+' '+MESES[m-1]+' '+y};
const fCorta=k=>{if(!k)return'';const[y,m,d]=k.split('-');return parseInt(d)+' '+MESES[m-1].slice(0,3).toLowerCase()+' '+y};
const opts=(a,v)=>a.map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('');
const ini=n=>n.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const yo=()=>G.me?.displayName||G.me?.mail||'';
const porNombre=(a,b)=>a.nombre.localeCompare(b.nombre);
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),3000)}
/* Fechas: se leen sin correrse de día y se escriben a mediodía UTC */
const rd=v=>{if(!v)return '';if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;const d=new Date(Date.parse(v)+6*3600e3);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`};
const wd=k=>k?k+'T12:00:00Z':null;

/* ---------- Inicio de sesión (Microsoft) ---------- */
async function initAuth(){
  G.pca=new msal.PublicClientApplication({
    auth:{clientId:CONFIG.clientId,authority:`https://login.microsoftonline.com/${CONFIG.tenantId}`,redirectUri:location.origin+location.pathname},
    cache:{cacheLocation:'localStorage'}
  });
  await G.pca.initialize();
  const res=await G.pca.handleRedirectPromise();
  G.account=res?.account||G.pca.getAllAccounts()[0]||null;
}
const login=()=>G.pca.loginRedirect({scopes:SCOPES,prompt:'select_account'});
const logout=()=>G.pca.logoutRedirect({account:G.account,postLogoutRedirectUri:location.origin+location.pathname});
async function token(){
  try{return (await G.pca.acquireTokenSilent({scopes:SCOPES,account:G.account})).accessToken}
  catch(e){await G.pca.acquireTokenRedirect({scopes:SCOPES,account:G.account});throw new Error('redirect')}
}

/* ---------- Microsoft Graph ---------- */
class GraphError extends Error{constructor(status,msg){super(msg);this.status=status}}
async function gx(method,path,body){
  const url=path.startsWith('http')?path:'https://graph.microsoft.com/v1.0'+path;
  const r=await fetch(url,{method,headers:{Authorization:'Bearer '+await token(),'Content-Type':'application/json',Prefer:'HonorNonIndexedQueriesWarningMayFailRandomly'},body:body?JSON.stringify(body):undefined});
  if(r.status===204)return null;
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw new GraphError(r.status,j?.error?.message||r.statusText);
  return j;
}
async function allItems(list){
  let url=`/sites/${G.siteId}/lists/${G.listIds[list]}/items?$expand=fields&$top=999`,out=[];
  while(url){const j=await gx('GET',url);out=out.concat(j.value);url=j['@odata.nextLink']||null}
  return out;
}
const addItem=(list,fields)=>gx('POST',`/sites/${G.siteId}/lists/${G.listIds[list]}/items`,{fields});
const setItem=(list,id,fields)=>gx('PATCH',`/sites/${G.siteId}/lists/${G.listIds[list]}/items/${id}/fields`,fields);

async function connect(){
  G.me=await gx('GET','/me?$select=displayName,mail,userPrincipalName');
  const site=await gx('GET',`/sites/${CONFIG.siteHost}:${CONFIG.sitePath}?$select=id`);
  G.siteId=site.id;
  const ls=(await gx('GET',`/sites/${G.siteId}/lists?$select=id,displayName,name&$top=200`)).value;
  for(const [key,name] of Object.entries(CONFIG.lists)){
    let f=ls.find(l=>lc(l.displayName)===lc(name)||lc(l.name)===lc(name));
    if(!f){
      try{f=await gx('POST',`/sites/${G.siteId}/lists`,{displayName:name,columns:SCHEMA[key],list:{template:'genericList'}})}
      catch(e){if(e.status===403)throw new GraphError(403,`Falta la lista "${name}" y tu cuenta no puede crearla. Entra primero con la cuenta dueña del sitio.`);throw e}
    }
    G.listIds[key]=f.id;
  }
}
async function loadAll(){
  const [pe,eq,hi]=await Promise.all(['personal','equipos','historial'].map(allItems));
  S.personas=pe.map(i=>({id:+i.id,nombre:i.fields.Title||'(sin nombre)',ced:i.fields.Cedula||''}));
  S.equipos=eq.map(i=>{const f=i.fields;return{sid:+i.id,cod:f.Title||'',eq:f.Equipo||'',cat:f.Categoria||'Otro',serie:f.Serie||'',cond:f.Condicion||'Buena',obs:f.Observaciones||'',asig:f.ResponsableId?+f.ResponsableId:null}})
    .filter(x=>x.cod).sort((a,b)=>a.cod.localeCompare(b.cod));
  S.equipos.forEach(x=>{if(x.asig&&!P(x.asig))x.asig=null});
  S.hist=hi.map(i=>{const f=i.fields;return{f:rd(f.Fecha),cod:f.Title||'',de:f.De||null,a:f.A||'',por:f.Registro||i.createdBy?.user?.displayName||'',t:Date.parse(i.createdDateTime)||0}})
    .sort((a,b)=>b.f.localeCompare(a.f)||b.t-a.t);
}
/* Guarda en SharePoint, recarga y vuelve a pintar */
async function act(fn,okMsg,after){
  if(busy)return false;busy=true;document.body.classList.add('busy');
  try{const r=await fn();await loadAll();if(after)after(r);else render();if(okMsg)toast(typeof okMsg==='function'?okMsg(r):okMsg);return true}
  catch(e){console.error(e);if(e.message!=='redirect')toast(e.status===403?'No tienes permiso para hacer ese cambio en SharePoint.':'No se pudo guardar: '+(e.message||e));return false}
  finally{busy=false;document.body.classList.remove('busy')}
}
const nuevaPersona=async(nombre,ced)=>+(await addItem('personal',{Title:nombre,Cedula:ced})).id;
async function mover(cods,pid,f){
  const p=pid?{id:pid,nombre:P(pid)?.nombre}:null;
  for(const cod of cods){
    const x=E(cod),de=P(x.asig);
    await setItem('equipos',x.sid,{ResponsableId:p?p.id:0});
    await addItem('historial',{Title:cod,Fecha:wd(f),De:de?.nombre||'',A:p?p.nombre:'Devuelto',Registro:yo()});
  }
}

/* ---------- Pantallas de inicio ---------- */
function screen(html){$('app').innerHTML=`<div class="gate">${html}</div>`}
function showUser(){$('whoami').innerHTML=G.me?`<span>${esc(G.me.displayName||'')}</span><span class="avatar">${esc(ini(G.me.displayName||'?'))}</span><button class="btn sm" onclick="logout()">Salir</button>`:''}
async function boot(){
  screen('<p class="muted">Cargando…</p>');
  if(!window.isSecureContext||!window.crypto?.subtle){
    if(location.protocol==='http:'&&location.hostname!=='localhost'){location.replace('https://'+location.host+location.pathname+location.search);return}
    screen('<h1>Esta página necesita una conexión segura</h1><p>Ábrela con una dirección que empiece con <strong>https://</strong>.</p>');return}
  try{await initAuth()}catch(e){console.error(e);screen(`<h1>No se pudo iniciar sesión</h1><p>${esc(e.message)}</p>`);return}
  if(!G.account){screen('<h1>Activos y equipos</h1><p>Entra con tu cuenta de trabajo de Microsoft, la misma de Outlook y Teams. El acceso es solo para contaduría.</p><button class="btn primary" onclick="login()">Iniciar sesión</button>');return}
  try{await connect();showUser();await loadAll()}
  catch(e){console.error(e);if(e.message==='redirect')return;showUser();
    screen(e.status===403||e.status===401||e.status===404&&!G.siteId
      ?'<h1>No tienes acceso</h1><p>Tu cuenta entró bien, pero este sistema es solo para contaduría. Si deberías tener acceso, pide que te den permiso en las listas de activos en SharePoint.</p>'
      :`<h1>No se pudieron cargar los datos</h1><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Intentar de nuevo</button>`);return}
  render();
}

/* ---------- Drawer ---------- */
function abrir(h){const d=$('drawer');d.innerHTML=h;d.classList.add('open');d.setAttribute('aria-hidden','false');$('scrim').classList.add('open')}
function cerrar(){$('drawer').classList.remove('open');$('drawer').setAttribute('aria-hidden','true');$('scrim').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrar()});

const chk=(x,on)=>`<li><label><input type="checkbox" class="d-chk" value="${x.cod}"${on?' checked':''}><span><strong>${esc(x.cod)}</strong> ${esc(x.eq)}<small>${esc(x.cat)} · Serie ${esc(x.serie)}</small></span></label></li>`;
const marcados=()=>[...document.querySelectorAll('.d-chk:checked')].map(i=>i.value);
const disponibles=()=>S.equipos.filter(x=>!x.asig);
function validarPersona(n,c){
  if(!n||!c)return 'Ingresa el nombre completo y la cédula.';
  if(!/^\d-\d{4}-\d{4}$/.test(c))return 'La cédula debe tener el formato 1-1234-5678.';
  const p=S.personas.find(q=>q.ced===c);if(p)return 'Esa cédula ya está registrada a nombre de '+p.nombre+'.';

}
const plural=(n,a,b)=>n+' '+(n===1?a:b);

/* Agregar personal */
function dPersona(){

  abrir(`<header><div><h2>Agregar personal</h2><p>Registra al colaborador y, si quieres, entrégale equipo de una vez.</p></div><button class="x" aria-label="Cerrar" onclick="cerrar()">×</button></header>
  <div class="body"><div class="err" id="err"></div>
   ${fl('Nombre completo','<input id="p-n" placeholder="Nombre y dos apellidos">')}
   ${fl('Cédula','<input id="p-c" placeholder="1-1234-5678">')}
   <div class="step">Entregar equipo ahora <span class="muted">(opcional)</span></div>
   ${dis.length?`<ul class="pick">${dis.map(x=>chk(x,false)).join('')}</ul>${fl('Fecha de entrega',`<input id="p-f" type="date" value="${hoy()}">`)}`:'<p class="small muted">No hay equipos disponibles. Puedes asignarle equipo después con Cambio de responsable.</p>'}

function gPersona(){
  const n=$('p-n').value.trim().replace(/\s+/g,' '),c=$('p-c').value.trim(),m=marcados();

    m.length?`${n} registrado con ${plural(m.length,'equipo','equipos')}`:`${n} registrado`,
    id=>{if(m.length)abrirActa(id,m,f);else{V.tab='pe';render()}});

/* Agregar equipo */
function dAgregar(){
  abrir(`<header><div><h2>Agregar equipo</h2><p>Queda registrado en el inventario.</p></div><button class="x" aria-label="Cerrar" onclick="cerrar()">×</button></header>
  <div class="body"><div class="err" id="err"></div>
   <div class="two">${fl('Código','<input id="n-cod" placeholder="AI0140">')}${fl('Serie','<input id="n-serie" placeholder="COXQWT2">')}</div>
   ${fl('Equipo','<input id="n-eq" placeholder="Computador portátil">')}
   <div class="two">${fl('Categoría',`<select id="n-cat">${opts(CATEGORIAS)}</select>`)}${fl('Condición',`<select id="n-cond">${opts(CONDICIONES)}</select>`)}</div>
   ${fl('Observaciones','<input id="n-obs" placeholder="Incluye cargador">')}
   ${fl('Responsable',`<select id="n-asig"><option value="">Dejar disponible</option>${[...S.personas].sort(porNombre).map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select>`)}

function gAgregar(){

  if(!cod||!eq||!serie)return $('err').textContent='Completa código, serie y equipo.';
  if(!/^[A-Z0-9-]+$/.test(cod))return $('err').textContent='El código solo puede tener letras, números y guiones.';
  if(E(cod))return $('err').textContent='Ya existe un equipo con el código '+cod+'.';
  const asig=v('n-asig')?+v('n-asig'):null,an=asig?P(asig).nombre:'';
  cerrar();
  act(async()=>{
    await addItem('equipos',{Title:cod,Equipo:eq,Categoria:v('n-cat'),Serie:serie,Condicion:v('n-cond'),Observaciones:v('n-obs'),ResponsableId:asig||0});
    await addItem('historial',{Title:cod,Fecha:wd(f),De:'',A:asig?an:'Disponible',Registro:yo()});
  },'Equipo '+cod+' agregado',()=>{if(asig)abrirActa(asig,[cod],f);else{V.tab='eq';render()}});
}

/* Cambio de responsable: origen -> equipos -> nueva persona */
function dCambio(origen,cod,destino){
  const con=[...S.personas].filter(p=>S.equipos.some(x=>x.asig===p.id)).sort(porNombre);
  if(origen===undefined)origen=con.length?con[0].id:0;
  V.cb={origen,cod:cod||null,modo:'exist',destino:destino||null};
  abrir(`<header><div><h2>Cambio de responsable</h2><p>Elige quién tiene el equipo, qué equipos pasan y a quién.</p></div><button class="x" aria-label="Cerrar" onclick="cerrar()">×</button></header>
  <div class="body"><div class="err" id="err"></div>
   <div class="step"><i>1</i> Equipo de</div>
   <select id="c-o" onchange="V.cb.origen=+this.value;V.cb.cod=null;cbEquipos();cbDestino()">
    ${con.map(p=>`<option value="${p.id}"${p.id===origen?' selected':''}>${esc(p.nombre)}</option>`).join('')}
    <option value="0"${origen===0?' selected':''}>Equipos disponibles (sin responsable)</option>
   </select>
   <div class="step"><i>2</i> Equipos que pasan <button class="lnk" style="margin-left:auto" onclick="todos()">Marcar todos</button></div>
   <ul class="pick" id="c-eq"></ul>
   <div class="step"><i>3</i> Nuevo responsable</div>
   <div class="seg" role="radiogroup"><button role="radio" id="m-e" aria-checked="true" onclick="cbModo('exist')">Personal registrado</button><button role="radio" id="m-n" aria-checked="false" onclick="cbModo('nueva')">Persona nueva</button><button role="radio" id="m-d" aria-checked="false" onclick="cbModo('dev')">Devolver</button></div>
   <div id="c-dest"></div>
   ${fl('Fecha','<input id="c-f" type="date" value="'+hoy()+'">')}
  </div>
  <footer><button class="btn" onclick="cerrar()">Cancelar</button><button class="btn primary" id="c-ok" onclick="gCambio()">Guardar y generar acta</button></footer>`);
  cbEquipos();cbDestino();
}
function cbEquipos(){
  const o=V.cb.origen,lista=o?S.equipos.filter(x=>x.asig===o):disponibles();
  $('c-eq').innerHTML=lista.length?lista.map(x=>chk(x,V.cb.cod?x.cod===V.cb.cod:o!==0&&lista.length===1)).join(''):'<li><p class="small muted" style="margin:8px 0">No hay equipos en esta selección.</p></li>';
  $('err').textContent='';
}
function todos(){document.querySelectorAll('.d-chk').forEach(i=>i.checked=true)}
function cbModo(m){V.cb.modo=m;['e','n','d'].forEach(k=>$('m-'+k).setAttribute('aria-checked',{e:'exist',n:'nueva',d:'dev'}[k]===m));cbDestino()}
function cbDestino(){
  const m=V.cb.modo,o=V.cb.origen;$('err').textContent='';
  $('m-d').hidden=o===0;if(o===0&&m==='dev'){cbModo('exist');return}
  $('c-ok').textContent=m==='dev'?'Guardar devolución':'Guardar y generar acta';
  if(m==='exist'){const ps=[...S.personas].filter(p=>p.id!==o).sort(porNombre);
    $('c-dest').innerHTML=ps.length?fl('Persona',`<select id="c-p">${ps.map(p=>`<option value="${p.id}"${p.id===V.cb.destino?' selected':''}>${esc(p.nombre)} · ${esc(p.ced)}</option>`).join('')}</select>`):'<p class="small muted">No hay otro personal registrado. Usa Persona nueva.</p>'}
  else if(m==='nueva')$('c-dest').innerHTML=`<div class="two">${fl('Nombre completo','<input id="c-n" placeholder="Nombre y dos apellidos">')}${fl('Cédula','<input id="c-c" placeholder="1-1234-5678">')}</div>`;
  else $('c-dest').innerHTML='<div class="info">Los equipos marcados quedan disponibles en el inventario, sin responsable.</div>';
}
function gCambio(){
  const m=marcados(),f=$('c-f').value,er=$('err'),modo=V.cb.modo;
  if(!m.length)return er.textContent='Marca al menos un equipo.';
  if(!f)return er.textContent='Selecciona la fecha.';
  let pid=null,n='',c='';
  if(modo==='exist'){pid=$('c-p')?+$('c-p').value:null;if(!P(pid))return er.textContent='Selecciona a la nueva persona.'}
  else if(modo==='nueva'){n=$('c-n').value.trim().replace(/\s+/g,' ');c=$('c-c').value.trim();const v=validarPersona(n,c);if(v)return er.textContent=v}
  cerrar();
  act(async()=>{
    if(modo==='nueva'){pid=await nuevaPersona(n,c);S.personas.push({id:pid,nombre:n,ced:c})}
    await mover(m,pid,f);return pid;
  },()=>pid?`${plural(m.length,'equipo pasó','equipos pasaron')} a ${P(pid)?.nombre||n}`:plural(m.length,'equipo devuelto','equipos devueltos'),
  ()=>{if(pid)abrirActa(pid,m,f);else render()});
}

function prev(){
  if(!$('paper'))return;const d=datos();$('a-err').textContent='';
  $('paper').innerHTML=`<h3>Acta de entrega de equipo</h3>
  <div class="fecha">Fecha: ${fActa(d.f)}</div>
  <p>Se le hace entrega a <span class="ln">${esc(d.p.nombre)}</span> cédula <span class="ln">${esc(d.p.ced)}</span> los siguientes equipos:</p>
  <table><thead><tr><th>Código</th><th>Equipo</th><th>Categoría</th><th>Serie</th><th>Condición</th><th>Observaciones</th></tr></thead>
  <tbody>${d.eqs.length?d.eqs.map(x=>`<tr><td>${esc(x.cod)}</td><td>${esc(x.eq)}</td><td>${esc(x.cat)}</td><td>${esc(x.serie)}</td><td>${esc(x.cond)}</td><td>${esc(x.obs)}</td></tr>`).join(''):'<tr><td colspan="6" style="color:#888">Selecciona al menos un equipo</td></tr>'}</tbody></table>
  ${LEGAL.map(t=>`<p>${esc(t)}</p>`).join('')}
  <div class="firmas"><div>Entregado por: ${esc(d.por)}</div><div>Recibido por: ${esc(d.p.nombre)}<small>Cédula: ${esc(d.p.ced)}</small></div></div>`;
}
function pdf(){
  const d=datos(),er=$('a-err');
  if(!d.eqs.length)return er.textContent='Selecciona al menos un equipo para el acta.';
  if(!d.por)return er.textContent='Indica quién entrega el equipo.';
  if(!window.jspdf)return er.textContent='No se pudo cargar el generador de PDF. Revisa la conexión a internet.';
  const doc=new jspdf.jsPDF({unit:'mm',format:'letter'}),L=22,W=171.9,R=L+W;let y=28;
  doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text('Acta de entrega de equipo',107.95,y,{align:'center'});y+=12;
  doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.text('Fecha: '+fActa(d.f),R,y,{align:'right'});y+=10;
  const t1='Se le hace entrega a ',t2=' cédula ',t3=' los siguientes equipos:';
  let x=L;const seg=(t,b)=>{doc.setFont('helvetica',b?'bold':'normal');doc.text(t,x,y);const w=doc.getTextWidth(t);if(b)doc.line(x,y+1,x+w,y+1);x+=w};
  if(doc.getTextWidth(t1+d.p.nombre+t2+d.p.ced+t3)<W){seg(t1);seg(d.p.nombre,1);seg(t2);seg(d.p.ced,1);seg(t3);y+=9}
  else{const l=doc.splitTextToSize(t1+d.p.nombre+','+t2+d.p.ced+','+t3,W);doc.text(l,L,y);y+=l.length*5+4}
  const cw=[19,33,29,28,21,41.9];
  const fila=(c,h)=>{doc.setFont('helvetica',h?'bold':'normal');doc.setFontSize(9);const ls=c.map((v,i)=>doc.splitTextToSize(String(v||''),cw[i]-3));const hh=Math.max(...ls.map(l=>l.length))*4+3.5;
    if(y+hh>262){doc.addPage();y=25}let xx=L;
    ls.forEach((l,i)=>{if(h){doc.setFillColor(232,232,232);doc.rect(xx,y,cw[i],hh,'FD')}else doc.rect(xx,y,cw[i],hh);doc.text(l,xx+1.5,y+4.7);xx+=cw[i]});y+=hh};
  doc.setLineWidth(.2);fila(['Código','Equipo','Categoría','Serie','Condición','Observaciones'],1);d.eqs.forEach(q=>fila([q.cod,q.eq,q.cat,q.serie,q.cond,q.obs]));y+=9;
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);
  LEGAL.forEach(t=>{const l=doc.splitTextToSize(t,W);if(y+l.length*4.4>262){doc.addPage();y=25}doc.text(l,L,y,{align:'justify',maxWidth:W});y+=l.length*4.4+3.5});
  y+=26;if(y>245){doc.addPage();y=50}
  doc.line(L,y,L+72,y);doc.line(R-72,y,R,y);doc.setFontSize(10);
  doc.text('Entregado por: '+d.por,L,y+5);doc.text('Recibido por: '+d.p.nombre,R-72,y+5);doc.setTextColor(80);doc.text('Cédula: '+d.p.ced,R-72,y+10);
  const fn='Acta_'+d.p.nombre.replace(/\s+/g,'_')+'_'+d.f+'.pdf';
  try{doc.save(fn);toast('PDF descargado: '+fn)}catch(e){er.textContent='No se pudo descargar el PDF.'}
}

/* ---------- Historial ---------- */
function tHi(){
  if(!S.hist.length)return vacio('Todavía no hay movimientos','Cada entrega, cambio de responsable o devolución queda registrada aquí.','');
  return `<div class="tbl"><table><thead><tr><th>Fecha</th><th>Equipo</th><th>Movimiento</th><th>Registró</th></tr></thead><tbody>
  ${S.hist.map(h=>{const x=E(h.cod);return `<tr><td style="white-space:nowrap">${fCorta(h.f)}</td>
   <td><span class="code">${esc(h.cod)}</span><p>${x?esc(x.eq):''}</p></td>
   <td>${h.de?esc(h.de)+' → ':'<span class="kind">Nuevo</span> '}${h.a==='Devuelto'?'<span class="pill Usada">Devuelto</span>':esc(h.a)}</td>
   <td class="muted">${esc(h.por)}</td></tr>`}).join('')}
  </tbody></table></div>`;
}
