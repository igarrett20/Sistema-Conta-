/* ---------- Beneficiarios ---------- */
function tBen(){
  return `<div class="bar"><input class="search" placeholder="Buscar por nombre o cuenta" value="${esc(B.bq)}" oninput="B.bq=this.value;filasBen()"><div style="display:flex;gap:8px"><button class="btn" onclick="dImpBen()">Importar desde Excel</button><button class="btn primary" onclick="dBenef(null)">Agregar beneficiario</button></div></div>
  <p class="small muted" style="margin:-4px 0 14px">Una sola base para Aura y Unicen. ${plural(S.benef.length,'beneficiario','beneficiarios')}${S.benef.some(b=>!b.cuenta)?', '+S.benef.filter(b=>!b.cuenta).length+' sin cuenta':''}.</p>
  <div class="tbl"><table><thead><tr><th>Beneficiario</th><th>Cuenta</th><th>Boletas</th><th></th></tr></thead><tbody id="ben-t"></tbody></table></div>`}
function filasBen(){if(!$('ben-t'))return;const q=lc(B.bq),qs=sinEsp(q);
  const l=[...S.benef].sort(porNombre).filter(b=>!q||lc(b.nombre).includes(q)||(qs.length>2&&sinEsp(b.cuenta).includes(qs)));
  $('ben-t').innerHTML=l.length?l.map(b=>{const n=S.pagos.filter(x=>x.lineas.some(l=>l.benef===b.nombre)).length;return `<tr><td><strong>${esc(b.nombre)}</strong></td>
   <td class="ser">${b.cuenta?esc(b.cuenta):'<span class="pill Usada">Sin cuenta</span>'}</td><td>${n?`<button class="lnk" onclick="B.hf={emp:'',mon:'',mov:'',ben:${esc(JSON.stringify(b.nombre))},desde:'',hasta:'',q:''};B.tab='hist';renderB()">${plural(n,'boleta','boletas')}</button>`:'<span class="free">Ninguna</span>'}</td>
   <td><div class="acts"><button class="lnk" onclick="dBenef(${b.id})">${b.cuenta?'Editar':'Agregar cuenta'}</button><button class="lnk red" onclick="borrarBen(${b.id})">Eliminar</button></div></td></tr>`}).join(''):'<tr><td colspan="4"><p class="empty">No hay beneficiarios que coincidan.</p></td></tr>'}
function dBenef(id,nombre,linea){B.linea=linea??null;const b=id?S.benef.find(x=>x.id===id):null;document.querySelectorAll('.combo.open').forEach(c=>c.classList.remove('open'));if(B.tab==='nueva')nbSet();
  abrir(`<header><div><h2>${b?'Editar beneficiario':'Agregar beneficiario'}</h2><p>La base es la misma para Aura y Unicen.</p></div><button class="x" aria-label="Cerrar" onclick="cerrar()">×</button></header>
  <div class="body"><div class="err" id="err"></div>${fl('Nombre','<input id="bn-n" value="'+esc(b?b.nombre:nombre||'')+'" placeholder="Nombre o razón social">')}${fl('Cuenta (IBAN)','<input id="bn-c" value="'+esc(b?.cuenta||'')+'" placeholder="CR00 0000 0000 0000 0000 00">')}
  <p class="small muted">Si se le paga con tarjeta de crédito o no tiene cuenta, puedes dejarla vacía.${b?' Las boletas anteriores conservan el nombre y la cuenta con que se hicieron.':''}</p></div>
  <footer><button class="btn" onclick="cerrar()">Cancelar</button><button class="btn primary" onclick="gBenef(${id||'null'})">Guardar</button></footer>`);setTimeout(()=>$(b&&!b.cuenta?'bn-c':'bn-n')?.focus(),200)}
function gBenef(id){const n=$('bn-n').value.trim().replace(/\s+/g,' '),c=$('bn-c').value.trim().toUpperCase().replace(/\s+/g,' ');
  if(!n)return $('err').textContent='Escribe el nombre.';
  if(c&&!IBAN_RE.test(c))return $('err').textContent='La cuenta debe ser un IBAN de Costa Rica: CR seguido de 20 dígitos.';
  const dn=S.benef.find(x=>x.id!==id&&lc(x.nombre)===lc(n));if(dn)return $('err').textContent='Ya existe un beneficiario con ese nombre.';
  const dc=c&&S.benef.find(x=>x.id!==id&&sinEsp(x.cuenta)===sinEsp(c));if(dc)return $('err').textContent='Esa cuenta ya está registrada a nombre de '+dc.nombre+'.';
  const viejo=id?S.benef.find(x=>x.id===id)?.nombre:null,L=B.tab==='nueva'&&B.nb&&B.linea!=null?B.nb.lineas[B.linea]:null;
  cerrar();
  act(()=>id?setItem('bbenef',id,{Title:n,Cuenta:c}):addItem('bbenef',{Title:n,Cuenta:c}),'Beneficiario guardado',()=>{if(L){L.benef=n;L.cuentaB=c}if(B.nb&&viejo)B.nb.lineas.forEach(x=>{if(x.benef===viejo){x.benef=n;x.cuentaB=c}});render()});
}
function borrarBen(id){const b=S.benef.find(x=>x.id===id);
  confirmar('Eliminar beneficiario',`¿Eliminar a <strong>${esc(b.nombre)}</strong>? Las boletas anteriores conservan su nombre y cuenta.`,'Eliminar',()=>act(()=>delItem('bbenef',id),'Beneficiario eliminado'))}
/* Importar beneficiarios: hoja con columnas Nombre y Cuenta */
function dImpBen(){V.imp=null;
  abrir(`<header><div><h2>Importar beneficiarios</h2><p>Desde un Excel con las columnas Nombre y Cuenta.</p></div><button class="x" aria-label="Cerrar" onclick="cerrar()">×</button></header>
  <div class="body"><div class="err" id="err"></div><p class="small muted" style="margin-top:0">Se salta todo lo que ya exista con el mismo nombre o la misma cuenta, así que no se duplica.</p>
  ${fl('Archivo','<input type="file" id="i-f" accept=".xlsx,.xls" onchange="leerBen(this.files[0])">')}<div id="i-res"></div></div>
  <footer><button class="btn" onclick="cerrar()">Cancelar</button><button class="btn primary" id="i-go" disabled onclick="importarBen()">Importar</button></footer>`)}
async function leerBen(file){
  const er=$('err');er.textContent='';$('i-res').innerHTML='';$('i-go').disabled=true;V.imp=null;if(!file)return;
  if(!window.XLSX){try{er.textContent='Cargando el lector de Excel…';await cargarScript(XLSX_URL);er.textContent=''}catch(e){return er.textContent='No se pudo cargar el lector de Excel.'}}
  let wb;try{wb=XLSX.read(await file.arrayBuffer())}catch(e){return er.textContent='No se pudo leer el archivo: '+e.message}
  const ws=wb.Sheets[wb.SheetNames.find(s=>lc(s)==='beneficiarios')||wb.SheetNames[0]];
  const filas=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});const hi=filas.findIndex(r=>r.some(c=>/^(nombre|nombbenef)$/i.test(txt(c))));
  if(hi<0)return er.textContent='No encontré la columna "Nombre" en el archivo.';
  const hd=filas[hi].map(c=>lc(c)),cn=hd.findIndex(c=>c==='nombre'||c==='nombbenef'),cc=hd.findIndex(c=>c.startsWith('cuenta')||c.startsWith('cta'));
  const nombres=new Set(S.benef.map(b=>lc(b.nombre))),ctas=new Set(S.benef.map(b=>sinEsp(b.cuenta)).filter(Boolean)),nuevos=[],errores=[];let salt=0;
  filas.slice(hi+1).forEach((r,i)=>{const n=txt(r[cn]).replace(/\s+/g,' '),c=cc>=0?txt(r[cc]).toUpperCase().replace(/\s+/g,' '):'';if(!n)return;
    if(c&&!IBAN_RE.test(c)){errores.push(`Fila ${hi+i+2} (${esc(n)}): la cuenta "${esc(c)}" no es un IBAN válido`);return}
    if(nombres.has(lc(n))||(c&&ctas.has(sinEsp(c)))){salt++;return}
    nombres.add(lc(n));if(c)ctas.add(sinEsp(c));nuevos.push({n,c})});
  V.imp={nuevos};
  $('i-res').innerHTML=`<div class="info"><strong>Listo para importar:</strong> ${plural(nuevos.length,'beneficiario nuevo','beneficiarios nuevos')}${nuevos.some(x=>!x.c)?` (${nuevos.filter(x=>!x.c).length} sin cuenta)`:''}.${salt?`<br>${plural(salt,'ya existía','ya existían')} y se ${salt===1?'salta':'saltan'}.`:''}</div>${errores.length?`<div class="err" style="display:block">${errores.slice(0,15).join('<br>')}</div>`:''}`;
  $('i-go').disabled=!nuevos.length;
}
async function importarBen(){const I=V.imp;if(!I||busy)return;I.corriendo=true;$('i-go').disabled=true;let fallos=0;
  await act(async()=>{const r=await batch(I.nuevos.map(x=>({method:'POST',url:`${LP('bbenef')}/items`,body:{fields:{Title:x.n,Cuenta:x.c}}})),(a,b)=>$('i-res').innerHTML=`<div class="info"><strong>Guardando beneficiarios…</strong> ${a} de ${b}<div class="bar-p"><span style="width:${Math.round(a/b*100)}%"></span></div></div>`);fallos=r.filter(x=>x.status>=300).length},
    null,()=>{I.corriendo=false;cerrar();B.tab='ben';render();toast(fallos?`Se importaron ${I.nuevos.length-fallos}. ${fallos} fallaron; vuelve a importar el archivo.`:`${plural(I.nuevos.length,'beneficiario importado','beneficiarios importados')}`)});
  I.corriendo=false;
}

/* ---------- Autorizan ---------- */
function tAut(){return `<div class="addrow"><input id="au-n" placeholder="Nombre de quien autoriza" onkeydown="if(event.key==='Enter')addAut()"><button class="btn primary" onclick="addAut()">Agregar</button></div>
  ${S.aut.length?`<div class="tbl"><table><thead><tr><th>Autoriza</th><th>Boletas</th><th></th></tr></thead><tbody>${[...S.aut].sort(porNombre).map(a=>`<tr><td><div class="who"><span class="avatar">${esc(ini(a.nombre))}</span><strong>${esc(a.nombre)}</strong></div></td><td>${S.pagos.filter(b=>b.aut===a.nombre).length}</td>
  <td><div class="acts">${S.aut.length>1?`<button class="lnk red" onclick="delAut(${a.id})">Eliminar</button>`:'<span class="small muted">Debe quedar al menos una persona</span>'}</div></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Agrega al menos una persona que autorice.</p>'}`}
function addAut(){const n=$('au-n').value.trim().replace(/\s+/g,' ');if(!n)return toast('Escribe el nombre.');if(S.aut.some(a=>lc(a.nombre)===lc(n)))return toast('Esa persona ya está en la lista.');act(()=>addItem('baut',{Title:n}),n+' agregado')}
function delAut(id){const a=S.aut.find(x=>x.id===id);confirmar('Eliminar de autorizan',`¿Quitar a <strong>${esc(a.nombre)}</strong> de la lista? Las boletas anteriores se mantienen igual.`,'Eliminar',()=>act(()=>delItem('baut',id),a.nombre+' eliminado',()=>{if(B.nb&&B.nb.aut===a.nombre)B.nb.aut=S.aut[0]?.nombre||'';render()}))}

/* ---------- Empresas: datos, cuentas y tarjetas ---------- */
function tEmp(){
  return `<p class="small muted" style="margin:-6px 0 18px">Estos datos salen en el encabezado de cada boleta nueva. Las boletas anteriores conservan los datos con que se hicieron.</p>
  <div class="empgrid">${EMP_IDS.map(id=>{const E=EMP(id);return `<div class="box">
   <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><img src="${E.logo}" alt="" style="height:34px;width:auto;max-width:120px"><h2 style="margin:0">${E.largo}</h2></div>
   <div class="sec">Datos de la empresa</div>
   ${fl('Nombre en la boleta',`<input id="e-${id}-nombre" value="${esc(E.nombre)}">`)}
   <div class="two">${fl('Cédula jurídica',`<input id="e-${id}-cedula" value="${esc(E.cedula)}">`)}${fl('Teléfono',`<input id="e-${id}-tel" value="${esc(E.tel)}">`)}</div>
   <div class="two">${fl('Fax',`<input id="e-${id}-fax" value="${esc(E.fax)}">`)}${fl('Apartado',`<input id="e-${id}-apartado" value="${esc(E.apartado)}">`)}</div>
   ${fl('Correo',`<input id="e-${id}-correo" value="${esc(E.correo)}">`)}
   ${fl('Dirección',`<input id="e-${id}-dir" value="${esc(E.dir)}">`)}
   ${fl('Texto del campo Empresa',`<input id="e-${id}-campo" value="${esc(E.campo)}">`)}
   <div class="sec">Cuentas bancarias</div>
   <div id="e-${id}-cu">${E.cuentas.map((c,i)=>filaCuenta(id,i,c)).join('')}</div>
   <button class="lnk" onclick="addFila('${id}','cu')">+ Agregar cuenta</button>
   <div class="sec">Tarjetas de crédito</div>
   <div id="e-${id}-ta">${E.tarjetas.map((t,i)=>filaTarjeta(id,i,t)).join('')}</div>
   ${E.tarjetas.length?'':`<p class="small muted" id="e-${id}-ta0" style="margin:0 0 6px">Sin tarjetas registradas.</p>`}
   <button class="lnk" onclick="addFila('${id}','ta')">+ Agregar tarjeta</button>
   <div class="err" id="e-${id}-err" style="margin-top:12px"></div>
   <button class="btn primary wide" style="margin-top:14px" onclick="gEmp('${id}')">Guardar ${E.largo}</button>
  </div>`}).join('')}</div>`}
const monOpts=v=>Object.entries(MON).map(([k,m])=>`<option value="${k}"${k===v?' selected':''}>${m.s} ${m.n}</option>`).join('');
const filaCuenta=(id,i,c)=>`<div class="erow cu"><input class="banco" value="${esc(c?.banco||'')}" placeholder="Banco" aria-label="Banco"><select class="mon" aria-label="Moneda">${monOpts(c?.mon||'CRC')}</select><input class="iban" value="${esc(c?.iban||'')}" placeholder="CR00 0000 0000 0000 0000 00" aria-label="Cuenta IBAN"><button class="x" aria-label="Quitar cuenta" onclick="this.parentNode.remove()">×</button></div>`;
const filaTarjeta=(id,i,t)=>`<div class="erow ta"><input class="banco" value="${esc(t?.banco||'')}" placeholder="Banco" aria-label="Banco"><select class="mon" aria-label="Moneda">${monOpts(t?.mon||'USD')}</select><input class="ult" value="${esc(t?.ult||'')}" placeholder="Últimos 4" maxlength="4" inputmode="numeric" aria-label="Últimos 4 dígitos" oninput="this.value=this.value.replace(/\\D/g,'')"><input class="alias" value="${esc(t?.alias||'')}" placeholder="Nombre (opcional)" aria-label="Nombre de la tarjeta"><button class="x" aria-label="Quitar tarjeta" onclick="this.parentNode.remove()">×</button></div>`;
function addFila(id,t){$(`e-${id}-${t}`).insertAdjacentHTML('beforeend',t==='cu'?filaCuenta(id):filaTarjeta(id));$(`e-${id}-ta0`)?.remove();$(`e-${id}-${t}`).lastElementChild.querySelector('input').focus()}
function gEmp(id){
  const v=k=>$(`e-${id}-${k}`).value.trim(),er=$(`e-${id}-err`);er.textContent='';
  const d={nombre:v('nombre'),cedula:v('cedula'),tel:v('tel'),fax:v('fax'),apartado:v('apartado'),correo:v('correo'),dir:v('dir'),campo:v('campo')};
  if(!d.nombre||!d.cedula||!d.campo)return er.textContent='Completa al menos el nombre, la cédula jurídica y el texto del campo Empresa.';
  const cuentas=[...document.querySelectorAll(`#e-${id}-cu .erow`)].map(r=>({banco:r.querySelector('.banco').value.trim().toUpperCase(),mon:r.querySelector('.mon').value,iban:r.querySelector('.iban').value.trim().toUpperCase().replace(/\s+/g,' ')})).filter(c=>c.banco||c.iban);
  const tarjetas=[...document.querySelectorAll(`#e-${id}-ta .erow`)].map(r=>({banco:r.querySelector('.banco').value.trim().toUpperCase(),mon:r.querySelector('.mon').value,ult:r.querySelector('.ult').value.trim(),alias:r.querySelector('.alias').value.trim()})).filter(t=>t.banco||t.ult);
  if(!cuentas.length)return er.textContent='Debe quedar al menos una cuenta bancaria.';
  for(const c of cuentas){if(!c.banco)return er.textContent='Falta el banco en una de las cuentas.';if(!IBAN_RE.test(c.iban))return er.textContent=`La cuenta "${c.iban}" no es un IBAN de Costa Rica válido.`}
  if(new Set(cuentas.map(c=>sinEsp(c.iban))).size<cuentas.length)return er.textContent='Hay una cuenta repetida.';
  for(const t of tarjetas){if(!t.banco)return er.textContent='Falta el banco en una de las tarjetas.';if(!/^\d{4}$/.test(t.ult))return er.textContent='Cada tarjeta necesita sus últimos 4 dígitos.'}
  if(new Set(tarjetas.map(t=>t.ult)).size<tarjetas.length)return er.textContent='Hay dos tarjetas con los mismos 4 dígitos.';
  const sid=S.empData[id]?.sid,f={Title:id,Nombre:d.nombre,Cedula:d.cedula,Telefono:d.tel,Fax:d.fax,Apartado:d.apartado,Correo:d.correo,Direccion:d.dir,CampoEmpresa:d.campo,Cuentas:JSON.stringify(cuentas),Tarjetas:JSON.stringify(tarjetas)};
  act(()=>sid?setItem('bemp',sid,f):addItem('bemp',f),EMPRESAS[id].largo+' guardada',()=>{if(B.nb&&B.nb.emp===id){const E=EMP(id);if(!E.cuentas.some(c=>c.iban===B.nb.cta))B.nb.cta=E.cuentas[0]?.iban||'';if(!E.tarjetas.some(t=>t.ult===B.nb.tar))B.nb.tar=E.tarjetas[0]?.ult||''}render()});
}


boot();
</script>
</body>
</html>
